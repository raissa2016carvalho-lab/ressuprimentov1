<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aprovadores — Ressuprimento</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#0f172a}
.header{background:#1e293b;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-title{font-size:15px;font-weight:700}
.header-sub{font-size:12px;color:#94a3b8;margin-top:2px}
.btn-sair{border:1px solid #334155;background:#1e293b;color:#cbd5e1;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.corpo{padding:20px 24px;max-width:1400px;margin:0 auto}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
select,input{padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;font-size:13px;background:#fff;font-family:inherit;outline:none}
select:focus,input:focus{border-color:#1e40af}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.card-header{padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-nome{font-size:14px;font-weight:700;color:#0f172a}
.card-nivel{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
.nivel-N1{background:#dbeafe;color:#1e40af}
.nivel-N2{background:#fef3c7;color:#b45309}
.nivel-N3{background:#fce7f3;color:#9d174d}
.nivel-Misto{background:#f1f5f9;color:#475569}
.badge-qtd{background:#1e40af1a;color:#1e40af;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.badge-sla{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.sla-ok{background:#dcfce7;color:#166534}
.sla-alerta{background:#fef3c7;color:#b45309}
.sla-critico{background:#fee2e2;color:#991b1b}
.card-body{padding:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#64748b;font-weight:600;font-size:11px;padding:8px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
td{padding:7px 14px;border-bottom:1px solid #f8fafc;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.mono{font-family:ui-monospace,monospace;font-size:11.5px}
.status-badge{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px}
.status-aprovado{background:#dcfce7;color:#166534}
.status-pendente{background:#fef3c7;color:#b45309}
.status-reprovado{background:#fee2e2;color:#991b1b}
.vazio{text-align:center;color:#94a3b8;padding:40px;font-size:13.5px}
.loading{text-align:center;padding:60px;color:#64748b;font-size:14px}
.kpi-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 18px;min-width:120px}
.kpi-val{font-size:24px;font-weight:800;color:#0f172a}
.kpi-label{font-size:11px;color:#64748b;font-weight:600;margin-top:2px}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">📋 Aprovadores — Pedidos em Aberto</div>
    <div class="header-sub" id="user-info">Carregando...</div>
  </div>
  <button class="btn-sair" id="btn-sair">Sair</button>
</div>

<div class="corpo">
  <!-- KPIs -->
  <div class="kpi-bar" id="kpi-bar"></div>

  <!-- Filtros -->
  <div class="filtros">
    <select id="filtro-nivel" onchange="renderCards()">
      <option value="">Todos os níveis</option>
      <option value="N1">N1</option>
      <option value="N2">N2</option>
      <option value="N3">N3</option>
    </select>
    <select id="filtro-filial" onchange="renderCards()">
      <option value="">Todas as filiais</option>
      <option value="01">01 — MATRIZ</option>
      <option value="03">03 — PAU DOS FERROS</option>
      <option value="04">04 — ITAPIPOCA</option>
      <option value="06">06 — CURRAIS NOVOS</option>
      <option value="07">07 — SOBRAL</option>
      <option value="08">08 — APARECIDA DE GOIANIA</option>
      <option value="09">09 — MARACANAU</option>
      <option value="10">10 — MOSSORO</option>
      <option value="11">11 — ANAPOLIS</option>
      <option value="13">13 — ALAGOINHAS</option>
      <option value="14">14 — RIBEIRA DO POMBAL</option>
      <option value="15">15 — PAULO AFONSO</option>
      <option value="22">22 — GOIANIA</option>
      <option value="23">23 — BATURITE</option>
      <option value="24">24 — MORRINHOS</option>
      <option value="25">25 — CASCAVEL</option>
      <option value="27">27 — CAUCAIA</option>
      <option value="29">29 — HORIZONTE</option>
      <option value="34">34 — SENHOR DO BONFIM</option>
      <option value="36">36 — LUZIANIA</option>
      <option value="37">37 — DIVINOPOLIS</option>
      <option value="40">40 — GARANHUNS</option>
      <option value="41">41 — FLORIANO</option>
      <option value="42">42 — LIVRAMENTO DE NOSSA SENHORA</option>
      <option value="43">43 — HORTOLANDIA</option>
    </select>
    <input id="filtro-aprovador" placeholder="🔍 Buscar aprovador..." oninput="renderCards()" style="min-width:220px"/>
    <button onclick="carregar()" style="background:#1e40af;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer">↻ Atualizar</button>
  </div>

  <div id="conteudo"><div class="loading">⏳ Carregando dados...</div></div>
</div>

<script>
const SUPABASE_URL = "https://vvwtqbehfwrgcmbjdniu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d3RxYmVoZndyZ2NtYmpkbml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjg3NTcsImV4cCI6MjA5NzEwNDc1N30.jHxva16Nae109RiWDlgl21saOJ6gBihstMmlKRRBXis";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let todosRegistros = [];
let hoje = new Date();

function diasDesde(dataStr) {
  if (!dataStr) return null;
  const d = new Date(dataStr);
  return Math.floor((hoje - d) / 86400000);
}

function fmtData(dataStr) {
  if (!dataStr) return '—';
  const d = new Date(dataStr);
  return d.toLocaleDateString('pt-BR');
}

function slaBadge(dias) {
  if (dias === null) return '<span style="color:#cbd5e1">—</span>';
  const cls = dias <= 3 ? 'sla-ok' : dias <= 7 ? 'sla-alerta' : 'sla-critico';
  return `<span class="badge-sla ${cls}">${dias}d</span>`;
}

function statusBadge(st) {
  if (!st) return '<span style="color:#cbd5e1">—</span>';
  const s = st.toLowerCase();
  const cls = s.includes('aprov') ? 'status-aprovado' : s.includes('reprov') || s.includes('rejeit') ? 'status-reprovado' : 'status-pendente';
  return `<span class="status-badge ${cls}">${st}</span>`;
}

async function carregar() {
  $('conteudo').innerHTML = '<div class="loading">⏳ Carregando...</div>';
  
  let rows = [], off = 0;
  while (true) {
    const { data } = await db.from('aprovadores_pcs').select('*').range(off, off + 999);
    if (!data || !data.length) break;
    rows = rows.concat(data);
    if (data.length < 1000) break;
    off += 1000;
  }

  // Filtrar só pendentes (nivel_atual != Concluído)
  todosRegistros = rows.filter(r => r.nivel_atual && r.nivel_atual !== 'Concluído');
  renderCards();
}

function renderCards() {
  const filtroNivel    = $('filtro-nivel').value;
  const filtroFilial   = $('filtro-filial').value;
  const filtroAprov    = ($('filtro-aprovador').value || '').toLowerCase().trim();

  // Filtrar registros
  let filtrados = todosRegistros.filter(r => {
    if (filtroNivel && r.nivel_atual !== filtroNivel) return false;
    if (filtroFilial && (r.c7_filial || '').trim() !== filtroFilial) return false;
    if (filtroAprov) {
      const aprov = [r.aprovador_n1, r.aprovador_n2, r.aprovador_n3].filter(Boolean).join(' ').toLowerCase();
      if (!aprov.includes(filtroAprov)) return false;
    }
    return true;
  });

  // Agrupar por aprovador atual
  const porAprovador = {};
  filtrados.forEach(r => {
    let aprovAtual = null;
    if (r.nivel_atual === 'N1') aprovAtual = r.aprovador_n1 || 'N1 — Sem aprovador';
    else if (r.nivel_atual === 'N2') aprovAtual = r.aprovador_n2 || 'N2 — Sem aprovador';
    else if (r.nivel_atual === 'N3') aprovAtual = r.aprovador_n3 || 'N3 — Sem aprovador';
    else aprovAtual = r.nivel_atual || 'Desconhecido';

    if (!porAprovador[aprovAtual]) porAprovador[aprovAtual] = { nivel: r.nivel_atual, rows: [] };
    porAprovador[aprovAtual].rows.push(r);
  });

  // KPIs
  const totalPCs = filtrados.length;
  const totalAprovadores = Object.keys(porAprovador).length;
  const slaMedio = filtrados.reduce((s, r) => {
    const d = diasDesde(r.data_aprovacao_n1);
    return d !== null ? s + d : s;
  }, 0) / (filtrados.length || 1);

  $('kpi-bar').innerHTML = `
    <div class="kpi"><div class="kpi-val">${totalPCs}</div><div class="kpi-label">PCs em aberto</div></div>
    <div class="kpi"><div class="kpi-val">${totalAprovadores}</div><div class="kpi-label">Aprovadores ativos</div></div>
    <div class="kpi"><div class="kpi-val" style="color:${slaMedio>7?'#ef4444':slaMedio>3?'#d97706':'#16a34a'}">${Math.round(slaMedio)}d</div><div class="kpi-label">SLA médio</div></div>
    <div class="kpi"><div class="kpi-val" style="color:#ef4444">${filtrados.filter(r=>diasDesde(r.data_aprovacao_n1)>7).length}</div><div class="kpi-label">Acima de 7 dias</div></div>
  `;

  if (!Object.keys(porAprovador).length) {
    $('conteudo').innerHTML = '<div class="vazio">Nenhum pedido pendente encontrado.</div>';
    return;
  }

  // Ordenar por qtd desc
  const aprovList = Object.entries(porAprovador).sort((a, b) => b[1].rows.length - a[1].rows.length);

  $('conteudo').innerHTML = `<div class="cards-grid">${aprovList.map(([aprovador, info]) => {
    const rows = info.rows.sort((a, b) => {
      const da = diasDesde(a.data_aprovacao_n1) || 0;
      const db2 = diasDesde(b.data_aprovacao_n1) || 0;
      return db2 - da;
    });
    const slaMax = Math.max(...rows.map(r => diasDesde(r.data_aprovacao_n1) || 0));
    const slaCls = slaMax > 7 ? 'sla-critico' : slaMax > 3 ? 'sla-alerta' : 'sla-ok';
    const nivelCls = `nivel-${info.nivel || 'Misto'}`;

    const linhas = rows.map(r => {
      const nivel = r.nivel_atual;
      const dtInicio = nivel === 'N1' ? r.data_aprovacao_n1 : nivel === 'N2' ? (r.data_aprovacao_n1 || r.data_aprovacao_n2) : (r.data_aprovacao_n2 || r.data_aprovacao_n1);
      const dias = diasDesde(dtInicio);
      const situacaoAtual = nivel === 'N1' ? r.situacao_n1 : nivel === 'N2' ? r.situacao_n2 : r.situacao_n3;
      return `<tr>
        <td class="mono">${(r.c7_filial||'').trim()}</td>
        <td class="mono">${(r.c7_num||'').trim()}</td>
        <td class="mono">${(r.c7_numsc||'').trim() || '—'}</td>
        <td><span class="card-nivel ${nivelCls}">${nivel}</span></td>
        <td>${statusBadge(situacaoAtual)}</td>
        <td>${slaBadge(dias)}</td>
      </tr>`;
    }).join('');

    return `<div class="card">
      <div class="card-header">
        <div>
          <div class="card-nome">${aprovador}</div>
          <div style="font-size:11px;color:#64748b;margin-top:2px">Nível atual: <strong>${info.nivel}</strong></div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="badge-qtd">${rows.length} PC(s)</span>
          <span class="badge-sla ${slaCls}">máx ${slaMax}d</span>
        </div>
      </div>
      <div class="card-body">
        <table>
          <tr>
            <th>Filial</th>
            <th>Nº PC</th>
            <th>Nº SC</th>
            <th>Nível</th>
            <th>Situação</th>
            <th>SLA</th>
          </tr>
          ${linhas}
        </table>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// Login
async function verificarSessao() {
  const { data } = await db.auth.getSession();
  if (data.session) {
    $('user-info').textContent = data.session.user.email;
    carregar();
  } else {
    location.href = 'index.html';
  }
}

$('btn-sair').addEventListener('click', async () => { await db.auth.signOut(); location.href = 'index.html'; });

verificarSessao();
</script>
</body>
</html>
