<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B&Q Energia — Fechamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0d1f3c;
  --navy-mid:#162d54;
  --navy-light:#1e3a6e;
  --orange:#e87722;
  --orange-hover:#d46a1c;
  --orange-glow:rgba(232,119,34,.35);
  --orange-soft:rgba(232,119,34,.08);
  --silver:#f0f2f6;
  --ink:#0c1629;
  --ink-muted:#7b8baa;
  --white:#ffffff;
  --danger:#ef4444;
}

html,body{height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}

/* ─── FUNDO ─────────────────────────────────────────── */
.bg-scene{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(155deg,var(--navy) 0%,var(--navy-mid) 45%,#0a1628 100%);
}

/* Malha sutil */
.grid-lines{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(232,119,34,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,119,34,.04) 1px, transparent 1px);
  background-size:50px 50px;
  animation:gridDrift 25s linear infinite;
}
@keyframes gridDrift{to{background-position:50px 50px}}

/* Orbes de marca */
.orb{position:absolute;border-radius:50%;filter:blur(90px);animation:orbFloat 10s ease-in-out infinite alternate}
.orb-1{width:500px;height:500px;background:var(--orange);opacity:.08;top:-150px;right:-120px}
.orb-2{width:350px;height:350px;background:var(--navy-light);opacity:.25;bottom:-80px;left:-100px;animation-delay:4s}
.orb-3{width:220px;height:220px;background:var(--orange);opacity:.05;top:55%;left:55%;animation-delay:6s}
@keyframes orbFloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(25px,-15px) scale(1.08)}}

/* Linhas de transmissão */
.tl{position:absolute;height:1px;left:0;right:0;opacity:.06;background:linear-gradient(90deg,transparent,var(--orange),transparent);animation:tlPulse 5s ease-in-out infinite}
.tl-1{top:28%}.tl-2{top:52%;animation-delay:2s}.tl-3{top:76%;animation-delay:3.5s}
@keyframes tlPulse{0%,100%{opacity:.03}50%{opacity:.1}}

/* ─── LAYOUT DIVIDIDO ───────────────────────────────── */
.login-stage{
  position:relative;z-index:1;
  display:flex;height:100%;
}

/* Painel esquerdo — marca */
.brand-panel{
  flex:1;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;
  padding:60px 80px;color:var(--white);
  position:relative;
}
.brand-panel::after{
  content:'';position:absolute;right:0;top:10%;bottom:10%;width:1px;
  background:linear-gradient(transparent,rgba(232,119,34,.2),transparent);
}

.brand-logo{
  font-size:56px;font-weight:800;letter-spacing:-1px;line-height:1;
  margin-bottom:12px;
  font-style:italic;
}
.brand-logo span{color:var(--orange)}

.brand-tagline{
  font-size:17px;font-weight:300;color:rgba(255,255,255,.55);
  line-height:1.6;max-width:380px;margin-bottom:40px;
}
.brand-tagline strong{font-weight:600;color:rgba(255,255,255,.8)}

.brand-stats{display:flex;gap:40px}
.stat{text-align:left}
.stat-num{
  font-size:32px;font-weight:800;
  background:linear-gradient(135deg,var(--orange),#f5a623);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.stat-label{font-size:12px;color:rgba(255,255,255,.4);margin-top:2px;font-weight:500}

/* Painel direito — form */
.form-panel{
  width:480px;min-width:480px;
  display:flex;align-items:center;justify-content:center;
  padding:40px;
}

.login-card{
  width:100%;max-width:400px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(40px) saturate(1.5);
  -webkit-backdrop-filter:blur(40px) saturate(1.5);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:44px 36px 36px;
  box-shadow:0 32px 80px rgba(0,0,0,.4);
}

.card-title{
  font-size:22px;font-weight:700;color:var(--white);
  margin-bottom:6px;letter-spacing:-.3px;
}
.card-sub{font-size:13px;color:var(--ink-muted);margin-bottom:32px}

/* Campos */
.field{margin-bottom:20px}
.field-label{
  display:block;font-size:12px;font-weight:600;
  color:rgba(255,255,255,.45);margin-bottom:8px;letter-spacing:.3px;
}
.field-input{
  width:100%;padding:14px 16px;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:12px;
  color:#fff;font-size:15px;font-family:inherit;
  transition:border-color .2s,box-shadow .2s,background .2s;
  outline:none;
}
.field-input::placeholder{color:rgba(255,255,255,.2)}
.field-input:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 3px var(--orange-glow);
  background:rgba(255,255,255,.08);
}

/* Botão */
.btn-login{
  width:100%;padding:15px;margin-top:8px;
  background:linear-gradient(135deg,var(--orange),#d46a1c);
  color:#fff;font-size:15px;font-weight:700;font-family:inherit;
  border:none;border-radius:12px;cursor:pointer;
  letter-spacing:.2px;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 24px var(--orange-glow);
  position:relative;overflow:hidden;
}
.btn-login::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.18),transparent);
  opacity:0;transition:opacity .2s;
}
.btn-login:hover::before{opacity:1}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 36px var(--orange-glow)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none}

.btn-login.loading .btn-text{opacity:0}
.btn-login.loading .btn-spinner{display:block}
.btn-spinner{
  display:none;position:absolute;inset:0;margin:auto;
  width:22px;height:22px;
  border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Erro */
.login-error{
  margin-top:16px;padding:12px 16px;
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.2);
  border-radius:10px;
  color:#fca5a5;font-size:13px;font-weight:500;
  text-align:center;display:none;
  animation:shakeIn .4s ease;
}
@keyframes shakeIn{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(2px)}
}

.card-footer{
  text-align:center;margin-top:28px;
  font-size:11px;color:rgba(255,255,255,.18);letter-spacing:.3px;
}

/* ─── MOBILE ────────────────────────────────────────── */
@media(max-width:960px){
  .brand-panel{display:none}
  .form-panel{width:100%;min-width:0;padding:24px}
  .login-card{max-width:420px}
  .card-title::before{
    content:'⚡';display:block;font-size:36px;margin-bottom:16px;
    font-style:normal;
  }
}
</style>
</head>
<body>

<div class="bg-scene">
  <div class="grid-lines"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="tl tl-1"></div>
  <div class="tl tl-2"></div>
  <div class="tl tl-3"></div>
</div>

<div class="login-stage">

  <!-- Painel de marca -->
  <div class="brand-panel">
    <div class="brand-logo"><span>B</span>&<span>Q</span></div>
    <div class="brand-tagline">
      <strong>Construindo o futuro</strong> com a energia de quem sempre esteve presente.
      <br><br>Há 38 anos, unindo energias para ir mais longe.
    </div>
    <div class="brand-stats">
      <div class="stat">
        <div class="stat-num">38</div>
        <div class="stat-label">anos de história</div>
      </div>
      <div class="stat">
        <div class="stat-num">25+</div>
        <div class="stat-label">filiais</div>
      </div>
      <div class="stat">
        <div class="stat-num">⚡</div>
        <div class="stat-label">energia que move</div>
      </div>
    </div>
  </div>

  <!-- Painel de login -->
  <div class="form-panel">
    <div class="login-card">
      <div class="card-title">Fechamento de Consumo</div>
      <div class="card-sub">Entre com suas credenciais para acessar o painel.</div>

      <form id="login-form" onsubmit="return fazerLogin(event)">
        <div class="field">
          <label class="field-label" for="usuario">E-mail</label>
          <input class="field-input" type="email" id="usuario" placeholder="seu@email.com" autocomplete="email" required autofocus>
        </div>
        <div class="field">
          <label class="field-label" for="senha">Senha</label>
          <input class="field-input" type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>
        <button class="btn-login" type="submit" id="btn-entrar">
          <span class="btn-text">Entrar</span>
          <div class="btn-spinner"></div>
        </button>
      </form>

      <div class="login-error" id="login-error"></div>

      <div class="card-footer">
        Sistema de Ressuprimento &nbsp;•&nbsp; v1.1
      </div>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL='https://eugefrjckrxisfpizkjb.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Z2Vmcmpja3J4aXNmcGl6a2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzEzNjksImV4cCI6MjEwNDAwNzM2OX0.sNQjKjlUm1TWeiDGG2SDeER7GGaf4PucofJWNKxqygI';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const sessao=sessionStorage.getItem('fechamento_usuario');
if(sessao) window.location.href='fechamento.html';

async function fazerLogin(e){
  e.preventDefault();
  const btn=document.getElementById('btn-entrar');
  const erro=document.getElementById('login-error');
  const email=document.getElementById('usuario').value.trim();
  const senha=document.getElementById('senha').value;
  if(!email||!senha)return;

  btn.classList.add('loading');
  erro.style.display='none';

  try{
    const{data,error}=await db.auth.signInWithPassword({email,password:senha});

    if(error){
      mostrarErro('Usuário ou senha incorretos.');
      document.getElementById('senha').value='';
      document.getElementById('senha').focus();
      return;
    }

    const user=data.user;
    const meta=user.user_metadata||{};

    sessionStorage.setItem('fechamento_usuario',JSON.stringify({
      id:user.id,
      nome:meta.nome||meta.name||email.split('@')[0],
      cargo:meta.cargo||meta.role||'',
      email:user.email,
      login:new Date().toISOString()
    }));

    window.location.href='fechamento.html';
  }catch(err){
    console.error(err);
    mostrarErro('Erro de conexão. Tente novamente.');
  }finally{
    btn.classList.remove('loading');
  }
}

function mostrarErro(msg){
  const el=document.getElementById('login-error');
  el.textContent=msg;
  el.style.display='block';
}
</script>
</body>
</html>
