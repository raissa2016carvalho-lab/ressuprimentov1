<script>
const db=window.supabase.createClient('https://eugefrjckrxisfpizkjb.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Z2Vmcmpja3J4aXNmcGl6a2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzEzNjksImV4cCI6MjEwNDAwNzM2OX0.sNQjKjlUm1TWeiDGG2SDeER7GGaf4PucofJWNKxqygI');
const $=id=>document.getElementById(id);

// Prazo da SC até a chegada (8 em cada 10 compras recebidas em 2026), em meses
const PRAZO={EPI:71/30.44,FARD:99/30.44};
const DIAS_PRAZO=g=>Math.round(PRAZO[g]*30.44);
const MESES_SOBRA=6;
const PESO_MOB=.3;      // marca o item quando 30% ou mais da saída foi mobilização     // filial com mais que isso de estoque pode transferir
const POR_PAGINA=100;
// SC sem pedido ainda em andamento / pedido ainda não recebido por inteiro
const SC_ABERTA=['Solicitação Pendente','Solicitação Bloqueada','Solicitação em Processo de Cotação'];
const PC_ABERTO=['Pendente','Em aprovação','Recebido parcialmente','Em recebimento (Pré-nota)','Sem status'];

let LINHAS=[],NOMES_FIL={},ITEM={},DADOS=null,FORMFIL={},POP=null;
let ABA='risco',PILL='pedir',SIT='vencida',PAG=1,SORT=null,DIR=1;
let TROCAS=null,VIDA=null,FILTRADOS=[];
let VISTA='filiais'; // cartões por filial ('filiais') ou por item ('itens') → lista ao clicar ('lista')
let ORIGEM='filiais',ITEM_SEL='',ORD_ITEM='saida',TOP=30;

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN=(v,d=0)=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtR=v=>'R$ '+fmtN(v);
const fmtCurto=v=>{v=Number(v)||0;return v>=1e6?'R$ '+fmtN(v/1e6,1)+' mi':v>=1e3?'R$ '+fmtN(v/1e3)+' mil':fmtR(v)};
const fmtMes=m=>m?['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][Number(m.slice(4,6))-1]+'/'+m.slice(2,4):'';
const ymd8=s=>String(s||'').replace(/-/g,'').slice(0,8);
const fmtData=s=>{s=ymd8(s);return s.length===8?s.slice(6,8)+'/'+s.slice(4,6)+'/'+s.slice(2,4):'—'};
const dataDe=s=>{s=ymd8(s);return new Date(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T12:00:00')};
const nomeFil=f=>{const k=String(f||'').trim();const n=(NOMES_FIL[k.replace(/^0+/,'')]||'').replace(/^FILIAL\s+/i,'').toUpperCase();return n||k};
const grupoKey=g=>/^FARD/i.test(g||'')?'FARD':'EPI';
// Botas e calçados ficam num filtro próprio (saem de "EPI / EPC / Ferramentas")
const ehBota=d=>/^(BOTA|BOTINA|TENIS|SAPATO)\b/i.test(String(d||'').trim());
const grupoOk=(gk,desc,gr)=>!gr||(gr==='BOTA'?ehBota(desc):gr==='EPI'?gk==='EPI'&&!ehBota(desc):gk===gr);
const nomeGrupo=(gk,desc)=>ehBota(desc)?'Botas e calçados':gk==='FARD'?'Fardamento':'EPI / EPC / Ferramentas';
const ymd=d=>''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');

function janela(){const r=[],d=new Date();for(let i=5;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1);r.push(''+m.getFullYear()+String(m.getMonth()+1).padStart(2,'0'))}return r}

// Busca todas as páginas de uma consulta (o banco devolve no máx. 1000 linhas por vez)
// No máximo 3 consultas ao banco ao mesmo tempo (muitas juntas pesam quando um sync está rodando)
const MAX_CONSULTAS=3,FILA=[];let emCurso=0;
function limitar(fn){
  return new Promise((ok,falha)=>{
    const ir=()=>{emCurso++;Promise.resolve().then(fn).then(ok,falha).finally(()=>{emCurso--;if(FILA.length)FILA.shift()()})};
    emCurso<MAX_CONSULTAS?ir():FILA.push(ir);
  });
}
const bancoOcupado=e=>/57014|statement timeout|timeout/i.test((e&&(e.code+' '+e.message))||String(e));

async function buscarTodas(montar){
  let all=[],off=0;
  for(;;){
    let data,error;
    // banco ocupado (ex.: sync rodando) pode estourar o tempo: tenta de novo até 2 vezes, esperando 3 s e 6 s
    for(let t=0;t<3;t++){({data,error}=await limitar(async()=>await montar().range(off,off+999)));if(!error)break;if(t<2)await new Promise(r=>setTimeout(r,3000*(t+1)))}
    if(error)throw error;
    if(!data||!data.length)break;
    all=all.concat(data);
    if(data.length<1000)break;
    off+=1000;
  }
  return all;
}

async function carregar(){
  $('tabela').innerHTML='<div class="loading">Carregando estoque, consumo, SCs e pedidos...</div>';
  $('tag-sync').textContent='Carregando...';$('paginador').style.display='none';
  TROCAS=null;VIDA=null;
  try{
    const W=janela(),hoje=new Date();
    const filtroGrupo='grupo.ilike.EPI*,grupo.ilike.FARDAMENTO*';
    const [itens,estoque,consumo,mot,scs,pcs,fils,est_ts,tps,forms]=await Promise.all([
      buscarTodas(()=>db.from('itens').select('codigo,descricao,grupo,preco').or(filtroGrupo).order('codigo')),
      buscarTodas(()=>db.from('estoque_sb2').select('filial,codigo,armazem,qtd_atual,saldo_pedido,custo_medio,dt_ult_movimento,atualizado_em').or(filtroGrupo).order('id')),
      buscarTodas(()=>db.from('consumo_mensal').select('filial,produto,mes,quantidade').gte('mes',W[0]).order('id')),
      // saídas de mobilização e admissional (para tirar do consumo — kits de equipe nova são compra direcionada)
      buscarTodas(()=>db.rpc('consumo_por_motivo',{p_mes_ini:W[0],p_motivos:['MOBILIZAÇÃO','ADMISSIONAL']})).catch(e=>{console.warn('consumo_por_motivo',e);return null}),
      // SCs ainda sem pedido (último ano)
      buscarTodas(()=>db.from('sc_pedidos_v2').select('filial,sc_numero,sc_item,sc_produto,sc_quant,sc_quje,sc_emissao,sc_status,sc_solicitante').is('pc_numero',null).in('sc_status',SC_ABERTA).gte('sc_emissao',ymd(new Date(hoje.getTime()-365*864e5))).order('sc_emissao').order('id')),
      // pedidos ainda não recebidos (entrega a partir de 180 dias atrás)
      // (ordenar só por id fazia o banco percorrer a tabela toda pelo índice e estourar o tempo limite)
      buscarTodas(()=>db.from('sc_pedidos_v2').select('filial,pc_filial,pc_numero,sc_numero,sc_produto,pc_quant,pc_valor,pc_status,pc_dt_entrega,pc_fornecedor,pc_comprador').not('pc_numero','is',null).in('pc_status',PC_ABERTO).gte('pc_dt_entrega',ymd(new Date(hoje.getTime()-180*864e5))).order('pc_dt_entrega').order('id')),
      limitar(async()=>await db.from('filiais').select('filial,nome_filial')),
      limitar(async()=>await db.from('estoque_sb2').select('atualizado_em').order('atualizado_em',{ascending:false}).limit(1)),
      // trocas previstas de itens pessoais dentro do prazo de cada grupo (calculado no banco: mv_trocas_pessoa)
      limitar(async()=>await db.rpc('trocas_previstas',{p_dias_epi:DIAS_PRAZO('EPI'),p_dias_fard:DIAS_PRAZO('FARD')})),
      // último formulário de ressuprimento de cada filial (sem ele, o painel segue sem a auditoria)
      carregarFormularios().catch(e=>{console.warn('formularios',e);return null})
    ]);
    NOMES_FIL={};(fils.data||[]).forEach(f=>{NOMES_FIL[String(f.filial).trim().replace(/^0+/,'')]=String(f.nome_filial||'').trim()});
    ITEM={};itens.forEach(i=>{ITEM[String(i.codigo).trim()]=i});
    DADOS={W,hoje,estoque,consumo,mot,scs,pcs,tps,forms};
    calcular();

    montarFiliais();
    if(VISTA!=='lista')$('f-filial').value='';
    const ts=est_ts.data?.[0]?.atualizado_em;
    $('tag-sync').textContent=fmtN(LINHAS.length)+' filial × item';
    $('tag-ultima').innerHTML='consumo '+fmtMes(W[0])+'–'+fmtMes(W[5])+(ts?' · estoque de <b style="color:#e2e8f0">'+new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</b>':'');
    aplicar();
    carregarTrocas();
  }catch(e){
    console.error(e);
    TROCAS=Object.assign([],{erro:e.message||String(e)});
    $('tabela').innerHTML=bancoOcupado(e)
      ?'<div class="vazio">⏳ <b>O banco está ocupado agora</b> (provavelmente algum sync do Protheus rodando) e não respondeu a tempo.<br>Espere os syncs terminarem e tente de novo.<br><br><button class="btn-atualizar" onclick="carregar()">↻ Tentar de novo</button></div>'
      :'<div class="vazio">Erro ao carregar: '+esc(e.message||e)+'<br><br><button class="btn-atualizar" onclick="carregar()">↻ Tentar de novo</button></div>';
    $('tag-sync').textContent='Erro ao carregar';
  }
}

// Último formulário de cada filial = a rodada mais recente (formulários da filial enviados até 15 dias antes do último;
// junta os CCs). Formulário recusado inteiro não conta (normalmente foi refeito).
const DIAS_RODADA=15;
const filKey=f=>{f=String(f||'').trim();return f.length===1?'0'+f:f};
async function carregarFormularios(){
  const {data:sols,error}=await limitar(async()=>await db.from('solicitacoes').select('id,filial,cc,status,sc_numero,criado_em,solicitante_nome,periodo_meses').neq('status','recusada').order('criado_em',{ascending:false}).limit(1000));
  if(error)throw error;
  const RODADA={};
  (sols||[]).forEach(s=>{
    const f=filKey(s.filial);if(!f)return;
    const r=RODADA[f]||(RODADA[f]={fil:f,ultimo:s.criado_em,forms:[]});
    if(new Date(r.ultimo)-new Date(s.criado_em)<=DIAS_RODADA*864e5)r.forms.push(s);
  });
  const ids=Object.values(RODADA).flatMap(r=>r.forms.map(f=>f.id));
  const itens=[];
  for(let i=0;i<ids.length;i+=50){
    const lote=ids.slice(i,i+50);
    itens.push(...await buscarTodas(()=>db.from('solicitacao_itens').select('id,solicitacao_id,codigo,qtd_sugerida,qtd_almoxarife,qtd_gerente,quantidade,situacao,justificativa,justificativa_gerente,master_alterado_em,master_alterado_por').in('solicitacao_id',lote).order('id')));
  }
  return{RODADA,itens};
}

// Monta LINHAS (uma por filial × item) a partir dos dados baixados; roda de novo quando muda o que sai do consumo
function calcular(){
    const {W,hoje,estoque,consumo,mot,scs,pcs,tps,forms}=DADOS;
    // estoque e "a caminho" por filial|código
    const EST={};
    estoque.forEach(e=>{
      const k=String(e.filial).trim()+'|'+String(e.codigo).trim();
      const o=EST[k]||(EST[k]={est:0,cam:0,custo:0,ult:'',arm:{},em:''});
      o.est+=Number(e.qtd_atual)||0;
      const ar=String(e.armazem||'').trim().replace(/^0+(?=\d\d)/,'')||'—';if(Number(e.qtd_atual))o.arm[ar]=(o.arm[ar]||0)+Number(e.qtd_atual);
      if(e.atualizado_em&&e.atualizado_em>o.em)o.em=e.atualizado_em;
      o.cam+=Math.max(0,Number(e.saldo_pedido)||0); // saldo negativo no Protheus = 0
      if(Number(e.custo_medio)>0)o.custo=Number(e.custo_medio);
      if(e.dt_ult_movimento&&ymd8(e.dt_ult_movimento)>o.ult)o.ult=ymd8(e.dt_ult_movimento);
    });
    // consumo por filial|código e mês → média, tipo de saída e pico
    const CONS={};
    consumo.forEach(c=>{
      const cod=String(c.produto).trim();if(!ITEM[cod])return;
      const k=String(c.filial).trim()+'|'+cod;
      const o=CONS[k]||(CONS[k]={});
      o[c.mes]=(o[c.mes]||0)+(Number(c.quantidade)||0);
    });
    // guarda o mês a mês original e por motivo (popup do consumo)
    const ORIG={},MOTMES={};
    Object.entries(CONS).forEach(([k,m])=>{ORIG[k]={...m}});
    (mot||[]).forEach(r=>{const k=String(r.filial).trim()+'|'+String(r.produto).trim();const o=(MOTMES[k]=MOTMES[k]||{});(o[r.mes]=o[r.mes]||{})[r.motivo]=(o[r.mes][r.motivo]||0)+(Number(r.quantidade)||0)});
    POP={W,ORIG,MOTMES,CONS};
    // quanto da saída de 6 meses veio de mobilização (marca o item, mesmo sem tirar do consumo)
    const MOB={},TOT6={},MOBMES={};
    Object.entries(CONS).forEach(([k,m])=>{TOT6[k]=Object.values(m).reduce((a,b)=>a+b,0)});
    (mot||[]).forEach(r=>{if(r.motivo!=='MOBILIZAÇÃO')return;const k=String(r.filial).trim()+'|'+String(r.produto).trim(),q=Number(r.quantidade)||0;MOB[k]=(MOB[k]||0)+q;(MOBMES[k]=MOBMES[k]||{})[r.mes]=(MOBMES[k][r.mes]||0)+q});
    Object.keys(MOB).forEach(k=>{const tot=Object.values(CONS[k]||{}).reduce((a,b)=>a+b,0);MOB[k]={q:Math.min(MOB[k],tot),pct:tot>0?Math.min(1,MOB[k]/tot):0}});
    // tira as saídas dos motivos marcados (mobilização / admissional)
    const tirar=[$('x-mob').checked&&'MOBILIZAÇÃO',$('x-adm').checked&&'ADMISSIONAL'].filter(Boolean),TIRADO={};
    $('aviso-mot').textContent=mot?'':'⚠ não foi possível separar mobilização — consumo com todas as saídas';
    (mot||[]).forEach(r=>{
      if(!tirar.includes(r.motivo))return;
      const k=String(r.filial).trim()+'|'+String(r.produto).trim(),o=CONS[k];if(!o||!(r.mes in o))return;
      const q=Math.min(o[r.mes],Number(r.quantidade)||0);o[r.mes]-=q;
      const t=TIRADO[k]||(TIRADO[k]={});t[r.motivo]=(t[r.motivo]||0)+q;
    });
    const MEDIA={};
    // maior pico do mês SEM as saídas de mobilização (se a mobilização ainda não foi tirada pela caixinha)
    const mobJaTirada=tirar.includes('MOBILIZAÇÃO');
    Object.entries(CONS).forEach(([k,m])=>{
      let tot=0,n=0,pico=0,mp='';
      W.forEach(mes=>{const q=m[mes]||0;if(q>0){tot+=q;n++}
        const qs=q-(mobJaTirada?0:Math.min(q,MOBMES[k]?.[mes]||0));if(qs>pico){pico=qs;mp=mes}});
      if(tot>0)MEDIA[k]={media:tot/W.length,n,pico,mp};
    });
    // trocas previstas por filial|código (sem a tabela, o painel segue só com o consumo)
    const TP={};
    if(tps.error)console.warn('trocas_previstas',tps.error);
    (tps.data||[]).forEach(t=>{TP[String(t.filial).trim()+'|'+String(t.produto).trim()]={prev:Number(t.previstas)||0,venc:Number(t.vencidas)||0,pessoas:Number(t.pessoas)||0}});
    // SCs abertas e pedidos em aberto por filial|código
    const SC={},PC={};
    scs.forEach(s=>{
      const cod=String(s.sc_produto||'').trim();if(!ITEM[cod])return;
      const qtd=Math.max(0,(Number(s.sc_quant)||0)-(Number(s.sc_quje)||0));if(!qtd)return;
      const k=String(s.filial).trim()+'|'+cod;
      (SC[k]=SC[k]||[]).push({sc:s.sc_numero,qtd,emissao:ymd8(s.sc_emissao),dias:Math.floor((hoje-dataDe(s.sc_emissao))/864e5),status:String(s.sc_status||'').replace('Solicitação ',''),solic:s.sc_solicitante||''});
    });
    pcs.forEach(p=>{
      const cod=String(p.sc_produto||'').trim();if(!ITEM[cod])return;
      const fil=String(p.pc_filial||p.filial||'').trim(),k=fil+'|'+cod;
      const atraso=Math.floor((hoje-dataDe(p.pc_dt_entrega))/864e5);
      (PC[k]=PC[k]||[]).push({pc:p.pc_numero,sc:p.sc_numero,qtd:Number(p.pc_quant)||0,valor:Number(p.pc_valor)||0,entrega:ymd8(p.pc_dt_entrega),atraso,status:p.pc_status||'',forn:p.pc_fornecedor||'',comp:p.pc_comprador||''});
    });
    // formulário: por filial|código, as quantidades de cada etapa; a final do master conta como já pedida enquanto não vira SC
    const FORM={};FORMFIL={};
    if(forms){
      const porId={};
      Object.values(forms.RODADA).forEach(r=>{
        FORMFIL[r.fil]={...r,itens:0,alm:0,ger:0,mst:0,rec:0};
        r.forms.forEach(f=>{porId[f.id]=f});
      });
      forms.itens.forEach(i=>{
        const f=porId[i.solicitacao_id];if(!f)return;
        const cod=String(i.codigo||'').trim(),fil=filKey(f.filial),k=fil+'|'+cod,R=FORMFIL[fil];
        const num=v=>v==null||v===''?null:Number(v);
        const sug=num(i.qtd_sugerida),alm=num(i.qtd_almoxarife),ger=num(i.qtd_gerente),fin=num(i.quantidade)??0;
        const rec=/recus/i.test(i.situacao||'');
        R.itens++;if(alm!=null&&sug!=null&&alm!==sug)R.alm++;if(ger!=null&&ger!==alm)R.ger++;if(i.master_alterado_em)R.mst++;if(rec)R.rec++;
        if(!ITEM[cod])return;
        const o=FORM[k]||(FORM[k]={sug:0,alm:0,ger:0,temGer:false,fin:0,rec:false,mst:false,pedido:0,forms:[],just:[]});
        o.sug+=sug||0;o.alm+=alm??fin;o.ger+=ger??alm??fin;o.temGer=o.temGer||ger!=null;o.fin+=rec?0:fin;o.rec=o.rec||rec;o.mst=o.mst||!!i.master_alterado_em;
        if(!rec&&!f.sc_numero)o.pedido+=fin; // ainda não virou SC: conta a final como já pedida
        o.forms.push(f);
        if(i.justificativa)o.just.push('almox: '+i.justificativa);if(i.justificativa_gerente)o.just.push('gerente: '+i.justificativa_gerente);
      });
    }
    // sobra por código (para sugerir transferência)
    const SOBRA={};
    Object.entries(EST).forEach(([k,o])=>{
      const [fil,cod]=k.split('|');const md=MEDIA[k]?.media||0;
      const sobra=o.est-md*MESES_SOBRA;
      if(sobra>0)(SOBRA[cod]=SOBRA[cod]||[]).push({fil,sobra:Math.floor(sobra),est:o.est});
    });

    LINHAS=[];
    new Set([...Object.keys(EST),...Object.keys(MEDIA),...Object.keys(TP),...Object.keys(SC),...Object.keys(PC),...Object.keys(FORM)]).forEach(k=>{
      const [fil,cod]=k.split('|');const it=ITEM[cod];if(!it)return;
      const e=EST[k]||{est:0,cam:0,custo:0,ult:'',arm:{},em:''},c=MEDIA[k]||{media:0,n:0,pico:0,mp:''},tp=TP[k]||{prev:0,venc:0,pessoas:0};
      const scl=SC[k]||[],pcl=PC[k]||[];
      const gk=grupoKey(it.grupo),prazo=PRAZO[gk];
      const tipo=c.n>=5?'regular':c.n>=3?'intermitente':c.n>=1?'pontual':tp.prev>0?'trocas':'sem';
      const alvoCons=Math.ceil(c.media*prazo); // pontual também usa a média; o pico vira só aviso (abaixoPico)
      const alvoTr=Math.ceil(tp.prev);
      const alvo=Math.max(alvoCons,alvoTr),porTrocas=alvoTr>alvoCons;
      const est=Math.max(0,e.est),cam=e.cam;
      const fm=FORM[k]||null,fq=fm?fm.pedido:0;
      if(!est&&!cam&&!alvo&&!scl.length&&!pcl.length&&!fm)return;
      const ritmo=Math.max(c.media,tp.prev/prazo); // saída por mês: consumo ou trocas, o que for maior
      const scQtd=scl.reduce((s,x)=>s+x.qtd,0);
      let status;
      if(alvo<=0)status='sem';
      else if(est>=alvo)status='ok';
      else if(est+cam>=alvo)status='depende';
      else if(est+cam+scQtd+fq>=alvo)status='solicitado';
      else status='pedir';
      const comprar=status==='pedir'?Math.ceil(alvo-est-cam-scQtd-fq):0;
      // veredito do último formulário (só nas filiais que têm formulário)
      const precisa=Math.max(0,Math.ceil(alvo-est-cam-scQtd)); // o que faltava sem contar o formulário
      let ver='';
      if(FORMFIL[fil]){
        if(!fm)ver={pedir:'fora',ok:'fora_est',depende:'fora_ped',solicitado:'fora_sc'}[status]||'';
        else if(status==='pedir')ver=fm.rec?'recusado':fm.fin<Math.max(fm.alm,fm.ger)?'cortado':'naocobre';
        else if(fm.rec)ver='rec_ok';
        else if(fm.fin>=3&&fm.fin>precisa*2&&fm.fin-precisa>=3)ver='amais';
        else ver='coberto';
      }
      const custo=e.custo||Number(it.preco)||0;
      const trf=status==='pedir'?(SOBRA[cod]||[]).filter(s=>s.fil!==fil&&s.sobra>=Math.max(1,comprar)).sort((a,b)=>b.sobra-a.sobra)[0]||null:null;
      const atrasados=pcl.filter(p=>p.atraso>0);
      const proxEntrega=pcl.filter(p=>p.atraso<=0).map(p=>p.entrega).sort()[0]||'';
      LINHAS.push({fil,filNome:nomeFil(fil),cod,desc:it.descricao||'',gk,tipo,media:c.media,tirado:TIRADO[k]||null,mob:MOB[k]?.q||0,pctMob:MOB[k]?.pct||0,tot6:TOT6[k]||0,pico:c.pico,mp:c.mp,est,cam,ult:e.ult,arm:e.arm,estEm:e.em,
        cob:ritmo>0?est/ritmo:null,prazo,alvo,alvoCons,trocas:alvoTr,venc:tp.venc,pessoas:tp.pessoas,porTrocas,
        fm,fq,precisa,ver,abaixoPico:tipo==='pontual'&&c.pico>0&&est+cam+scQtd+fq<c.pico,fSug:fm?fm.sug:-1,fAlm:fm?fm.alm:-1,fGer:fm&&fm.temGer?fm.ger:-1,fFin:fm?(fm.rec?0:fm.fin):-1,scs:scl,scQtd,pcs:pcl,atrasados,atrasoMax:atrasados.reduce((m,p)=>Math.max(m,p.atraso),0),proxEntrega,
        comprar,custo,valor:comprar*custo,status,ordem:{pedir:0,solicitado:1,depende:2,ok:3,sem:4}[status],trf,zerado:est<=0&&alvo>0});
    });
}

// Vida útil e trocas: próximas trocas por pessoa (vencidas e próximos 90 dias) e vida útil por item
async function carregarTrocas(){
  try{
    const [pes,vida]=await Promise.all([
      buscarTodas(()=>db.from('vw_trocas_pessoa').select('matricula,filial,cc,fam,gk,produto,qtd,ultima,proxima,vida_util,dias').lte('dias',90).order('proxima').order('matricula').order('fam')),
      buscarTodas(()=>db.from('mv_vida_util').select('fam,gk,codigos,n_trocas,pessoas_troca,p25,vida_util,p75').eq('pessoal',true).not('vida_util','is',null).order('n_trocas',{ascending:false}).order('fam'))
    ]);
    TROCAS=pes.map(t=>{const cod=String(t.produto||'').trim(),fil=String(t.filial||'').trim();return{fil,filNome:nomeFil(fil),mat:String(t.matricula||'').trim(),cc:t.cc||'',fam:t.fam,gk:t.gk,cod,
      desc:ITEM[cod]?.descricao||t.fam,qtd:Number(t.qtd)||1,ultima:t.ultima,proxima:t.proxima,vida:t.vida_util,dias:Number(t.dias)}});
    VIDA=vida.map(v=>({fam:v.fam,gk:v.gk,codigos:v.codigos||[],n:v.n_trocas,pessoas:v.pessoas_troca,p25:v.p25,vida:v.vida_util,p75:v.p75}));
  }catch(e){console.error(e);TROCAS=Object.assign([],{erro:e.message||String(e)});VIDA=[]}
  montarFiliais();
  if(ABA==='trocas')aplicar();else renderPills();
}

// filiais no filtro (posição, pedidos e trocas)
function montarFiliais(){
  const sel=$('f-filial'),atual=sel.value;
  const fsel=[...new Set([...LINHAS.map(l=>l.fil),...(TROCAS||[]).map(t=>t.fil)])].filter(Boolean).sort();
  sel.innerHTML='<option value="">Todas as filiais</option>'+fsel.map(f=>`<option value="${esc(f)}">${esc(f)} — ${esc(nomeFil(f))}</option>`).join('');
  if(fsel.includes(atual))sel.value=atual;
}

// ── FILTROS ──────────────────────────────────────────────
// Curva ABC calculada dentro da filial e do grupo escolhidos (busca e tipo de saída não mudam a classe):
// A = itens que somam 80% do que sai, B = próximos 15%, C = últimos 5%. Sem saída = sem classe.
function baseRisco(fil=$('f-filial').value,semCurva=false){
  const gr=$('f-grupo').value,porQtd=$('f-abc-por').value==='qtd',sel=semCurva?'':$('f-abc').value;
  const peso=l=>porQtd?Math.max(l.media,l.trocas/l.prazo):Math.max(l.media,l.trocas/l.prazo)*l.custo;
  const escopo=LINHAS.filter(l=>(!fil||l.fil===fil)&&grupoOk(l.gk,l.desc,gr));
  escopo.forEach(l=>{l.abc="";l.peso=peso(l)});
  const com=escopo.filter(l=>l.peso>0).sort((a,b)=>b.peso-a.peso);
  const tot=com.reduce((s,l)=>s+l.peso,0);let acum=0;
  com.forEach(l=>{const antes=acum/tot;acum+=l.peso;l.abc=antes<.8?'A':antes<.95?'B':'C'});
  const L=base(escopo,fil).filter(l=>!ITEM_SEL||l.cod===ITEM_SEL);
  return sel?L.filter(l=>l.abc&&sel.includes(l.abc)):L;
}

function base(lista,fil=$('f-filial').value){
  const gr=$('f-grupo').value,tp=$('f-tipo').value,q=$('f-busca').value.trim().toLowerCase();
  return lista.filter(l=>(!fil||l.fil===fil)&&grupoOk(l.gk,l.desc,gr)&&(!tp||!l.tipo||l.tipo===tp)&&
    (!q||l.cod.includes(q)||String(l.desc).toLowerCase().includes(q)||(l.mat&&l.mat.includes(q))));
}
const PILLS_RISCO=[['todos','Todos',()=>true],['pedir','🔴 Pedir agora',l=>l.status==='pedir'],['solicitado','📝 Já solicitado (SC ou formulário cobre)',l=>l.status==='solicitado'],
  ['depende','🟡 Depende da entrega',l=>l.status==='depende'],['zerado','✕ Zerados com saída',l=>l.zerado],['atrasado','⏰ Pedido atrasado',l=>l.atrasados.length>0],
  ['sc','SC aberta',l=>l.scs.length>0],['ff','📋 No formulário',l=>!!l.fm],['cortado','✂️ Cortado/recusado e vai faltar',l=>l.ver==='cortado'||l.ver==='recusado'],
  ['fora','❗ Ficou de fora e vai faltar',l=>l.ver==='fora'],['foraok','➖ Fora do formulário · já coberto',l=>/^fora_/.test(l.ver)],['amais','➕ Pediu a mais',l=>l.ver==='amais'],['pico','⚠ Abaixo do pico',l=>l.abaixoPico],['mob','🟣 Mobilização pesa',l=>l.pctMob>=PESO_MOB]];
const PILLS_TROCAS=[['vencida','Vencidas',t=>t.dias<0],['30','Próximos 30 dias',t=>t.dias>=0&&t.dias<=30],['90','Próximos 90 dias',t=>t.dias>=0],['todas','Todas',()=>true]];

function trocasFiltradas(sit=SIT){
  if(!TROCAS||TROCAS.erro)return[];
  const f=PILLS_TROCAS.find(p=>p[0]===sit);
  return base(TROCAS).filter(f?f[2]:()=>true);
}
// vida útil por item + trocas vencidas / próximos 30 dias (respeita filial, grupo e busca)
function vidaFiltrada(){
  if(!VIDA)return[];
  const fil=$('f-filial').value,gr=$('f-grupo').value,q=$('f-busca').value.trim().toLowerCase();
  const cont={};
  base(TROCAS&&!TROCAS.erro?TROCAS:[]).forEach(t=>{const o=cont[t.fam]||(cont[t.fam]={venc:0,p30:0});if(t.dias<0)o.venc++;else if(t.dias<=30)o.p30++});
  return VIDA.filter(v=>grupoOk(v.gk,v.fam,gr)&&(!q||v.fam.toLowerCase().includes(q)||v.codigos.some(c=>c.includes(q))||cont[v.fam])&&(!fil||cont[v.fam]))
    .map(v=>({...v,venc:cont[v.fam]?.venc||0,p30:cont[v.fam]?.p30||0}));
}

function aplicar(){
  if(ABA==='risco'&&VISTA!=='lista')FILTRADOS=[];
  else if(ABA==='risco'){
    const f=PILLS_RISCO.find(p=>p[0]===PILL)||PILLS_RISCO[0];
    FILTRADOS=baseRisco().filter(f[2]);
  }else FILTRADOS=SIT==='vida'?vidaFiltrada():trocasFiltradas();
  ordenar();PAG=1;render();
}
function ordenar(){
  const padrao=ABA==='risco'?(a,b)=>a.ordem-b.ordem||b.valor-a.valor||b.atrasoMax-a.atrasoMax||a.fil.localeCompare(b.fil)||a.cod.localeCompare(b.cod)
    :SIT==='vida'?(a,b)=>b.n-a.n:(a,b)=>a.dias-b.dias;
  if(!SORT){FILTRADOS.sort(padrao);return}
  FILTRADOS.sort((a,b)=>{let va=a[SORT]??'',vb=b[SORT]??'';if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();return DIR*(va<vb?-1:va>vb?1:0)||padrao(a,b)});
}
function sortBy(c){if(SORT===c)DIR=-DIR;else{SORT=c;DIR=1}ordenar();PAG=1;render()}
function setPill(p){if(ABA==='risco')PILL=p;else SIT=p;SORT=null;aplicar()}
function recalcular(){if(DADOS){calcular();aplicar()}}
function abrirFilial(f){VISTA='lista';ITEM_SEL='';$('f-filial').value=f;PILL='todos';SORT=null;aplicar();window.scrollTo({top:0})}
function abrirItem(c){VISTA='lista';ITEM_SEL=c;$('f-filial').value='';PILL='todos';SORT=null;aplicar();window.scrollTo({top:0})}
function voltar(){VISTA=ORIGEM;ITEM_SEL='';$('f-filial').value='';SORT=null;aplicar()}

function setAba(a){
  SORT=null;
  if(a==='trocas')ABA='trocas';
  else{ABA='risco';ORIGEM=a==='itens'?'itens':'filiais';VISTA=ORIGEM;ITEM_SEL='';$('f-filial').value='';TOP=30}
  $('aba-risco').classList.toggle('ativo',ABA==='risco'&&ORIGEM==='filiais');
  $('aba-itens').classList.toggle('ativo',ABA==='risco'&&ORIGEM==='itens');
  $('aba-trocas').classList.toggle('ativo',ABA==='trocas');
  aplicar();

function setOrdItem(o){ORD_ITEM=o;TOP=30;render()}

function renderPills(){
  let h;
  if(ABA==='risco'){
    if(VISTA!=='lista'){$('pills').style.display='none';return}
    const B=baseRisco();
    const f=$('f-filial').value;
    const titulo=(ITEM_SEL?ITEM_SEL+' — '+(ITEM[ITEM_SEL]?.descricao||''):'')+(ITEM_SEL&&f?' · ':'')+(f?f+' — '+nomeFil(f):ITEM_SEL?'':'Todas as filiais');
    h=`<button class="pill-btn pill-voltar" onclick="voltar()">← ${ORIGEM==='itens'?'Itens':'Filiais'}</button><span style="align-self:center;font-weight:800;font-size:13px;margin:0 6px">${esc(titulo)}</span><span class="pill-sep"></span>`+PILLS_RISCO.map(([k,t,f])=>`<button class="pill-btn ${PILL===k?'ativo':''}" onclick="setPill('${k}')">${t} (${fmtN(B.filter(f).length)})</button>`).join('');
  }else{
    const n=k=>TROCAS&&!TROCAS.erro?' ('+fmtN(trocasFiltradas(k).length)+')':'';
    h=PILLS_TROCAS.map(([k,t])=>`<button class="pill-btn ${SIT===k?'ativo':''}" onclick="setPill('${k}')">${t}${n(k)}</button>`).join('')+
      `<span class="pill-sep"></span><button class="pill-btn ${SIT==='vida'?'ativo':''}" onclick="setPill('vida')">Vida útil por item</button>`;
  }
  $('pills').style.display='';
  $('pills').innerHTML=h;
}

// Cartão do formulário (na lista de uma filial): quem mexeu e o que vai faltar — para apresentar à gerência
function cartaoFormulario(){
  const f=$('f-filial').value,R=FORMFIL[f];
  if(VISTA!=='lista'||!f||ITEM_SEL)return'';
  if(!R)return`<div class="resumo-card" style="flex-basis:100%"><div class="lab">📋 Sem formulário de ressuprimento registrado para esta filial.</div></div>`;
  const B=baseRisco(f,true),n=v=>B.filter(l=>l.ver===v),val=L=>fmtCurto(L.reduce((s,l)=>s+l.comprar*l.custo,0));
  const cort=[...n('cortado'),...n('recusado')],fora=n('fora'),foraok=B.filter(l=>/^fora_/.test(l.ver)),am=n('amais'),cob=n('coberto'),nc=n('naocobre');
  const fs=R.forms;
  return`<div class="resumo-card" style="flex-basis:100%;border-left:4px solid #7c3aed">
    <div style="display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline">
      <b style="font-size:14px">📋 Último formulário — ${fmtData(ymd8(String(R.ultimo).slice(0,10)))}</b>
      <span class="mini">${fs.map(x=>`nº ${x.id} · CC ${esc(x.cc)} · ${esc(x.status.replace('_',' '))}${x.sc_numero?' · SC '+esc(x.sc_numero):' · ainda sem SC'}${x.solicitante_nome?' · '+esc(x.solicitante_nome):''}`).join(' | ')}</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:12.5px">
      <span><b>${fmtN(R.itens)}</b> itens</span><span>Almoxarife mudou a sugestão em <b>${fmtN(R.alm)}</b></span>
      <span>Gerente mudou <b>${fmtN(R.ger)}</b></span><span>Master mudou <b>${fmtN(R.mst)}</b></span><span>Recusados <b>${fmtN(R.rec)}</b></span></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:6px;font-size:12.5px">
      <span class="verde">✅ Coberto <b>${fmtN(cob.length)}</b></span>
      <span class="red">✂️ Cortado/recusado e vai faltar <b>${fmtN(cort.length)}</b> (${val(cort)})</span>
      <span class="amb">⚠ Pedido não cobre <b>${fmtN(nc.length)}</b> (${val(nc)})</span>
      <span class="red">❗ Ficou de fora e vai faltar <b>${fmtN(fora.length)}</b> (${val(fora)})</span>
      <span style="color:#64748b">➖ Fora do formulário, mas já coberto <b>${fmtN(foraok.length)}</b> (estoque ${fmtN(n('fora_est').length)} · pedido ${fmtN(n('fora_ped').length)} · SC ${fmtN(n('fora_sc').length)})</span>
      <span style="color:#1e40af">➕ Pediu a mais <b>${fmtN(am.length)}</b></span></div></div>`;
}

    const atr=B.flatMap(l=>l.atrasados);const nAtr=new Set(atr.map(p=>p.pc)).size;

      <div class="resumo-card alerta"><div class="val">${fmtN(pedir.length)}</div><div class="lab">Pedir agora</div><div class="sub">≈ ${fmtCurto(pedir.reduce((s,l)=>s+l.valor,0))} para cobrir até a próxima chegada</div></div>
      <div class="resumo-card azul"><div class="val">${fmtN(sol.length)}</div><div class="lab">Já solicitado</div><div class="sub">SC aberta ou formulário cobre — acompanhar</div></div>
      <div class="resumo-card bloq"><div class="val">${fmtN(dep.length)}</div><div class="lab">Depende da entrega</div><div class="sub">estoque não aguenta; o pedido cobre</div></div>
      <div class="resumo-card alerta"><div class="val">${fmtN(nAtr)}</div><div class="lab">Pedidos atrasados</div><div class="sub">${fmtCurto(atr.reduce((s,p)=>s+p.valor,0))} com entrega vencida</div></div>`;

      <div class="resumo-card bloq"><div class="val">${fmtN(p30.length)}</div><div class="lab">Trocas nos próximos 30 dias</div><div class="sub">${fmtN(p30.reduce((s,t)=>s+t.qtd,0))} unidades</div></div>
      <div class="resumo-card"><div class="val">${fmtN(p90.length)}</div><div class="lab">Trocas nos próximos 90 dias</div><div class="sub">${fmtN(p90.reduce((s,t)=>s+t.qtd,0))} unidades</div></div>

const VEREDITO={coberto:['✅ Coberto','badge-ok'],cortado:['✂️ Cortado e vai faltar','badge-alerta'],recusado:['🚫 Recusado e vai faltar','badge-alerta'],
  naocobre:['⚠ Pedido não cobre','badge-bloq'],amais:['➕ Pediu a mais','badge-azul'],fora:['❗ Ficou de fora e vai faltar','badge-alerta'],
  fora_est:['➖ Fora do formulário · estoque cobre','badge-zero'],fora_ped:['➖ Fora do formulário · pedido cobre','badge-zero'],fora_sc:['➖ Fora do formulário · SC cobre','badge-zero'],
  rec_ok:['🚫 Recusado · estoque cobre','badge-zero']};
// Colunas do último formulário: uma por etapa (roxo = mudou em relação à etapa anterior) + veredito
function colsForm(l){
  const v=l.ver?`<span class="${VEREDITO[l.ver][1]}">${VEREDITO[l.ver][0]}</span>`:'<span class="cinza">—</span>';
  if(!l.fm)return`<td class="num fcol cinza">—</td><td class="num fcol cinza">—</td><td class="num fcol cinza">—</td><td class="fcol">${v}</td>`;
  const f=l.fm,mud=(a,b)=>a!==b?' style="color:#7c3aed;font-weight:800"':'';
  const tip=[...new Set(f.forms.map(x=>`Formulário nº ${x.id} · CC ${x.cc} · ${fmtData(ymd8(String(x.criado_em).slice(0,10)))} · ${x.status.replace('_',' ')}${x.sc_numero?' · SC '+x.sc_numero:' · sem SC'}`))]
    .concat([`Faltava (sem o formulário): ${fmtN(l.precisa)} un`]).concat(f.just).join('\n');
  return`<td class="num fcol" title="Sugestão do formulário (consumo × período): ${fmtN(f.sug)}"${mud(f.alm,f.sug)}>${fmtN(f.alm)}</td>
    <td class="num fcol"${f.temGer?mud(f.ger,f.alm):''}>${f.temGer?fmtN(f.ger):'<span class="cinza">—</span>'}</td>
    <td class="num fcol"${mud(f.fin,f.ger)}>${f.rec?'<span class="red" title="Recusado">✕ recusado</span>':fmtN(f.fin)}</td>
    <td class="fcol" title="${esc(tip)}" style="cursor:help">${v}</td>`;
}
function badgeSit(l){
  const pico=l.abaixoPico?`<div style="margin-top:3px"><span class="badge-bloq" title="Maior saída num mês (sem mobilização): ${fmtN(l.pico)} em ${fmtMes(l.mp)}. Estoque + pedido + SC + formulário = ${fmtN(l.est+l.cam+l.scQtd+l.fq)}. Só aviso — não entra na compra.">⚠ abaixo do pico (${fmtN(l.pico)})</span></div>`:'';
  return badgeSit0(l)+pico;
}
function badgeSit0(l){
  if(l.status==='pedir')return`<span class="badge-alerta">🔴 Pedir ${fmtN(l.comprar)}</span>`;
  if(l.status==='solicitado')return`<span class="badge-azul">📝 ${l.fq>0&&l.est+l.cam+l.scQtd<l.alvo?'No formulário':'Já solicitado'}</span>`;
  if(l.status==='depende')return`<span class="badge-bloq">🟡 Depende da entrega</span>`;
  if(l.status==='ok')return`<span class="badge-ok">✓ Normal</span>`;
  return`<span class="badge-zero">Sem saída</span>`;
}
function estTip(l){
  const a=Object.entries(l.arm||{}).sort();
  return(a.length?a.map(([k,q])=>'Armazém '+k+': '+fmtN(q)).join('\n'):'Sem saldo em nenhum armazém')+
    '\nÚltima movimentação: '+fmtData(l.ult)+(l.estEm?'\nFoto do estoque (Protheus): '+new Date(l.estEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'');
}
function badgeEst(l){
  if(l.est<=0)return`<span class="${l.alvo>0?'badge-alerta':'badge-zero'}">0</span>`;
  return`<span class="${l.status==='ok'||l.status==='sem'?'badge-ok':l.status==='depende'?'badge-bloq':'badge-alerta'}">${fmtN(l.est)}</span>`;
}
function tipoTxt(l){
  if(l.tipo==='trocas')return'só trocas';
  if(l.tipo==='pontual')return'pontual · pico '+fmtN(l.pico)+(l.mp?' em '+fmtMes(l.mp):'')+' (sem mobilização)';
  return l.tipo==='sem'?'sem saída':l.tipo;
}
function celSC(l){
  if(!l.scs.length)return'<span class="cinza">—</span>';
  const tip=l.scs.map(s=>`SC ${s.sc} · ${fmtN(s.qtd)} un · ${fmtData(s.emissao)} · ${s.status}${s.solic?' · '+s.solic:''}`).join('\n');
  const velha=l.scs.reduce((m,s)=>Math.max(m,s.dias),0);
  const st=[...new Set(l.scs.map(s=>s.status))].join(' / ');
  return`<span title="${esc(tip)}" style="cursor:help"><b>${fmtN(l.scQtd)}</b> <span class="mini">${l.scs.length>1?l.scs.length+' SCs':'SC '+esc(l.scs[0].sc)}<br><span class="${/bloq/i.test(st)?'amb':''}">${esc(st)}</span> · <span class="${velha>30?'amb':''}">há ${fmtN(velha)} d</span></span></span>`;
}
function celPC(l){
  if(!l.pcs.length)return l.cam>0?`<b>${fmtN(l.cam)}</b>`:'<span class="cinza">—</span>';
  const tip=l.pcs.map(p=>`PC ${p.pc} · ${fmtN(p.qtd)} un · entrega ${fmtData(p.entrega)}${p.atraso>0?' (atrasado '+p.atraso+' d)':''} · ${p.status} · ${p.forn}${p.comp?' · comprador '+p.comp:''}`).join('\n');
  const det=l.atrasados.length?`<span class="red">atrasado ${fmtN(l.atrasoMax)} d</span>`:`entrega ${fmtData(l.proxEntrega)}`;
  const st=[...new Set(l.pcs.map(p=>p.status))].join(' / ');
  return`<span title="${esc(tip)}" style="cursor:help"><b>${fmtN(l.cam)}</b> <span class="mini">${l.pcs.length>1?l.pcs.length+' PCs':'PC '+esc(l.pcs[0].pc)}<br>${esc(st)} · ${det}</span></span>`;
}

// Popup do consumo: mês a mês dos 6 meses (total, mobilização, admissional, o que entrou na média)
function abrirConsumo(ev,fil,cod){
  ev.stopPropagation();
  const k=fil+'|'+cod,l=LINHAS.find(x=>x.fil===fil&&x.cod===cod);if(!POP||!l)return;
  const o=POP.ORIG[k]||{},mm=POP.MOTMES[k]||{},u=POP.CONS[k]||{};
  const tMob=$('x-mob').checked,tAdm=$('x-adm').checked;
  let tot=0,mob=0,usa=0;
  const lin=POP.W.map(m=>{const q=o[m]||0,qm=Math.min(q,mm[m]?.['MOBILIZAÇÃO']||0),qu=u[m]||0;tot+=q;mob+=qm;usa+=qu;
    return`<tr><td>${fmtMes(m)}</td><td class="num"><b>${q?fmtN(q):'<span class="cinza">0</span>'}</b></td><td class="num" style="color:#7c3aed">${qm?fmtN(qm):'<span class="cinza">—</span>'}</td><td class="num">${q-qm?fmtN(q-qm):'<span class="cinza">—</span>'}</td></tr>`}).join('');
  const p=$('popup-consumo');
  p.innerHTML=`<button class="fechar" onclick="fecharConsumo()">×</button><h4>${esc(l.desc)}</h4><div class="mini">${esc(cod)} · ${esc(l.filNome)} · ${esc(tipoTxt(l))}</div>
    <table><thead><tr><th>Mês</th><th class="num">Saiu (total)</th><th class="num">Mobilização</th><th class="num">Demais motivos</th></tr></thead><tbody>${lin}
    <tr style="border-top:2px solid #e2e8f0"><td><b>Total</b></td><td class="num"><b>${fmtN(tot)}</b></td><td class="num" style="color:#7c3aed">${fmtN(mob)}</td><td class="num">${fmtN(tot-mob)}</td></tr></tbody></table>
    <div class="mini" style="margin-top:8px;line-height:1.5">Média = ${fmtN(usa)} ÷ 6 = <b>${fmtN(usa/6,1)}/mês</b>${tMob||tAdm?' (sem '+[tMob&&'mobilização',tAdm&&'admissional'].filter(Boolean).join(' e ')+')':' (todas as saídas)'}.
    ${l.trocas?`<br>Trocas previstas no prazo: <b>${fmtN(l.trocas)}</b>${l.porTrocas?' — a meta veio das trocas':''}.`:''}
    <br>Meta para ${fmtN(l.prazo*30.44)} dias: <b>${fmtN(l.alvo)}</b> · estoque ${fmtN(l.est)} · cobre ≈ ${l.cob==null?'—':fmtN(Math.round(l.cob*30.44))+' dias'}.</div>`;
  p.style.display='block';
  const r=ev.target.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
  p.style.left=Math.max(8,Math.min(r.left-w/2,innerWidth-w-8))+'px';
  p.style.top=(r.bottom+h+8<innerHeight?r.bottom+6:Math.max(8,r.top-h-6))+'px';
}
function fecharConsumo(){$('popup-consumo').style.display='none'}
document.addEventListener('click',e=>{if(!e.target.closest('#popup-consumo'))fecharConsumo()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharConsumo()});
window.addEventListener('scroll',fecharConsumo,true);

      <td class="num"><span class="pop-cons" onclick="abrirConsumo(event,'${esc(l.fil)}','${esc(l.cod)}')" title="Clique para ver mês a mês">${l.media>0?fmtN(Math.max(1,Math.round(l.media))):'<span class="cinza">—</span>'}${l.tirado?'<span class="mini" style="color:#7c3aed"> *</span>':''}</span></td>
      <td class="num ${cobCor}" title="Estoque dura ≈ ${l.cob==null?'—':fmtN(l.cob,1)+' meses'} · prazo do grupo ${fmtN(l.prazo*30.44)} dias · meta ${fmtN(l.alvo)} un${l.porTrocas?' (pelas trocas)':''}">${l.cob==null?'—':fmtN(Math.round(l.cob*30.44))+' d'}</td>
      <td class="num">${l.trocas?`<span style="${l.porTrocas?'color:#1e40af':''}" title="${fmtN(l.pessoas)} pessoas · ${fmtN(l.venc)} já vencidas${l.porTrocas?' · meta pelas trocas (consumo pedia '+fmtN(l.alvoCons)+')':''}">${fmtN(l.trocas)}</span>`:'<span class="cinza">—</span>'}</td>

  }else if(SIT==='vida'){

      vis.map(v=>`<tr><td>${esc(v.fam)}</td><td>${v.gk==='FARD'?'Fardamento':'EPI'}</td><td class="num">${fmtN(v.vida)} dias</td><td class="num">${fmtN(v.p25)}–${fmtN(v.p75)} dias</td>
        <td class="num">${fmtN(v.n)}</td><td class="num">${fmtN(v.pessoas)}</td><td class="num" title="${esc(v.codigos.join(', '))}" style="cursor:help">${fmtN(v.codigos.length)}</td>
        <td class="num ${v.venc?'red':''}">${fmtN(v.venc)}</td><td class="num">${fmtN(v.p30)}</td></tr>`).join('')+'</tbody></table>';
  }else{
    h=`<table><thead><tr>${th('filNome','Filial')}${th('mat','Matrícula')}${th('cc','CC')}${th('cod','Código')}${th('desc','Descrição (último tamanho)')}${th('qtd','Qtd','num')}${th('ultima','Última entrega','num')}${th('vida','Vida útil','num')}${th('proxima','Próxima troca','num')}${th('dias','Situação')}</tr></thead><tbody>`+
      vis.map(t=>`<tr><td class="cod" title="${esc(t.fil)}">${esc(t.filNome)}</td><td class="cod">${esc(t.mat)}</td><td class="mini">${esc(t.cc)}</td><td class="cod">${esc(t.cod)}</td><td>${esc(t.desc)}</td>
        <td class="num">${fmtN(t.qtd)}</td><td class="num">${fmtData(t.ultima)}</td><td class="num">${fmtN(t.vida)} d</td><td class="num">${fmtData(t.proxima)}</td>
        <td>${t.dias<0?`<span class="badge-alerta">vencida há ${fmtN(-t.dias)} d</span>`:t.dias<=30?`<span class="badge-bloq">em ${fmtN(t.dias)} d</span>`:`<span class="badge-ok">em ${fmtN(t.dias)} d</span>`}</td></tr>`).join('')+'</tbody></table>';
  }
  $('tabela').innerHTML=h;
  renderPaginador();
}

// Tela inicial: um cartão por filial (SKUs, curva ABC da filial, itens a romper) — clique abre a lista da filial
function renderCards(){
  $('paginador').style.display='none';
  const fils=[...new Set(LINHAS.map(l=>l.fil))].filter(Boolean);
  const C=fils.map(f=>{
    const T=baseRisco(f,true);                 // todos os SKUs da filial (curva sem filtro)
    const L=baseRisco(f);                      // com o filtro de curva escolhido
    const n=s=>L.filter(l=>l.status===s).length;
    const abc={A:0,B:0,C:0};T.forEach(l=>{if(l.abc)abc[l.abc]++});
    const atr=new Set(L.flatMap(l=>l.atrasados.map(p=>p.pc))).size;
    return{f,skus:T.length,comSaida:abc.A+abc.B+abc.C,abc,pedir:n('pedir'),sol:n('solicitado'),dep:n('depende'),ok:n('ok'),atr,
      valor:L.filter(l=>l.status==='pedir').reduce((s,l)=>s+l.valor,0),aPedirA:L.filter(l=>l.status==='pedir'&&l.abc==='A').length};
  }).filter(c=>c.skus>0).sort((a,b)=>b.pedir-a.pedir||b.valor-a.valor||a.f.localeCompare(b.f));
  if(!C.length){$('tabela').innerHTML='<div class="vazio">Nenhuma filial com esses filtros.</div>';return}
  const pct=(v,t)=>(100*v/t).toFixed(1)+'%';
  $('tabela').innerHTML=`<div class="cards-topo"><span>Clique na filial para ver os itens, SCs e pedidos. Ordenado por itens a romper.</span>
    <button class="pill-btn" onclick="abrirFilial('')">Ver lista de todas as filiais</button></div><div class="cards-fil">`+
    C.map(c=>{const ativos=c.pedir+c.sol+c.dep+c.ok||1;return`<button class="card-fil" onclick="abrirFilial('${esc(c.f)}')">
      <div class="cf-top"><span class="cf-nome">${esc(nomeFil(c.f))}</span><span class="cf-cod">${esc(c.f)}</span></div>
      <div class="cf-risco"><b class="${c.pedir?'red':'verde'}">${fmtN(c.pedir)}</b><span class="cf-lab">itens a romper${c.pedir?' · ≈ '+fmtCurto(c.valor):''}${c.aPedirA?` · <span class="red" style="font-weight:700">${fmtN(c.aPedirA)} curva A</span>`:''}</span></div>
      <div class="cf-barra" title="Pedir agora / Já solicitado / Depende da entrega / Normal">
        <span style="width:${pct(c.pedir,ativos)};background:#ef4444"></span><span style="width:${pct(c.sol,ativos)};background:#3b82f6"></span>
        <span style="width:${pct(c.dep,ativos)};background:#f59e0b"></span><span style="width:${pct(c.ok,ativos)};background:#22c55e"></span></div>
      <div class="cf-abc"><span class="q"><b>${fmtN(c.skus)}</b> SKUs</span>
        ${['A','B','C'].map(k=>`<span class="q"><span class="abc abc-${k}">${k}</span>${fmtN(c.abc[k])}</span>`).join('')}
        <span class="q cinza">${fmtN(c.skus-c.comSaida)} sem saída</span></div>
      <div class="cf-rod">${FORMFIL[c.f]?`<span style="flex-basis:100%;color:#7c3aed">📋 Formulário ${fmtData(ymd8(String(FORMFIL[c.f].ultimo).slice(0,10)))} · ${esc(FORMFIL[c.f].forms[0].status.replace('_',' '))}${FORMFIL[c.f].forms.some(x=>!x.sc_numero)?' · sem SC':''}</span>`:'<span style="flex-basis:100%" class="cinza">📋 Sem formulário</span>'}<span>📝 Já solicitado <b>${fmtN(c.sol)}</b></span><span>🟡 Depende <b>${fmtN(c.dep)}</b></span><span>⏰ PCs atrasados <b class="${c.atr?'red':''}">${fmtN(c.atr)}</b></span></div>
    </button>`}).join('')+'</div>';
}

// Top itens: um cartão por código somando as filiais (curva ABC da empresa) — clique abre o item filial por filial
function renderItemCards(){
  $('paginador').style.display='none';
  const sel=$('f-abc').value,porQtd=$('f-abc-por').value==='qtd';
  const G={};
  baseRisco('',true).forEach(l=>{
    const o=G[l.cod]||(G[l.cod]={cod:l.cod,desc:l.desc,mob:0,tot6:0,peso:0,media:0,trocas:0,est:0,cam:0,scQtd:0,nSc:0,nPc:0,atr:0,valor:0,fils:0,pedir:0,sol:0,dep:0,ok:0,romper:[]});
    o.mob+=l.mob;o.tot6+=l.tot6;o.peso+=l.peso;o.media+=Math.max(l.media,l.trocas/l.prazo);o.trocas+=l.trocas;o.est+=l.est;o.cam+=l.cam;o.scQtd+=l.scQtd;o.nSc+=l.scs.length;o.nPc+=l.pcs.length;o.atr+=l.atrasados.length;
    o.valor+=l.valor;o.fils++;if(l.status in o)o[l.status]++;if(l.status==='pedir')o.romper.push(l.fil);
  });
  const todos=Object.values(G);
  const com=todos.filter(o=>o.peso>0).sort((a,b)=>b.peso-a.peso),tot=com.reduce((s,o)=>s+o.peso,0);let acum=0;
  com.forEach(o=>{const antes=acum/tot;acum+=o.peso;o.abc=antes<.8?'A':antes<.95?'B':'C'});
  const ord={saida:(a,b)=>b.peso-a.peso,romper:(a,b)=>b.pedir-a.pedir||b.peso-a.peso,valor:(a,b)=>b.valor-a.valor||b.peso-a.peso}[ORD_ITEM];
  const L=todos.filter(o=>o.peso>0&&(!sel||sel.includes(o.abc))).sort(ord);
  if(!L.length){$('tabela').innerHTML='<div class="vazio">Nenhum item com esses filtros.</div>';return}
  const pct=(v,t)=>(100*v/t).toFixed(1)+'%';
  const opc=[['saida','Mais saem'],['romper','Mais filiais a romper'],['valor','Maior valor a comprar']];
  $('tabela').innerHTML=`<div class="cards-topo"><span>Top ${fmtN(Math.min(TOP,L.length))} de ${fmtN(L.length)} itens com saída (todas as filiais somadas). Clique no item para ver filial por filial.</span>
    <div class="seg-ord">${opc.map(([k,t])=>`<button class="pill-btn ${ORD_ITEM===k?'ativo':''}" onclick="setOrdItem('${k}')">${t}</button>`).join(' ')}</div></div><div class="cards-fil">`+
    L.slice(0,TOP).map((o,i)=>{const ativos=o.pedir+o.sol+o.dep+o.ok||1;const cob=o.media>0?o.est/o.media:null;
      const nomes=o.romper.map(nomeFil);
      return`<button class="card-fil" onclick="abrirItem('${esc(o.cod)}')">
      <div class="cf-top"><span class="cf-cod">#${i+1} · ${esc(o.cod)}</span><span class="abc abc-${o.abc}" title="Curva ${o.abc} na empresa">${o.abc}</span></div>
      <div class="cf-nome" style="margin-top:4px;line-height:1.3">${esc(o.desc)}</div>
      <div class="cf-risco"><b class="${o.pedir?'red':'verde'}">${fmtN(o.pedir)}</b><span class="cf-lab">de ${fmtN(o.fils)} filiais a romper${o.valor?' · ≈ '+fmtCurto(o.valor):''}</span></div>
      <div class="cf-barra" title="Filiais: Pedir agora / Já solicitado / Depende da entrega / Normal">
        <span style="width:${pct(o.pedir,ativos)};background:#ef4444"></span><span style="width:${pct(o.sol,ativos)};background:#3b82f6"></span>
        <span style="width:${pct(o.dep,ativos)};background:#f59e0b"></span><span style="width:${pct(o.ok,ativos)};background:#22c55e"></span></div>
      <div class="cf-abc"><span class="q">Saída/mês <b>${fmtN(o.media)}</b></span><span class="q">Estoque <b>${fmtN(o.est)}</b></span>
        <span class="q ${cob!=null&&cob<2?'red':''}">Cobertura <b>${cob!=null?fmtN(Math.round(cob*30.44))+' d':'—'}</b></span></div>
      <div class="cf-rod"><span>📝 SC aberta <b>${o.scQtd?fmtN(o.scQtd)+' ('+o.nSc+')':'—'}</b></span><span>🚚 A caminho <b>${o.cam?fmtN(o.cam):'—'}</b></span>
        <span>⏰ PCs atrasados <b class="${o.atr?'red':''}">${fmtN(o.atr)}</b></span></div>
      ${o.tot6>0&&o.mob/o.tot6>=PESO_MOB?`<div class="mini" style="margin-top:6px;color:#7c3aed;font-weight:700">🟣 ${fmtN(100*o.mob/o.tot6)}% da saída foi mobilização (${fmtN(o.mob)} un em 6 meses)</div>`:''}
      ${nomes.length?`<div class="mini" style="margin-top:6px">Romper em: <span class="red">${esc(nomes.slice(0,3).join(', '))}${nomes.length>3?' +'+(nomes.length-3):''}</span></div>`:''}
    </button>`}).join('')+'</div>'+
    (L.length>TOP?`<div style="text-align:center;margin-top:12px"><button class="pill-btn" onclick="TOP+=30;render()">Ver mais 30 (${fmtN(L.length-TOP)} restantes)</button></div>`:'');
}

function renderPaginador(){
  const tot=Math.ceil(FILTRADOS.length/POR_PAGINA);
  if(tot<=1){$('paginador').style.display='none';return}
  $('paginador').style.display='flex';
  $('pag-info').textContent=`Mostrando ${fmtN((PAG-1)*POR_PAGINA+1)}–${fmtN(Math.min(PAG*POR_PAGINA,FILTRADOS.length))} de ${fmtN(FILTRADOS.length)}`;
  const ps=[...new Set([1,PAG-2,PAG-1,PAG,PAG+1,PAG+2,tot])].filter(p=>p>=1&&p<=tot).sort((a,b)=>a-b);
  $('pag-btns').innerHTML=`<button class="pag-btn" ${PAG===1?'disabled':''} onclick="irPag(${PAG-1})">‹</button>`+
    ps.map(p=>`<button class="pag-btn ${p===PAG?'ativo':''}" onclick="irPag(${p})">${p}</button>`).join('')+
    `<button class="pag-btn" ${PAG===tot?'disabled':''} onclick="irPag(${PAG+1})">›</button>`;
}
function irPag(p){PAG=p;render();window.scrollTo({top:$('resumo').offsetTop,behavior:'smooth'})}

function renderNota(){
  $('nota').innerHTML=ABA==='risco'?
    `<b>Como funciona:</b> consumo = média dos últimos 6 meses (meses sem saída contam zero); itens <b>pontuais</b> (saída em 1–2 dos 6 meses) também usam a média; o maior pico do mês (sem mobilização) vira só o aviso <b>⚠ abaixo do pico</b>, sem entrar na compra.
    <b>Prazo do grupo</b> = tempo da SC até a chegada em 8 de cada 10 compras de 2026 (EPI ≈ 2,3 meses; fardamento ≈ 3,3 meses); a <b>meta</b> é o consumo desse prazo.
    <b>Trocas prev.</b> = trocas de itens pessoais que vencem dentro do prazo, pela vida útil de cada item e pelo tamanho que cada pessoa recebeu por último; em azul quando a meta veio das trocas.
    <b>Pedido (a caminho)</b> = saldo em pedido de compra do Protheus (SB2) e os pedidos em aberto (passe o mouse para ver todos).
    <b>SC aberta</b> = solicitação ainda sem pedido (pendente, bloqueada ou em cotação, último ano).
    Situação: <b>Pedir agora</b> = estoque + pedido + SC aberta não chegam à meta; <b>Já solicitado</b> = só chega contando a SC aberta;
    <b>Depende da entrega</b> = o estoque não chega, o pedido cobre.
    <b>Último formulário</b>: rodada mais recente de cada filial (formulários até ${DIAS_RODADA} dias antes do último, todos os CCs; recusados inteiros não contam). Mostra almoxarife → gerente → final do master (roxo = mudou);
    a final de formulário que ainda não virou SC conta como <b>já pedida</b>. Veredito: ✂️ cortado e ainda vai faltar; ⚠ o pedido (mesmo sem corte) não cobre; ❗ o item não estava no formulário e vai faltar; ➖ não estava no formulário, mas o estoque, um pedido ou uma SC já cobre; ➕ final mais que o dobro do que faltava.
    <b>Tirar do consumo</b>: por padrão o consumo conta <b>todas</b> as saídas. Marque <b>Mobilização</b> (motivo A — kits de equipe nova, compra direcionada) e/ou Admissional (motivo 5) para tirá-las da média; o <span style="color:#7c3aed">*</span> mostra quanto foi tirado.
    <span style="color:#7c3aed;font-weight:700">% mobilização</span> aparece no item quando 30% ou mais da saída de 6 meses foi mobilização (pílula "Mobilização pesa").
    <b>Curva ABC</b> (na filial e no grupo escolhidos): A = itens que somam 80% do que sai (em valor = consumo/mês × custo, ou em quantidade), B = próximos 15%, C = últimos 5%; conta também as trocas previstas.`
    :`<b>Como funciona:</b> vida útil = mediana do tempo entre duas entregas do mesmo item (tamanhos juntos) para a mesma pessoa, nas trocas (motivos 3, 4 e 9) desde jan/2025.
    Itens pessoais = todo o fardamento e EPI de uso individual (luva, bota, óculos, balaclava, perneira, capacete, carneira, capuz, protetores, máscara, manga de borracha, cinto/talabarte/trava-quedas).
    Pessoa ativa = recebeu algum item nos últimos 60 dias; troca atrasada mais que uma vida útil sai da lista (provavelmente não usa mais o item).
    As entregas não trazem o nome do funcionário — só matrícula e CC.`;
}

// ── EXCEL ────────────────────────────────────────────────
function exportarExcel(){
  if(!FILTRADOS.length){alert('Nada para exportar.');return}
  let rows,nome;
  if(ABA==='risco'){
    nome='risco_'+PILL;
    rows=FILTRADOS.map(l=>({Filial:l.fil+' '+l.filNome,'Código':l.cod,'Descrição':l.desc,Grupo:nomeGrupo(l.gk,l.desc),
      'Situação':{pedir:'Pedir agora',solicitado:'Já solicitado',depende:'Depende da entrega',ok:'Normal',sem:'Sem saída'}[l.status],'Tipo de saída':tipoTxt(l),'Abaixo do pico (sem mobilização)':l.abaixoPico?'sim (pico '+l.pico+')':'','Curva ABC':l.abc,
      Estoque:l.est,'Estoque por armazém':Object.entries(l.arm||{}).sort().map(([k,q])=>k+': '+q).join(' · '),'Consumo médio/mês':Math.round(l.media),'% da saída por mobilização':Math.round(l.pctMob*100),'Tirado do consumo (6 meses)':l.tirado?Object.entries(l.tirado).map(([m,q])=>m+' '+q).join(' · '):'','Cobertura (dias)':l.cob==null?'':Math.round(l.cob*30.44),'Prazo do grupo (meses)':Math.round(l.prazo*10)/10,
      'Trocas previstas no prazo':l.trocas,'Trocas vencidas':l.venc,Meta:l.alvo,'Meta por':l.porTrocas?'Trocas':'Consumo',
      'Form. almoxarife':l.fm?l.fm.alm:'','Form. gerente':l.fm&&l.fm.temGer?l.fm.ger:'','Form. final (master)':l.fm?(l.fm.rec?'recusado':l.fm.fin):'',
      'Form. conta como pedido':l.fq||'','Veredito do formulário':l.ver?VEREDITO[l.ver][0].replace(/^\S+\s/,''):'','Faltava sem o formulário':l.precisa,
      'SC aberta (qtd)':l.scQtd,'SCs':l.scs.map(s=>s.sc).join(', '),'A caminho':l.cam,'Pedidos':l.pcs.map(p=>p.pc+' ('+fmtData(p.entrega)+')').join(', '),
      'Maior atraso (dias)':l.atrasoMax||'',Comprar:l.comprar,'Custo unit.':l.custo,'Valor a comprar':Math.round(l.valor)}));
  }else if(SIT==='vida'){
    nome='vida_util';
    rows=FILTRADOS.map(v=>({Item:v.fam,Grupo:v.gk==='FARD'?'Fardamento':'EPI','Vida útil (dias)':v.vida,'25% das trocas até (dias)':v.p25,'75% das trocas até (dias)':v.p75,
      'Trocas observadas':v.n,Pessoas:v.pessoas,'Códigos':v.codigos.join(', '),'Trocas vencidas':v.venc,'Trocas próx. 30 dias':v.p30}));
  }else{
    nome='trocas_'+SIT;
    rows=FILTRADOS.map(t=>({Filial:t.fil+' '+t.filNome,'Matrícula':t.mat,CC:t.cc,'Código':t.cod,'Descrição':t.desc,Item:t.fam,Qtd:t.qtd,'Última entrega':fmtData(t.ultima),
      'Vida útil (dias)':t.vida,'Próxima troca':fmtData(t.proxima),'Dias até a troca':t.dias,'Situação':t.dias<0?'Vencida':'Prevista'}));
  }
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Ruptura');
  XLSX.writeFile(wb,'ruptura_'+nome+'_'+new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')+'.xlsx');
}
