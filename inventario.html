<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventário Rotativo — B&amp;Q</title>
<script src="vendor/supabase-2.118.0.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="/padrao.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.pag{padding:16px 20px 40px;max-width:1400px;margin:0 auto}
.abas{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.abas button{background:#fff;border:1px solid #cbd5e1;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;color:#334155;font-family:inherit}
.abas button.on{background:#1e40af;color:#fff;border-color:#1e40af}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.barra label{display:flex;flex-direction:column;font-size:11.5px;font-weight:600;color:#64748b;gap:4px}
input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;background:#fff}
.btn{background:#1e40af;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn.sec{background:#fff;color:#334155;border:1px solid #cbd5e1}
.btn.ok{background:#15803d}.btn.no{background:#b91c1c}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:middle}
th{background:#f8fafc;color:#475569;font-size:11.5px;font-weight:700;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right}
.tab-wrap{overflow:auto;max-height:calc(100vh - 290px);border:1px solid #e2e8f0;border-radius:10px;background:#fff}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st.pendente{background:#f1f5f9;color:#475569}.st.recontar{background:#fef3c7;color:#92400e}.st.ok{background:#dcfce7;color:#166534}
.st.divergente{background:#fee2e2;color:#991b1b}.st.justificado{background:#e0e7ff;color:#3730a3}.st.aprovado{background:#ccfbf1;color:#115e59}
.st.aberta{background:#dbeafe;color:#1e40af}.st.fechada{background:#dcfce7;color:#166534}.st.cancelada{background:#f1f5f9;color:#64748b}
.qtd{width:90px;text-align:right;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:#64748b}
.muted{color:#64748b;font-size:12.5px}
.aviso{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
.link{color:#1e40af;cursor:pointer;font-weight:600;background:none;border:none;padding:0;font-family:inherit;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;display:none;z-index:50}
@media print{.bq-topo,.abas,.nao-imprime,#toast{display:none!important}body{background:#fff}.pag{padding:0}.card{border:none;padding:0}
  .tab-wrap{max-height:none;overflow:visible;border:none}th{position:static}}
#folha{display:none}
@media print{body.imprimindo .pag>*:not(#folha){display:none!important}body.imprimindo #folha{display:block}}
#folha table td,#folha table th{border:1px solid #94a3b8;padding:7px 6px;font-size:12px}
</style>
</head>
<body>
<div class="bq-topo"><a class="bq-marca" href="/los.html" title="Voltar ao menu">B<b>&amp;</b>Q</a><div><h1>Inventário Rotativo</h1><div class="bq-sub">Contagem cega • recontagem • justificativa • aprovação do coordenador</div></div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center"><span id="quem" style="color:#cbd5e1;font-size:12.5px"></span><button class="btn sec" onclick="sair()">Sair</button></div></div>
<div class="pag">
  <div class="abas nao-imprime">
    <button id="ab-coletor" onclick="aba('coletor')" style="display:none">📟 Coletor</button>
    <button id="ab-listas" class="on" onclick="aba('listas')">📋 Listas de contagem</button>
    <button id="ab-acur" onclick="aba('acur')">🎯 Acuracidade</button>
  </div>
  <div id="vis-coletor" style="display:none"></div>
  <div id="vis-listas"></div>
  <div id="vis-lista" style="display:none"></div>
  <div id="vis-acur" style="display:none"></div>
  <div id="folha"></div>
</div>
<div id="toast"></div>
<script>
const db=window.supabase.createClient('https://eugefrjckrxisfpizkjb.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Z2Vmcmpja3J4aXNmcGl6a2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzEzNjksImV4cCI6MjEwNDAwNzM2OX0.sNQjKjlUm1TWeiDGG2SDeER7GGaf4PucofJWNKxqygI');
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=v=>v==null||v===''?'–':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:3});
const rs=v=>v==null?'–':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dBR=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'–';
const hBR=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const quem=e=>e?String(e).split('@')[0]:'';
const ROT={pendente:'A contar',recontar:'Recontar',ok:'OK',divergente:'Divergente — justificar',justificado:'Aguardando coordenador',aprovado:'Aprovado (com diferença)'};
let PAPEL='nenhum',EU='',FIL={},LISTAS=[],LISTA=null,ITENS=[];
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2800)}
async function sair(){await db.auth.signOut({scope:'local'});location.reload()}
async function rpc(fn,args){const{data,error}=await db.rpc(fn,args||{});if(error)throw new Error(error.message);return data}
function aba(a){['coletor','listas','acur'].forEach(x=>$('ab-'+x).classList.toggle('on',x===a));$('vis-listas').style.display=a==='listas'&&!LISTA?'':'none';$('vis-lista').style.display=a==='listas'&&LISTA?'':'none';$('vis-acur').style.display=a==='acur'?'':'none';$('vis-coletor').style.display=a==='coletor'?'':'none';
  if(a==='acur')desenharAcur();if(a==='listas'&&!LISTA)carregarListas();if(a==='coletor')desenharColetor()}
const coord=()=>PAPEL==='coord';
const podeContar=()=>PAPEL==='coord'||PAPEL==='contar';

// ── Listas ──
async function carregarListas(){
  $('vis-listas').innerHTML='<div class="card muted">Carregando…</div>';
  try{LISTAS=await rpc('inv_listas',{p_filial:null})}catch(e){$('vis-listas').innerHTML='<div class="card">Erro: '+esc(e.message)+'</div>';return}
  const hoje=new Date().toISOString().slice(0,10);
  const nova=coord()?`<div class="card nao-imprime"><b style="font-size:14px">Nova lista de contagem</b>
    <div class="muted" style="margin:4px 0 10px">O <b>saldo fica congelado</b> no momento em que a contagem é liberada. Só entram itens com saldo.</div>
    <div class="barra">
      <label>Filial<select id="n-fil" onchange="carregarArms()">${Object.keys(FIL).sort().map(f=>`<option value="${f}"${f==='04'?' selected':''}>${f} — ${esc(FIL[f])}</option>`).join('')}</select></label>
      <label>O que contar<select id="n-esc" onchange="escopo()">
        <option value="tudo">Tudo — todos os armazéns da filial</option>
        <option value="arm">Só alguns armazéns (todos os itens)</option>
        <option value="qtd">Só uma quantidade de itens (os de maior valor)</option></select></label>
      <label id="l-qtd" style="display:none">Quantos itens<input id="n-qtd" type="number" min="1" value="20" style="width:90px"></label>
      <label id="l-rot" style="display:none">Não repetir item contado nos últimos (dias)<input id="n-rot" type="number" min="0" value="90" style="width:110px"></label>
      <label>Data da contagem<input id="n-data" type="date" value="${hoje}"></label>
      <button class="btn" onclick="gerar(this)">✅ Liberar contagem</button>
    </div>
    <div id="n-arms" style="display:none;margin-top:10px;font-size:13px"></div>
    <div id="n-resumo" class="muted" style="margin-top:8px"></div></div>`:'';
  const linhas=LISTAS.map(l=>{const pct=l.itens?Math.round(l.contados/l.itens*100):0;
    return `<tr><td><b>#${l.id}</b>${l.tipo==='coletor'?' <span class="st pendente">coletor</span>':''}</td><td>${esc(l.filial)} — ${esc(FIL[l.filial]||'')}</td><td>${(l.armazens||[]).map(a=>a.padStart(2,'0')).join(', ')}</td><td>${dBR(l.data_contagem)}</td>
      <td><span class="st ${l.status}">${l.status}</span></td><td class="n">${l.contados}/${l.itens} <span class="muted">(${pct}%)</span></td>
      <td class="n">${l.recontar?'<span class="st recontar">'+l.recontar+' recontar</span> ':''}${l.divergentes?'<span class="st divergente">'+l.divergentes+' justificar</span> ':''}${l.aguardando?'<span class="st justificado">'+l.aguardando+' p/ aprovar</span>':''}</td>
      ${coord()?`<td class="n">${l.valor_div!=null?rs(l.valor_div):'–'}</td>`:''}
      <td class="muted">${quem(l.criado_por)}</td><td><button class="btn sec" onclick="abrir(${l.id})">Abrir</button></td></tr>`}).join('');
  setTimeout(()=>{if($('n-fil'))carregarArms()},0);
  $('vis-listas').innerHTML=nova+`<div class="card"><div class="tab-wrap" style="max-height:none"><table><thead><tr><th>Lista</th><th>Filial</th><th>Armazéns</th><th>Contagem</th><th>Situação</th><th class="n">Contados</th><th class="n">Pendências</th>${coord()?'<th class="n">Valor das diferenças</th>':''}<th>Criada por</th><th></th></tr></thead>
    <tbody>${linhas||`<tr><td colspan="10" class="muted" style="padding:16px">Nenhuma lista ainda.${coord()?' Gere a primeira acima.':''}</td></tr>`}</tbody></table></div></div>`;
}
let ARMS=[];
async function carregarArms(){
  try{ARMS=(await rpc('inv_armazens',{p_filial:$('n-fil').value})).filter(a=>a.itens_com_saldo>0)}catch(e){ARMS=[]}
  $('n-arms').innerHTML='<b>Armazéns:</b> '+(ARMS.map(a=>`<label style="display:inline-flex;gap:4px;align-items:center;margin-right:14px;font-weight:400;flex-direction:row;color:#0f172a"><input type="checkbox" class="n-arm" value="${a.armazem}" checked onchange="resumoEsc()"> ${a.armazem} <span class="muted">(${a.itens_com_saldo} itens${a.valor!=null?' • '+rs(a.valor):''})</span></label>`).join('')||'<span class="muted">nenhum armazém com saldo</span>');
  escopo();
}
function escopo(){const e=$('n-esc').value;$('n-arms').style.display=e==='tudo'?'none':'';$('l-qtd').style.display=$('l-rot').style.display=e==='qtd'?'':'none';resumoEsc()}
function armsSel(){return [...document.querySelectorAll('.n-arm:checked')].map(x=>x.value)}
function resumoEsc(){const e=$('n-esc').value,sel=e==='tudo'?ARMS.map(a=>a.armazem):armsSel(),n=ARMS.filter(a=>sel.includes(a.armazem)).reduce((s,a)=>s+a.itens_com_saldo,0);
  $('n-resumo').textContent=e==='qtd'?`Vai contar os ${$('n-qtd').value||0} itens de maior valor dos armazéns ${sel.join(', ')||'—'}.`:`Vai contar ${n} itens (todos com saldo) dos armazéns ${sel.join(', ')||'—'}.`}
async function gerar(b){
  const e=$('n-esc').value,arms=e==='tudo'?null:armsSel();
  if(e!=='tudo'&&!arms.length)return alert('Marque pelo menos um armazém.');
  const qtd=e==='qtd'?(+$('n-qtd').value||0):null;if(e==='qtd'&&qtd<1)return alert('Informe quantos itens.');
  if(!confirm('Liberar a contagem? '+$('n-resumo').textContent+' O saldo será congelado agora.'))return;
  b.disabled=true;b.textContent='Liberando…';
  try{const id=await rpc('inv_gerar',{p_filial:$('n-fil').value,p_armazens:arms,p_qtd:qtd,p_data:$('n-data').value||null,p_dias_rotacao:+$('n-rot').value||0});toast('Contagem liberada: lista #'+id+'.');abrir(id)}
  catch(err){alert(err.message);b.disabled=false;b.textContent='✅ Liberar contagem'}
}

// ── Lista aberta ──
async function abrir(id){
  LISTA=(LISTAS.find(l=>l.id===id))||{id};$('vis-listas').style.display='none';$('vis-lista').style.display='';
  $('vis-lista').innerHTML='<div class="card muted">Carregando…</div>';
  try{LISTAS=await rpc('inv_listas',{p_filial:null});LISTA=LISTAS.find(l=>l.id===id)||LISTA;ITENS=await rpc('inv_itens',{p_lista:id})}catch(e){$('vis-lista').innerHTML='<div class="card">Erro: '+esc(e.message)+'</div>';return}
  desenharLista();
}
function voltar(){LISTA=null;ARM_LISTA='';$('vis-lista').style.display='none';$('vis-listas').style.display='';carregarListas()}
const final=i=>i.cont2!=null?i.cont2:i.cont1;
let ARM_LISTA='';
function desenharLista(){
  const l=LISTA,aberta=l.status==='aberta',c=coord();
  const armsL=[...new Set(ITENS.map(i=>String(i.armazem).padStart(2,'0')))].sort();
  if(armsL.length===1)ARM_LISTA=armsL[0];
  if(!c&&!armsL.includes(ARM_LISTA)){
    $('vis-lista').innerHTML=`<div class="card" style="max-width:720px"><button class="btn sec" onclick="voltar()">← Listas</button>
      <div style="font-size:17px;font-weight:800;margin:14px 0 4px">Lista #${l.id} — qual armazém você vai contar agora?</div>
      <div class="muted" style="margin-bottom:12px">Conte um armazém por vez.</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">${armsL.map(a=>`<button class="btn" style="font-size:22px;padding:18px 28px;min-width:120px" onclick="ARM_LISTA='${a}';desenharLista()">Armazém ${a}<div style="font-size:12px;font-weight:600">${ITENS.filter(i=>String(i.armazem).padStart(2,'0')===a&&i.status==='pendente').length} a contar</div></button>`).join('')}</div></div>`;
    return;
  }
  const TODOS=ITENS;if(ARM_LISTA&&armsL.includes(ARM_LISTA))ITENS=TODOS.filter(i=>String(i.armazem).padStart(2,'0')===ARM_LISTA);
  try{
  const n=s=>ITENS.filter(i=>i.status===s).length,cont=ITENS.filter(i=>i.status!=='pendente').length;
  const ok1=ITENS.filter(i=>i.status==='ok'&&i.cont2==null).length,okF=ITENS.filter(i=>i.status==='ok').length;
  const fin=ITENS.filter(i=>['ok','aprovado','divergente','justificado'].includes(i.status)).length;
  const k=`<div class="kpis">
    <div class="kpi"><b>${cont}/${ITENS.length}</b><span>itens contados</span></div>
    <div class="kpi"><b>${fin?Math.round(okF/fin*100):0}%</b><span>acuracidade (${okF} de ${fin} sem diferença)</span></div>
    <div class="kpi"><b>${ok1}</b><span>certos já na 1ª contagem</span></div>
    <div class="kpi"><b>${n('recontar')}</b><span>para recontar</span></div>
    <div class="kpi"><b>${n('divergente')+n('justificado')}</b><span>com diferença (justificar / aprovar)</span></div>
    ${c?`<div class="kpi"><b>${rs(ITENS.filter(i=>['divergente','justificado','aprovado'].includes(i.status)).reduce((s,i)=>s+Math.abs((final(i)??i.saldo)-i.saldo)*(i.custo||0),0))}</b><span>valor das diferenças</span></div>`:''}</div>`;
  const rows=ITENS.map(i=>{
    const dif=c&&final(i)!=null?final(i)-i.saldo:null;
    let acao='';
    if(aberta&&podeContar()&&(i.status==='pendente'||i.status==='recontar'))
      acao=`<input class="qtd" type="number" min="0" step="any" id="q${i.id}" placeholder="${i.status==='recontar'?'recontagem':'contado'}" onkeydown="if(event.key==='Enter')contar(${i.id})"> <button class="btn" onclick="contar(${i.id})">Salvar</button>`;
    else if(aberta&&podeContar()&&i.status==='divergente')
      acao=`<input id="j${i.id}" placeholder="Justificativa da diferença" style="width:230px"> <button class="btn sec" onclick="justificar(${i.id})">Enviar</button>`;
    if(aberta&&c&&i.status!=='pendente')
      acao+=`<div style="margin-top:4px"><button class="link" onclick="desfazer(${i.id})">↺ desfazer contagem</button></div>`;
    if(aberta&&c&&(i.status==='justificado'||i.status==='divergente'))
      acao+=`<div style="margin-top:4px"><button class="btn ok" onclick="decidir(${i.id},true)">Aprovar</button> <button class="btn no" onclick="decidir(${i.id},false)">Reprovar (recontar)</button></div>`;
    return `<tr><td><b>${esc(i.codigo)}</b></td><td>${esc(i.descricao)}</td><td>${esc(i.unidade||'')}</td><td>${esc(String(i.armazem).padStart(2,'0'))}</td><td>${esc(i.localizacao||'')}</td>
      ${c?`<td class="n">${nf(i.saldo)}</td>`:''}
      <td class="n">${nf(i.cont1)}<div class="muted" style="font-size:11px">${quem(i.cont1_por)} ${hBR(i.cont1_em)}</div></td>
      <td class="n">${nf(i.cont2)}<div class="muted" style="font-size:11px">${quem(i.cont2_por)} ${hBR(i.cont2_em)}</div></td>
      ${c?`<td class="n" style="color:${dif?'#b91c1c':'inherit'};font-weight:700">${dif==null?'–':(dif>0?'+':'')+nf(dif)}</td>`:''}
      <td><span class="st ${i.status}">${ROT[i.status]||i.status}</span>${i.justificativa?`<div class="muted" style="font-size:11.5px;margin-top:3px">“${esc(i.justificativa)}” — ${quem(i.just_por)}</div>`:''}${i.decisao_obs?`<div class="muted" style="font-size:11.5px">Coord.: ${esc(i.decisao_obs)} — ${quem(i.decisao_por)}</div>`:''}</td>
      <td class="nao-imprime" style="white-space:nowrap">${acao}</td></tr>`}).join('');
  $('vis-lista').innerHTML=`<div class="card nao-imprime" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <button class="btn sec" onclick="voltar()">← Listas</button>
      <b style="font-size:15px">Lista #${l.id}</b><span class="st ${l.status}">${l.status}</span>
      ${armsL.length>1?(c?`<select onchange="ARM_LISTA=this.value;desenharLista()"><option value="">todos os armazéns</option>${armsL.map(a=>`<option${a===ARM_LISTA?' selected':''}>${a}</option>`).join('')}</select>`
        :`<span style="background:#1e40af;color:#fff;border-radius:8px;padding:4px 10px;font-weight:800">📦 Armazém ${ARM_LISTA}</span><button class="btn sec" onclick="if(confirm('Encerrar o armazém '+ARM_LISTA+' e escolher outro?')){ARM_LISTA='';desenharLista()}">Encerrar este armazém</button>`):''}
      <span class="muted">Filial ${esc(l.filial)} — ${esc(FIL[l.filial]||'')} • armazéns ${(l.armazens||[]).map(a=>a.padStart(2,'0')).join(', ')} • contagem ${dBR(l.data_contagem)} • saldo congelado em ${hBR(l.criado_em)}</span>
      <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sec" onclick="imprimir()">🖨 Folha de contagem</button>
        ${c?`<button class="btn sec" onclick="exportar()">⬇ Exportar para o Protheus</button>`:''}
        ${c&&aberta?`<button class="btn ok" onclick="statusLista('fechada')">✔ Fechar lista</button><button class="btn sec" onclick="statusLista('cancelada')">Cancelar</button>`:''}
        ${c&&l.status!=='aberta'?`<button class="btn sec" onclick="statusLista('aberta')">Reabrir</button>`:''}
      </span></div>
    ${podeContar()&&!c?`<div class="aviso">Contagem <b>cega</b>: digite a quantidade que você contou. Se não bater, o sistema pede a <b>recontagem</b>; se continuar diferente, escreva a justificativa — o coordenador aprova.</div>`:''}
    ${k}
    <div class="tab-wrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>UM</th><th>Arm.</th><th>Endereço</th>${c?'<th class="n">Saldo congelado</th>':''}<th class="n">1ª contagem</th><th class="n">Recontagem</th>${c?'<th class="n">Diferença</th>':''}<th>Situação</th><th class="nao-imprime">Ação</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }finally{ITENS=TODOS}
}
async function contar(id){
  const el=$('q'+id),v=el.value.replace(',','.');if(v===''||isNaN(+v)||+v<0)return alert('Digite a quantidade contada (0 ou mais).');
  el.disabled=true;
  try{const st=await rpc('inv_contar',{p_item:id,p_qtd:+v});toast(st==='ok'?'✓ Contagem confere.':st==='recontar'?'⚠ Não confere com o sistema: faça a recontagem.':st==='divergente'?'✖ Recontagem também diferente: escreva a justificativa.':'Salvo.');
    ITENS=await rpc('inv_itens',{p_lista:LISTA.id});desenharLista();const nx=document.querySelector('input.qtd');if(nx)nx.focus()}
  catch(e){alert(e.message);el.disabled=false}
}
async function justificar(id){const t=$('j'+id).value.trim();if(!t)return alert('Escreva a justificativa.');
  try{await rpc('inv_justificar',{p_item:id,p_texto:t});toast('Justificativa enviada ao coordenador.');ITENS=await rpc('inv_itens',{p_lista:LISTA.id});desenharLista()}catch(e){alert(e.message)}}
async function decidir(id,ap){const obs=prompt(ap?'Observação (opcional):':'Motivo da reprovação (o item volta para recontagem):','');if(obs===null)return;
  try{await rpc('inv_decidir',{p_item:id,p_aprovar:ap,p_obs:obs});toast(ap?'Aprovado.':'Reprovado: volta para recontagem.');ITENS=await rpc('inv_itens',{p_lista:LISTA.id});desenharLista()}catch(e){alert(e.message)}}
async function desfazer(id){const m=prompt('Desfazer a contagem deste item? Ele volta para "a contar" (no coletor, o item sai da lista).\nMotivo:','digitado errado');if(m===null)return;
  try{await rpc('inv_desfazer',{p_item:id,p_motivo:m});toast('Contagem desfeita.');ITENS=await rpc('inv_itens',{p_lista:LISTA.id});desenharLista()}catch(e){alert(e.message)}}
async function statusLista(s){if(!confirm({fechada:'Fechar a lista? Só fecha se todos os itens estiverem OK ou aprovados.',cancelada:'Cancelar esta lista?',aberta:'Reabrir a lista?'}[s]))return;
  try{await rpc('inv_status_lista',{p_lista:LISTA.id,p_status:s});toast('Lista '+s+'.');abrir(LISTA.id)}catch(e){alert(e.message)}}

// folha de contagem cega (sem saldo) para imprimir
function imprimir(){
  const l=LISTA;
  $('folha').innerHTML=`<h2 style="margin:0 0 4px">Folha de contagem — Lista #${l.id}</h2>
    <div style="font-size:12px;margin-bottom:10px">Filial ${esc(l.filial)} — ${esc(FIL[l.filial]||'')} • armazéns ${(l.armazens||[]).map(a=>a.padStart(2,'0')).join(', ')} • data ${dBR(l.data_contagem)}</div>
    <table style="width:100%;border-collapse:collapse"><thead><tr><th>#</th><th>Código</th><th>Descrição</th><th>UM</th><th>Arm.</th><th>Endereço</th><th style="width:90px">1ª contagem</th><th style="width:90px">Recontagem</th></tr></thead>
    <tbody>${ITENS.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.codigo)}</td><td>${esc(i.descricao)}</td><td>${esc(i.unidade||'')}</td><td>${esc(String(i.armazem).padStart(2,'0'))}</td><td>${esc(i.localizacao||'')}</td><td></td><td></td></tr>`).join('')}</tbody></table>
    <div style="margin-top:28px;display:flex;gap:40px;font-size:12px"><div>Contado por: ______________________________</div><div>Data: ____/____/______</div></div>`;
  document.body.classList.add('imprimindo');setTimeout(()=>{window.print();document.body.classList.remove('imprimindo')},50);
}
// planilha para subir no Protheus (inventário SB7) — quantidade final contada dos itens OK/aprovados
function exportar(){
  if(!window.XLSX)return alert('Não consegui carregar o gerador de Excel. Atualize a página.');
  const prontos=ITENS.filter(i=>i.status==='ok'||i.status==='aprovado'),falta=ITENS.length-prontos.length;
  if(!prontos.length)return alert('Nenhum item com contagem final (OK ou aprovado).');
  if(falta&&!confirm(falta+' item(ns) ainda sem contagem final ficarão FORA da planilha. Exportar mesmo assim?'))return;
  const l=LISTA,data=String(l.data_contagem).replace(/-/g,''),doc='INV'+String(l.id).padStart(6,'0');
  const linhas=prontos.map(i=>({B7_FILIAL:l.filial,B7_COD:i.codigo,B7_LOCAL:String(i.armazem).padStart(2,'0'),B7_DOC:doc,B7_QUANT:final(i),B7_DATA:data}));
  const ws=XLSX.utils.json_to_sheet(linhas),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'SB7');
  const conf=ITENS.map(i=>({Código:i.codigo,Descrição:i.descricao,UM:i.unidade,Armazém:String(i.armazem).padStart(2,'0'),'Saldo congelado':i.saldo,'1ª contagem':i.cont1,'Recontagem':i.cont2,'Quantidade final':final(i),'Diferença':final(i)!=null?final(i)-i.saldo:null,'Custo médio':i.custo,'Valor da diferença':final(i)!=null?(final(i)-i.saldo)*(i.custo||0):null,Situação:ROT[i.status]||i.status,Justificativa:i.justificativa||'','Contado por':quem(i.cont2_por||i.cont1_por),'Aprovado por':quem(i.decisao_por)}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(conf),'Conferência');
  XLSX.writeFile(wb,`inventario_${l.filial}_lista${l.id}_${data}.xlsx`);
}

// ── Acuracidade (por filial e mês) ──
async function desenharAcur(){
  $('vis-acur').innerHTML='<div class="card muted">Carregando…</div>';
  try{LISTAS=await rpc('inv_listas',{p_filial:null})}catch(e){$('vis-acur').innerHTML='<div class="card">Erro: '+esc(e.message)+'</div>';return}
  const g={};LISTAS.filter(l=>l.status!=='cancelada').forEach(l=>{const k=l.filial+'|'+String(l.data_contagem).slice(0,7),x=g[k]=g[k]||{f:l.filial,m:String(l.data_contagem).slice(0,7),listas:0,itens:0,fin:0,ok:0,ok1:0,val:0};
    x.listas++;x.itens+=l.itens;x.fin+=l.ok+l.divergentes+l.aguardando+l.aprovados;x.ok+=l.ok;x.ok1+=l.ok_1a;x.val+=Number(l.valor_div||0)});
  const L=Object.values(g).sort((a,b)=>b.m.localeCompare(a.m)||a.f.localeCompare(b.f));
  const tot=L.reduce((s,x)=>({fin:s.fin+x.fin,ok:s.ok+x.ok,ok1:s.ok1+x.ok1}),{fin:0,ok:0,ok1:0});
  $('vis-acur').innerHTML=`<div class="aviso"><b>Acuracidade</b> = itens sem diferença ÷ itens com contagem final × 100. "Na 1ª contagem" conta só os que bateram de primeira; "final" inclui os que bateram na recontagem. Sem tolerância: qualquer diferença conta como erro.</div>
    <div class="kpis"><div class="kpi"><b>${tot.fin?Math.round(tot.ok/tot.fin*1000)/10:0}%</b><span>acuracidade final (${tot.ok} de ${tot.fin})</span></div>
      <div class="kpi"><b>${tot.fin?Math.round(tot.ok1/tot.fin*1000)/10:0}%</b><span>acuracidade na 1ª contagem</span></div></div>
    <div class="card"><div class="tab-wrap" style="max-height:none"><table><thead><tr><th>Mês</th><th>Filial</th><th class="n">Listas</th><th class="n">Itens</th><th class="n">Com contagem final</th><th class="n">Sem diferença</th><th class="n">Acuracidade final</th><th class="n">Acuracidade 1ª contagem</th>${coord()?'<th class="n">Valor das diferenças</th>':''}</tr></thead>
    <tbody>${L.map(x=>`<tr><td>${x.m.split('-').reverse().join('/')}</td><td>${esc(x.f)} — ${esc(FIL[x.f]||'')}</td><td class="n">${x.listas}</td><td class="n">${x.itens}</td><td class="n">${x.fin}</td><td class="n">${x.ok}</td>
      <td class="n"><b>${x.fin?Math.round(x.ok/x.fin*1000)/10+'%':'–'}</b></td><td class="n">${x.fin?Math.round(x.ok1/x.fin*1000)/10+'%':'–'}</td>${coord()?`<td class="n">${rs(x.val)}</td>`:''}</tr>`).join('')||'<tr><td colspan="9" class="muted" style="padding:16px">Ainda não há contagens.</td></tr>'}</tbody></table></div></div>`;
}

// ── Coletor: digita o código, a descrição aparece, digita a quantidade e já sabe se confere ──
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
let COL={fil:LS('inv_fil')||'04',arm:'',prod:null,foco:null,arms:[]};
// o almoxarife conta UM armazém por vez: escolhe antes de começar e só troca encerrando o armazém
const hojeISO=()=>new Date().toISOString().slice(0,10);
function travaLer(){try{const t=JSON.parse(LS('inv_trava')||'null');return t&&t.data===hojeISO()?t:null}catch(e){return null}}
function travar(fil,arm){LS('inv_trava',JSON.stringify({fil,arm,data:hojeISO()}))}
function destravar(){try{localStorage.removeItem('inv_trava')}catch(e){}}
function encerrarArm(){if(!confirm('Encerrar a contagem do armazém '+COL.arm+'? Depois você escolhe o próximo armazém.'))return;destravar();COL.arm='';desenharColetor()}
function escolherArm(a){travar(COL.fil,a);COL.arm=a;desenharColetor()}
async function desenharColetor(){
  const t=travaLer();if(t){COL.fil=t.fil;COL.arm=t.arm}else COL.arm='';
  try{COL.arms=(await rpc('inv_armazens',{p_filial:COL.fil})).filter(a=>a.itens_com_saldo>0).map(a=>a.armazem)}catch(e){COL.arms=[]}
  if(!COL.arm){
    $('vis-coletor').innerHTML=`<div class="card" style="max-width:720px">
      <div class="barra" style="margin-bottom:14px"><label>Filial<select id="c-fil" onchange="COL.fil=this.value;LS('inv_fil',COL.fil);desenharColetor()">${Object.keys(FIL).sort().map(f=>`<option value="${f}"${f===COL.fil?' selected':''}>${f} — ${esc(FIL[f])}</option>`).join('')}</select></label></div>
      <div style="font-size:17px;font-weight:800;margin-bottom:4px">Qual armazém você vai contar agora?</div>
      <div class="muted" style="margin-bottom:12px">Conte um armazém por vez. Para trocar, você vai precisar encerrar o armazém atual.</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">${(COL.arms.length?COL.arms:['01']).map(a=>`<button class="btn" style="font-size:22px;padding:18px 28px;min-width:120px" onclick="escolherArm('${a}')">Armazém ${a}</button>`).join('')}</div>
    </div>`;
    return;
  }
  $('vis-coletor').innerHTML=`<div class="card">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px">
        <div style="background:#1e40af;color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;font-size:16px">📦 Contando: filial ${esc(COL.fil)} — armazém ${esc(COL.arm)}</div>
        <button class="btn sec" onclick="encerrarArm()">Encerrar este armazém</button>
        <span class="muted" style="margin-left:auto;max-width:420px">Contagem cega: o sistema não mostra o saldo. Se não conferir, a 2ª contagem abre na própria linha. Digitou errado? Fale com o administrador.</span>
      </div>
      <div class="tab-wrap" style="max-height:calc(100vh - 260px)"><table id="c-tab">
        <thead><tr><th style="width:150px">Código</th><th>Descrição</th><th style="width:60px">UM</th><th class="n" style="width:120px">1ª contagem</th><th class="n" style="width:150px">2ª contagem</th><th style="width:260px">Situação</th></tr></thead>
        <tbody>
          <tr style="background:#eff6ff">
            <td><input id="c-cod" inputmode="numeric" autocomplete="off" placeholder="código + Enter" style="width:100%;font-weight:700" onkeydown="if(event.key==='Enter')colBusca()"></td>
            <td id="c-desc" class="muted">digite ou bipe o código</td><td id="c-um"></td>
            <td class="n"><input id="c-qtd" type="number" min="0" step="any" inputmode="decimal" class="qtd" style="width:100%" placeholder="qtd" onkeydown="if(event.key==='Enter')colContar()" disabled></td>
            <td></td><td><button class="btn" id="c-btn" onclick="colContar()" disabled>Confirmar</button></td>
          </tr>
        </tbody>
        <tbody id="c-hist"><tr><td colspan="6" class="muted">Carregando…</td></tr></tbody>
      </table></div>
      <div id="c-msg" style="margin-top:8px"></div>
    </div>`;
  $('c-cod').focus();colHist();
}
async function colBusca(){
  const c=$('c-cod').value.trim();if(!c)return;
  $('c-desc').textContent='buscando…';$('c-msg').innerHTML='';
  try{COL.prod=await rpc('inv_produto',{p_codigo:c})}catch(e){COL.prod=null}
  if(!COL.prod){$('c-desc').innerHTML='<span style="color:#b91c1c;font-weight:700">Código não encontrado no cadastro.</span>';$('c-um').textContent='';$('c-qtd').disabled=$('c-btn').disabled=true;$('c-cod').select();return}
  $('c-desc').innerHTML='<b>'+esc(COL.prod.descricao||'')+'</b>';$('c-um').textContent=COL.prod.unidade||'';
  $('c-qtd').disabled=$('c-btn').disabled=false;$('c-qtd').value='';$('c-qtd').focus();
}
async function colContar(){
  if(!COL.prod)return colBusca();
  const v=String($('c-qtd').value).replace(',','.');if(v===''||isNaN(+v)||+v<0)return alert('Digite a quantidade contada.');
  $('c-btn').disabled=true;
  let r;
  try{r=await rpc('inv_coletar',{p_filial:COL.fil,p_armazem:COL.arm,p_codigo:COL.prod.codigo,p_qtd:+v})}
  catch(e){$('c-msg').innerHTML=`<div class="aviso" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">${esc(e.message)}</div>`;$('c-btn').disabled=false;return}
  $('c-cod').value='';$('c-qtd').value='';$('c-qtd').disabled=$('c-btn').disabled=true;$('c-desc').innerHTML='<span class="muted">digite ou bipe o código</span>';$('c-um').textContent='';COL.prod=null;
  $('c-msg').innerHTML=r.status==='ok'?`<div class="aviso" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534">✅ <b>${esc(r.codigo)}</b> confere.</div>`:
    r.status==='recontar'?`<div class="aviso" style="background:#fffbeb;border-color:#fde68a;color:#92400e">⚠️ <b>${esc(r.codigo)}</b> não confere: conte de novo e digite a 2ª contagem na linha.</div>`:'';
  COL.foco=r.status==='recontar'?r.item:null;await colHist();
  if(!COL.foco)$('c-cod').focus();
}
async function colRecontar(item){const el=$('q2-'+item),v=String(el.value).replace(',','.');if(v===''||isNaN(+v)||+v<0)return alert('Digite a 2ª contagem.');el.disabled=true;
  try{const st=await rpc('inv_contar',{p_item:item,p_qtd:+v});
    $('c-msg').innerHTML=st==='ok'?'<div class="aviso" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534">✅ 2ª contagem confere.</div>':'<div class="aviso" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">❌ A 2ª contagem também não confere: escreva a justificativa na linha.</div>';
    COL.foco=st==='divergente'?item:null}catch(e){alert(e.message);el.disabled=false;return}
  await colHist();if(!COL.foco)$('c-cod').focus()}
async function colJustificar(item){const t=$('j-'+item).value.trim();if(!t)return alert('Escreva a justificativa.');
  try{await rpc('inv_justificar',{p_item:item,p_texto:t});$('c-msg').innerHTML='<div class="aviso">Justificativa enviada ao coordenador.</div>';COL.foco=null}catch(e){alert(e.message);return}
  await colHist();$('c-cod').focus()}
async function colHist(){
  let h=[];try{h=(await rpc('inv_minhas_contagens',{p_filial:COL.fil})).filter(x=>String(x.armazem).replace(/^0+/,'')===String(COL.arm).replace(/^0+/,''))}catch(e){}
  $('c-hist').innerHTML=h.length?h.map(x=>{
    let sit=`<span class="st ${x.status}">${ROT[x.status]||x.status}</span>`,c2=nf(x.cont2);
    if(x.status==='recontar')c2=`<span style="display:flex;gap:4px;justify-content:flex-end"><input id="q2-${x.id}" type="number" min="0" step="any" inputmode="decimal" class="qtd" placeholder="2ª" onkeydown="if(event.key==='Enter')colRecontar(${x.id})"><button class="btn" onclick="colRecontar(${x.id})">OK</button></span>`;
    if(x.status==='divergente')sit=`<span style="display:flex;gap:4px"><input id="j-${x.id}" placeholder="justificativa" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')colJustificar(${x.id})"><button class="btn sec" onclick="colJustificar(${x.id})">Enviar</button></span>`;
    if(x.status==='justificado')sit+=`<div class="muted" style="font-size:11.5px">“${esc(x.justificativa||'')}”</div>`;
    return `<tr${x.status==='recontar'?' style="background:#fffbeb"':x.status==='divergente'?' style="background:#fef2f2"':''}><td><b>${esc(x.codigo)}</b></td><td>${esc(x.descricao||'')}</td><td>${esc(x.unidade||'')}</td><td class="n">${nf(x.cont1)}</td><td class="n">${c2}</td><td>${sit}</td></tr>`}).join('')
    :'<tr><td colspan="6" class="muted" style="padding:12px">Nenhuma contagem sua hoje neste armazém.</td></tr>';
  if(COL.foco){const el=$('q2-'+COL.foco)||$('j-'+COL.foco);if(el)el.focus()}
}

document.addEventListener('bq-acesso-ok',async e=>{
  EU=(e.detail.email||'').toLowerCase();$('quem').textContent=EU;
  try{PAPEL=await rpc('inv_papel');const{data}=await db.from('filiais').select('filial,nome_filial');(data||[]).forEach(f=>FIL[String(f.filial).trim()]=f.nome_filial)}catch(err){}
  if(podeContar())$('ab-coletor').style.display='';
  // almoxarife: sem contagem liberada (nenhuma lista aberta), abre direto o coletor
  if(podeContar()&&!coord()){let ab=[];try{ab=(await rpc('inv_listas',{p_filial:null})).filter(l=>l.status==='aberta'&&l.tipo==='lista')}catch(err){}
    if(!ab.length){aba('coletor');return}}
  carregarListas();
});
