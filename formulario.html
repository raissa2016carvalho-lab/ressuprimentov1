<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Solicitação de Ressuprimento</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#0f172a}
  .wrap{max-width:520px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:#64748b;font-size:13px;margin:0 0 18px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:14px}
  label{font-size:12px;font-weight:600;color:#64748b;display:block;margin:0 0 5px}
  input,select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #e2e8f0;font-size:14px;box-sizing:border-box;outline:none;margin-bottom:14px;font-family:inherit}
  .item{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px}
  .item-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .item-remover{border:none;background:none;color:#94a3b8;cursor:pointer;font-size:18px;line-height:1}
  .btn-add{background:#f1f5f9;border:1px dashed #cbd5e1;border-radius:9px;padding:10px;width:100%;font-size:13px;color:#475569;cursor:pointer;font-weight:600}
  .btn-enviar{width:100%;padding:14px;border-radius:10px;border:none;background:#0d9488;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
  .btn-enviar:disabled{background:#e2e8f0;cursor:not-allowed}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px}
  .erro{background:#fee2e2;color:#991b1b}
  .ok{background:#d1fae5;color:#065f46;text-align:center;padding:24px}
  .quant-just{display:flex;gap:10px}
  .quant-just > div:first-child{flex:1}
  .quant-just > div:last-child{flex:3}
</style>
</head>
<body>
<div class="wrap">
  <h1>Solicitação de Ressuprimento</h1>
  <p class="sub">Preencha seus dados, escolha sua base e adicione os itens.</p>

  <div id="form-area">
    <div class="card">
      <label>Nome completo</label>
      <input id="nome" placeholder="Seu nome"/>
      <label>Matrícula</label>
      <input id="matricula" placeholder="Ex.: 12345"/>
      <label>Centro de custo / base</label>
      <select id="cc"><option value="">Carregando bases...</option></select>
    </div>

    <div class="card">
      <label style="margin-bottom:10px">Itens da solicitação</label>
      <div id="itens-lista"></div>
      <button class="btn-add" id="btn-add-item">+ Adicionar item</button>
    </div>

    <div id="msg-area"></div>
    <button class="btn-enviar" id="btn-enviar">Enviar solicitação</button>
  </div>

  <div id="sucesso" style="display:none" class="card ok">
    <div style="font-size:32px;margin-bottom:8px">✓</div>
    <div style="font-weight:700;font-size:16px;margin-bottom:6px">Solicitação enviada!</div>
    <div style="color:#047857;font-size:13px">Recebemos seu pedido. A equipe vai avaliar em breve.</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://vvwtqbehfwrgcmbjdniu.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d3RxYmVoZndyZ2NtYmpkbml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjg3NTcsImV4cCI6MjA5NzEwNDc1N30.jHxva16Nae109RiWDlgl21saOJ6gBihstMmlKRRBXis";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);

  let contItens = 0;

  function adicionarItem() {
    contItens++;
    const id = "item-" + contItens;
    const div = document.createElement("div");
    div.className = "item";
    div.id = id;
    div.innerHTML = `
      <div class="item-topo">
        <label style="flex:1">Item</label>
        <button class="item-remover" onclick="document.getElementById('${id}').remove()">✕</button>
      </div>
      <input class="item-descricao" placeholder="Nome do material" style="margin-bottom:10px"/>
      <div class="quant-just">
        <div><label>Quantidade</label><input class="item-qtd" type="number" min="0" placeholder="0"/></div>
        <div><label>Justificativa</label><input class="item-just" placeholder="Por que precisa?"/></div>
      </div>
    `;
    $("itens-lista").appendChild(div);
  }
  $("btn-add-item").addEventListener("click", adicionarItem);
  adicionarItem(); // já começa com 1 item

  // carrega as bases (centros de custo) na lista
  async function carregarBases() {
    const { data, error } = await db.from("ccs_publico").select("*");
    const select = $("cc");
    if (error) {
      select.innerHTML = `<option value="">Erro ao carregar bases</option>`;
      mostrarMsg("Não foi possível carregar as bases: " + error.message, "erro");
      return;
    }
    select.innerHTML = `<option value="">Selecione sua base...</option>` +
      data.map(c => `<option value="${c.cc}">${c.nome} — ${c.cc}</option>`).join("");
  }
  carregarBases();

  function mostrarMsg(texto, tipo) {
    $("msg-area").innerHTML = `<div class="msg ${tipo}">${texto}</div>`;
  }

  $("btn-enviar").addEventListener("click", async () => {
    $("msg-area").innerHTML = "";
    const nome = $("nome").value.trim();
    const matricula = $("matricula").value.trim();
    const cc = $("cc").value;

    const itensEls = document.querySelectorAll(".item");
    const itens = [];
    for (const el of itensEls) {
      const descricao = el.querySelector(".item-descricao").value.trim();
      const qtd = el.querySelector(".item-qtd").value;
      const just = el.querySelector(".item-just").value.trim();
      if (descricao || qtd || just) {
        itens.push({ codigo: "MANUAL", descricao, quantidade: Number(qtd) || 0, justificativa: just });
      }
    }

    if (!nome || !matricula) { mostrarMsg("Preencha nome e matrícula.", "erro"); return; }
    if (!cc) { mostrarMsg("Selecione sua base.", "erro"); return; }
    if (itens.length === 0) { mostrarMsg("Adicione pelo menos um item.", "erro"); return; }
    for (const it of itens) {
      if (!it.descricao || !it.quantidade || !it.justificativa) {
        mostrarMsg("Preencha descrição, quantidade e justificativa de todos os itens.", "erro");
        return;
      }
    }

    $("btn-enviar").disabled = true;
    $("btn-enviar").textContent = "Enviando...";

    const { error } = await db.rpc("criar_solicitacao", {
      p_cc: cc, p_nome: nome, p_matricula: matricula, p_itens: itens
    });

    if (error) {
      mostrarMsg("Erro ao enviar: " + error.message, "erro");
      $("btn-enviar").disabled = false;
      $("btn-enviar").textContent = "Enviar solicitação";
      return;
    }

    $("form-area").style.display = "none";
    $("sucesso").style.display = "block";
  });
</script>
</body>
</html>
