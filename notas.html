.st-C{background:#fee2e2;color:#991b1b}

tr.sel td{background:#eff6ff!important}

<script>
const db=window.supabase.createClient('https://eugefrjckrxisfpizkjb.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Z2Vmcmpja3J4aXNmcGl6a2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzEzNjksImV4cCI6MjEwNDAwNzM2OX0.sNQjKjlUm1TWeiDGG2SDeER7GGaf4PucofJWNKxqygI');
const $=id=>document.getElementById(id);
const SETORES=['Compras','Almoxarifado','Fiscal','RH','Frota','Oficina','TI','Facilities/Administrativo','Financeiro','Outros'];
// códigos do NFe Master (a confirmar com notas de exemplo)
const ST_INT={'1':'Pendente','2':'Associado','3':'Integrado'};
const ST_NFE={'A':'Autorizada','C':'Cancelada','D':'Denegada'};
const POR_PAG=100;
let notas=[],setForn={},setNota={},lista=[],pag=0,userEmail='',aba='notas',sel=new Set();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtR=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtR0=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const fmtCnpj=c=>{c=String(c||'').replace(/\D/g,'');return c.length===14?c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):c};
const chaveCnpj=c=>String(c||'').replace(/\D/g,'');
const fmtData=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—';
const opcSetor=v=>'<option value="">— escolher —</option>'+SETORES.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');

async function buscarTudo(tabela,colunas){
  let out=[],de=0;
  for(;;){let{data,error}=await db.from(tabela).select(colunas).order('id',{ascending:true}).range(de,de+999);
    if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;de+=1000}
  return out;
}
async function buscarSetores(tabela,chave){
  let out=[],de=0;
  for(;;){let{data,error}=await db.from(tabela).select(chave+',setor,atualizado_por').range(de,de+999);
    if(error)return {erro:error};out=out.concat(data||[]);if(!data||data.length<1000)break;de+=1000}
  return {dados:out};
}

async function carregar(){
  $('tabela').innerHTML='<div class="msg-vazio">Carregando notas...</div>';
  try{
    let [ns,sf,sn,{data:log}]=await Promise.all([
      buscarTudo('nfe_master','id,numero,serie,filial,empresa_nome,fornecedor_cnpj,fornecedor_nome,fornecedor_fantasia,valor_total,emissao,chegada,status_nfe,status_integracao,pedido,em_tratativa'),
      buscarSetores('fornecedor_setor','cnpj'),buscarSetores('nfe_setor','nfe_id'),
      db.from('sync_log').select('atualizado_em').eq('chave','nfe_master').maybeSingle()
    ]);
    let faltam=[sf.erro&&'fornecedor_setor',sn.erro&&'nfe_setor'].filter(Boolean);
    if(faltam.length){$('tabela').innerHTML='<div class="msg-vazio">Falta criar no banco: <b>'+faltam.join(', ')+'</b>. Rode o SQL que a Raissa recebeu.</div>';return}
    notas=ns;setForn={};sf.dados.forEach(x=>setForn[chaveCnpj(x.cnpj)]=x);setNota={};sn.dados.forEach(x=>setNota[x.nfe_id]=x);
    $('tag-sync').textContent=log&&log.atualizado_em?'NFe Master atualizado em '+new Date(log.atualizado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'sem registro de sync';
    montarFiltros();agrupar();render();
  }catch(e){$('tabela').innerHTML='<div class="msg-vazio">Não consegui carregar (o banco pode estar ocupado com os syncs). Clique em ↻ Atualizar.<br><small>'+esc(e.message||e)+'</small></div>'}
}

function montarFiltros(){
  let v=$('f-setor').value;
  $('f-setor').innerHTML='<option value="">Todos</option><option value="__sem">⚠ Sem setor</option>'+SETORES.map(x=>'<option>'+esc(x)+'</option>').join('');$('f-setor').value=v;
  let fil={};notas.forEach(n=>{if(n.filial)fil[n.filial]=n.empresa_nome||n.filial});
  let vf=$('f-filial').value;
  $('f-filial').innerHTML='<option value="">Todas</option>'+Object.keys(fil).sort().map(k=>'<option value="'+k+'">'+k+' · '+esc(String(fil[k]).replace(/^B&Q ENERGIA LTDA\s*-?\s*/i,'')||'MATRIZ')+'</option>').join('');$('f-filial').value=vf;
  let vs=$('f-status').value;
  $('f-status').innerHTML='<option value="">Todos</option>'+Object.keys(ST_INT).map(k=>'<option value="'+k+'">'+ST_INT[k]+'</option>').join('')+'<option value="C">Canceladas</option>';$('f-status').value=vs;
  $('sel-setor-lote').innerHTML=opcSetor('').replace('— escolher —','— escolher setor —')+'<option value="__limpar">(tirar o setor)</option>';
}
function setAba(a){aba=a;pag=0;$('aba-notas').classList.toggle('ativo',a==='notas');$('aba-forn').classList.toggle('ativo',a==='forn');
  document.querySelectorAll('.so-notas').forEach(e=>e.style.display=a==='notas'?'':'none');render()}

// setor da nota: o escolhido na nota; se não tiver, o do fornecedor
function setorDa(n){let s=setNota[n.id];if(s)return {setor:s.setor,origem:'nota'};let f=setForn[chaveCnpj(n.fornecedor_cnpj)];return f?{setor:f.setor,origem:'forn'}:{setor:'',origem:''}}

// período pela data de emissão (dia da nota, sem fuso)
function noPeriodo(n){let de=$('f-de').value,ate=$('f-ate').value,d=String(n.emissao||'').slice(0,10);if(!de&&!ate)return true;if(!d)return false;return (!de||d>=de)&&(!ate||d<=ate)}
function _rotPeriodo(){let de=$('f-de').value,ate=$('f-ate').value,f=x=>x.split('-').reverse().join('/');if(!de&&!ate)return 'desde jan/2025';if(de===ate)return 'em '+f(de);return (de?'de '+f(de):'')+(ate?' até '+f(ate):'')}
function _iso(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
// atalhos: dias(atrás_início, atrás_fim) — dias(null) = sem limite
function dias(ini,fim){if(ini===null){$('f-de').value='';$('f-ate').value=''}else{let h=new Date();$('f-de').value=_iso(new Date(h.getFullYear(),h.getMonth(),h.getDate()-ini));$('f-ate').value=_iso(new Date(h.getFullYear(),h.getMonth(),h.getDate()-fim))}
  document.querySelectorAll('.btn-dia').forEach(b=>b.classList.remove('ativo'));if(event&&event.target)event.target.classList.add('ativo');pag=0;render()}

function agrupar(){
  let m={};
  notas.forEach(n=>{
    if(n.status_nfe==='C'||!noPeriodo(n))return;let k=chaveCnpj(n.fornecedor_cnpj);if(!k)return;
    let t=n.emissao?new Date(n.emissao).getTime():0;
    let f=m[k]||(m[k]={cnpj:k,nome:n.fornecedor_nome||n.fornecedor_fantasia||'(sem nome)',notas:0,valor:0,ultima:0});
    f.notas++;f.valor+=Number(n.valor_total)||0;if(t>f.ultima){f.ultima=t;f.nome=n.fornecedor_nome||f.nome}
  });
  lista=Object.values(m).sort((a,b)=>b.notas-a.notas||b.valor-a.valor);
}

function notasFiltradas(){
  let b=$('f-busca').value.toLowerCase().trim(),bd=b.replace(/\D/g,''),st=$('f-setor').value,fil=$('f-filial').value,si=$('f-status').value;
  return notas.filter(n=>{
    if(!noPeriodo(n))return false;
    if(si==='C'){if(n.status_nfe!=='C')return false}else{if(n.status_nfe==='C')return false;if(si&&n.status_integracao!==si)return false}
    if(fil&&n.filial!==fil)return false;
    let s=setorDa(n).setor;if(st==='__sem'&&s)return false;if(st&&st!=='__sem'&&s!==st)return false;
    if(b){let nome=(n.fornecedor_nome||'').toLowerCase();if(!nome.includes(b)&&!(bd&&(String(n.numero||'').includes(bd)||chaveCnpj(n.fornecedor_cnpj).includes(bd))))return false}
    return true;
  }).sort((a,b)=>String(b.emissao||'').localeCompare(String(a.emissao||'')));
}
function fornFiltrados(){
  let b=$('f-busca').value.toLowerCase().trim(),bd=b.replace(/\D/g,''),st=$('f-setor').value;
  return lista.filter(f=>{let s=(setForn[f.cnpj]||{}).setor||'';
    if(st==='__sem'&&s)return false;if(st&&st!=='__sem'&&s!==st)return false;
    if(b&&!f.nome.toLowerCase().includes(b)&&!(bd&&f.cnpj.includes(bd)))return false;return true});
}

function resumoNotas(){
  let ns=notas.filter(n=>n.status_nfe!=='C'&&noPeriodo(n)),com=ns.filter(n=>setorDa(n).setor).length;
  let pend=ns.filter(n=>n.status_integracao==='1').length;
  $('resumo').innerHTML=
    '<div class="resumo-card"><div class="val">'+ns.length.toLocaleString('pt-BR')+'</div><div class="lab">Notas emitidas '+_rotPeriodo()+'</div><div class="sub" id="sub-periodo">sem as canceladas</div></div>'+
    '<div class="resumo-card verde"><div class="val">'+com.toLocaleString('pt-BR')+'</div><div class="lab">Com setor</div></div>'+
    '<div class="resumo-card alerta"><div class="val">'+(ns.length-com).toLocaleString('pt-BR')+'</div><div class="lab">Sem setor</div></div>'+
    '<div class="resumo-card azul"><div class="val">'+(ns.length?Math.round(com/ns.length*100):0)+'%</div><div class="lab">das notas já têm setor</div></div>'+
    '<div class="resumo-card"><div class="val" style="color:#b45309">'+pend.toLocaleString('pt-BR')+'</div><div class="lab">Pendentes de integração</div></div>';
}
function resumoForn(){
  let tot=lista.length,com=lista.filter(f=>(setForn[f.cnpj]||{}).setor).length;
  $('resumo').innerHTML=
    '<div class="resumo-card"><div class="val">'+tot.toLocaleString('pt-BR')+'</div><div class="lab">Fornecedores com nota no período</div></div>'+
    '<div class="resumo-card verde"><div class="val">'+com.toLocaleString('pt-BR')+'</div><div class="lab">Com setor (padrão do fornecedor)</div></div>'+
    '<div class="resumo-card alerta"><div class="val">'+(tot-com).toLocaleString('pt-BR')+'</div><div class="lab">Sem setor</div><div class="sub">o setor do fornecedor vale para todas as notas dele que não tiverem setor próprio</div></div>';
}

function paginar(l){let pags=Math.max(1,Math.ceil(l.length/POR_PAG));if(pag>=pags)pag=pags-1;
  $('paginador').innerHTML=pags>1?'<button onclick="pag--;render();scrollTo(0,0)" '+(pag?'':'disabled')+'>← Anterior</button> Página '+(pag+1)+' de '+pags+' ('+l.length.toLocaleString('pt-BR')+') <button onclick="pag++;render();scrollTo(0,0)" '+(pag<pags-1?'':'disabled')+'>Próxima →</button>':l.length+' registros';
  return l.slice(pag*POR_PAG,(pag+1)*POR_PAG)}

function render(){
  agrupar();
  if(aba==='forn'){renderForn();$('barra-sel').style.display='none';return}
  resumoNotas();
  let l=notasFiltradas(),parte=paginar(l);
  if(!parte.length){$('tabela').innerHTML='<div class="msg-vazio">Nenhuma nota com esses filtros.</div>';$('paginador').innerHTML='';atualizarBarra();return}
  let todasMarcadas=parte.every(n=>sel.has(n.id));
  $('tabela').innerHTML='<table><thead><tr><th style="width:34px"><input type="checkbox" class="cb" title="Marcar todas desta página" '+(todasMarcadas?'checked':'')+' onclick="marcarPagina(this.checked)"></th><th>Emissão</th><th>Nº nota</th><th>Fornecedor</th><th>Filial</th><th class="num">Valor</th><th>Status</th><th>Setor</th></tr></thead><tbody>'+
    parte.map(n=>{let s=setorDa(n),st=n.status_nfe==='C'?'<span class="pill st-C">Cancelada</span>':'<span class="pill st-'+(ST_INT[n.status_integracao]?n.status_integracao:'x')+'">'+(ST_INT[n.status_integracao]||('Código '+esc(n.status_integracao||'—')))+'</span>';
      if(n.status_nfe&&n.status_nfe!=='A'&&n.status_nfe!=='C')st+=' <span class="pill st-x" title="Status da NF-e">'+esc(ST_NFE[n.status_nfe]||'NF '+n.status_nfe)+'</span>';
      if(n.em_tratativa)st+=' <span class="pill st-1">Em tratativa</span>';
      return '<tr class="'+(sel.has(n.id)?'sel':'')+'"><td><input type="checkbox" class="cb" '+(sel.has(n.id)?'checked':'')+' onclick="marcar('+n.id+',this)"></td>'+
        '<td class="num" style="text-align:left">'+fmtData(n.emissao)+'</td>'+
        '<td style="font-family:ui-monospace,monospace;white-space:nowrap">'+esc(n.numero)+(n.serie!=null?'<span class="cnpj"> /'+esc(n.serie)+'</span>':'')+'</td>'+
        '<td><div style="font-weight:600">'+esc(n.fornecedor_nome||n.fornecedor_fantasia||'—')+'</div><div class="cnpj">'+fmtCnpj(n.fornecedor_cnpj)+'</div></td>'+
        '<td>'+esc(n.filial||'—')+'</td><td class="num">'+fmtR(n.valor_total)+'</td><td>'+st+'</td>'+
        '<td><select class="sel-setor'+(s.setor?'':' vazio')+'" onchange="salvarNotas(['+n.id+'],this.value,this)">'+opcSetor(s.origem==='nota'?s.setor:'')+'</select>'+
        (s.origem==='forn'?'<div class="herdado">do fornecedor: '+esc(s.setor)+'</div>':'')+'</td></tr>'}).join('')+'</tbody></table>';
  atualizarBarra();
}
function renderForn(){
  resumoForn();
  let parte=paginar(fornFiltrados());
  if(!parte.length){$('tabela').innerHTML='<div class="msg-vazio">Nenhum fornecedor com esses filtros.</div>';$('paginador').innerHTML='';return}
  $('tabela').innerHTML='<table><thead><tr><th>Fornecedor</th><th class="num">Notas</th><th class="num">Valor</th><th class="num">Última emissão</th><th>Setor padrão</th></tr></thead><tbody>'+
    parte.map(f=>{let v=(setForn[f.cnpj]||{}).setor||'';
      return '<tr><td><div style="font-weight:600">'+esc(f.nome)+'</div><div class="cnpj">'+fmtCnpj(f.cnpj)+'</div></td><td class="num">'+f.notas+'</td><td class="num">'+fmtR0(f.valor)+'</td>'+
        '<td class="num">'+(f.ultima?new Date(f.ultima).toLocaleDateString('pt-BR'):'—')+'</td>'+
        '<td><select class="sel-setor'+(v?'':' vazio')+'" data-cnpj="'+f.cnpj+'" data-nome="'+esc(f.nome)+'" onchange="salvarForn(this)">'+opcSetor(v)+'</select></td></tr>'}).join('')+'</tbody></table>';
}

// seleção
function marcar(id,cb){cb.checked?sel.add(id):sel.delete(id);cb.closest('tr').classList.toggle('sel',cb.checked);atualizarBarra()}
function marcarPagina(v){let parte=notasFiltradas().slice(pag*POR_PAG,(pag+1)*POR_PAG);parte.forEach(n=>v?sel.add(n.id):sel.delete(n.id));render()}
function limparSel(){sel.clear();$('sel-msg').textContent='';render()}
function atualizarBarra(){let b=$('barra-sel');b.style.display=sel.size&&aba==='notas'?'flex':'none';$('sel-qtd').textContent=sel.size+' nota'+(sel.size>1?'s':'')+' selecionada'+(sel.size>1?'s':'')}
async function aplicarLote(){let v=$('sel-setor-lote').value;if(!v){$('sel-msg').textContent='Escolha o setor.';return}
  let ids=[...sel];$('sel-msg').textContent='Salvando '+ids.length+'...';
  let ok=await salvarNotas(ids,v==='__limpar'?'':v);if(ok){$('sel-msg').textContent='✓ '+ids.length+' nota(s) salvas';sel.clear();render()}}

async function salvarNotas(ids,setor,el){
  if(el)el.disabled=true;
  for(let i=0;i<ids.length;i+=500){let parte=ids.slice(i,i+500),r;
    if(setor)r=await db.from('nfe_setor').upsert(parte.map(id=>({nfe_id:id,setor,atualizado_em:new Date().toISOString(),atualizado_por:userEmail||null})),{onConflict:'nfe_id'});
    else r=await db.from('nfe_setor').delete().in('nfe_id',parte);
    if(r.error){alert('Não salvou: '+r.error.message);if(el)el.disabled=false;render();return false}
    parte.forEach(id=>{if(setor)setNota[id]={nfe_id:id,setor,atualizado_por:userEmail};else delete setNota[id]});
  }
  if(el)el.disabled=false;let pos=scrollY;render();scrollTo(0,pos);return true;
}
async function salvarForn(sel_){
  let cnpj=sel_.dataset.cnpj,setor=sel_.value;sel_.disabled=true;
  let r=setor?await db.from('fornecedor_setor').upsert({cnpj,nome:sel_.dataset.nome,setor,atualizado_em:new Date().toISOString(),atualizado_por:userEmail||null},{onConflict:'cnpj'})
             :await db.from('fornecedor_setor').delete().eq('cnpj',cnpj);
  sel_.disabled=false;
  if(r.error){alert('Não salvou: '+r.error.message);render();return}
  if(setor)setForn[cnpj]={cnpj,setor,atualizado_por:userEmail};else delete setForn[cnpj];
  let pos=scrollY;render();scrollTo(0,pos);
}

// Login: mesmo usuário do Painel principal
function liberar(email){userEmail=email||'';{let h=new Date(),i=_iso(new Date(h.getFullYear(),h.getMonth(),h.getDate()-6));$('f-de').value=i;$('f-ate').value=_iso(h)}document.body.classList.remove('bq-trancado');$('tela-login').style.display='none';carregar()}
async function entrar(){
  let email=$('lg-email').value.trim(),senha=$('lg-senha').value,msg=$('lg-msg'),b=$('lg-btn');msg.style.display='none';
  if(!email||!senha){msg.textContent='Preencha e-mail e senha.';msg.style.display='block';return}
  b.disabled=true;b.textContent='Entrando...';
  let{data,error}=await db.auth.signInWithPassword({email,password:senha});
  b.disabled=false;b.textContent='Entrar';
  if(error){msg.textContent=error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':error.message;msg.style.display='block';return}
  liberar(data.user&&data.user.email);
}
async function sair(){await db.auth.signOut();location.reload()}
(async()=>{let{data}=await db.auth.getSession();if(data&&data.session)liberar(data.session.user.email);else $('tela-login').style.display='flex'})();
</script>
