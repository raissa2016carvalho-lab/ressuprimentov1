async function fetchAll(table,sel,filt){const size=1000;let from=0,all=[];while(true){let q=db.from(table).select(sel||"*").range(from,from+size-1);if(filt)q=filt(q);const {data,error}=await q;if(error)throw error;all=all.concat(data||[]);if(!data||data.length<size)break;from+=size;}return all;}

function CurvaBadge({c}){if(!c)return null;const a=ABC[c]||ABC.C;return <span style={{background:a.cor,color:"#fff",fontWeight:700,fontSize:10,width:18,height:18,borderRadius:4,display:"inline-flex",alignItems:"center",justifyContent:"center",fontFamily:"ui-monospace,monospace"}}>{c}</span>;}
function StatusPill({s}){const x=STATUS[s]||{l:s,c:C.muted};return <span style={{color:x.c,background:x.c+"1a",fontSize:11,fontWeight:600,padding:"2px 9px",borderRadius:999,whiteSpace:"nowrap"}}>{x.l}</span>;}

/* ============ PROCESSAMENTO DE BASES (no navegador, em 2º plano) ============ */
const _norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function _pick(row,...keys){const m={};for(const k in row)m[_norm(k)]=row[k];for(const k of keys){const v=m[_norm(k)];if(v!==undefined&&v!=='')return v;}return undefined;}
const _title=s=>String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const _ymd=s=>{s=String(s||'').trim();return /^\d{8}$/.test(s)?s:null;};
function _hoje12(){const d=new Date();d.setUTCMonth(d.getUTCMonth()-12);const p=n=>String(n).padStart(2,'0');return ''+d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate());}
const _ch=(a,n)=>Array.from({length:Math.ceil(a.length/n)},(_,i)=>a.slice(i*n,i*n+n));
const _csv=file=>new Promise((res,rej)=>Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>res(r.data),error:rej}));
// streaming em Web Worker (não trava a tela) + chunk (rápido). Não guarda linhas.
function _reduzir(file,reducer,onLog,label){return new Promise((res,rej)=>{let n=0,marca=0;
  Papa.parse(file,{header:true,skipEmptyLines:true,transformHeader:_norm,worker:true,
    chunk:(r)=>{const rows=r.data;for(let i=0;i<rows.length;i++)reducer(rows[i]);n+=rows.length;if(onLog&&n-marca>=100000){marca=n;onLog(`  ${label}: ${n.toLocaleString('pt-BR')}`);}},
    complete:()=>{if(onLog)onLog(`  ${label}: ${n.toLocaleString('pt-BR')} linhas`);res(n);},error:rej});});}

async function upsert(t,rows,conf,onLog){let d=0;for(const part of _ch(rows,500)){const{error}=await db.from(t).upsert(part,conf?{onConflict:conf}:undefined);if(error)throw new Error(t+': '+error.message);d+=part.length;if(onLog)onLog(`  ${t}: ${d}/${rows.length}`);}}

/* --- Consumo + curva ABC (SCP + SB1) --- */
async function atualizarConsumo(files,onLog){
  onLog('Lendo cadastro de itens (SB1)…');
  const sb1=await _csv(files.sb1);const itM={};
  for(const r of sb1){const cod=String(_pick(r,'B1_COD')||'').trim();if(!cod)continue;
    itM[cod]={descricao:String(_pick(r,'B1_DESC')||'').replace(/\s+/g,' ').trim(),grupo:String(_pick(r,'B1_DESCGP','B1_GRUPO')||'').replace(/\s+/g,' ').trim()||'OUTROS',unidade:String(_pick(r,'B1_UM')||'UN').trim(),custo:parseFloat(_pick(r,'B1_UPRC'))||0};}
  const cutoff=_hoje12();const cons={};
  onLog('Lendo SCP e somando consumo dos últimos 12 meses…');
  await _reduzir(files.scp,d=>{const dt=_ymd(d.cpemissao);if(!dt||dt<cutoff)return;const cc=String(d.cpcc||'').trim(),prod=String(d.cpproduto||'').trim();if(!cc||!prod)return;cons[cc+'|'+prod]=(cons[cc+'|'+prod]||0)+(parseFloat(d.cpquant)||0);},onLog,'SCP');
  onLog('Calculando curva ABC por CC…');
  const byCc={};for(const k in cons){const i=k.indexOf('|');const c=k.slice(0,i),p=k.slice(i+1);const cm=cons[k]/12;if(cm<=0)continue;(byCc[c]=byCc[c]||[]).push({prod:p,cm,custo:(itM[p]?.custo||0)});}
  const consumo=[];const usados=new Set();
  for(const c in byCc){let a=byCc[c];const tv=a.reduce((s,x)=>s+x.cm*x.custo,0);
    if(tv>0){a.sort((x,y)=>y.cm*y.custo-x.cm*x.custo);let cu=0;for(const x of a){cu+=x.cm*x.custo;const r=cu/tv;x.curva=r<=.8?'A':r<=.95?'B':'C';}}
    else{a.sort((x,y)=>y.cm-x.cm);const tq=a.reduce((s,x)=>s+x.cm,0);let cu=0;for(const x of a){cu+=x.cm;const r=tq>0?cu/tq:1;x.curva=r<=.8?'A':r<=.95?'B':'C';}}
    for(const x of a){consumo.push({cc:c,codigo:x.prod,consumo_medio:Math.round(x.cm*100)/100,curva:x.curva});usados.add(x.prod);}}
  const itens=[...usados].map(c=>({codigo:c,descricao:itM[c]?.descricao||c,grupo:itM[c]?.grupo||'OUTROS',unidade:itM[c]?.unidade||'UN'}));
  onLog(`Gravando ${itens.length} itens e ${consumo.length} consumos…`);
  await upsert('itens',itens,'codigo',onLog);
  await upsert('consumo',consumo,'cc,codigo',onLog);
}

/* --- Pessoas por base (SRA) --- */
async function atualizarPessoas(files,onLog){
  onLog('Lendo SRA e contando pessoas ativas…');
  const sra=await _csv(files.sra);const ativos={};
  for(const r of sra){const sit=String(_pick(r,'SIT_FOLHA')||'').trim();if(!['NORMAL','FÉRIAS','AFASTADO'].includes(sit))continue;
    const c=String(_pick(r,'CCUSTO')||'').trim();const m=String(_pick(r,'MATRICULA')||'').trim();if(!c)continue;(ativos[c]=ativos[c]||new Set()).add(m);}
  const rows=Object.entries(ativos).map(([cc,set])=>({cc,pessoas:set.size}));
  onLog(`Atualizando pessoas em ${rows.length} centros de custo…`);
  await upsert('centros_custo',rows,'cc',onLog);
}

/* --- Centros de custo (xlsx) — não mexe em pessoas --- */
async function atualizarCC(files,onLog){
  onLog('Lendo Centro de Custo (.xlsx)…');
  const wb=XLSX.read(await files.cc.arrayBuffer(),{type:'array'});
  const ccRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const rows=[];
  for(const r of ccRows){const code=String(_pick(r,'Cod CC','cc')||'').trim();if(!code)continue;
    rows.push({cc:code,nome:_title(_pick(r,'Descrição','descricao')),estado:_title(_pick(r,'Estado')),macro:String(_pick(r,'Macro')||''),servico:String(_pick(r,'Serviço','servico')||'')});}
  onLog(`Atualizando ${rows.length} centros de custo…`);
  await upsert('centros_custo',rows,'cc',onLog);
}

/* --- Estoque (SB2) --- */
async function atualizarEstoque(files,onLog){
  onLog('Lendo SB2 (estoque)…');const seen={};
  await _reduzir(files.sb2,d=>{const cod=String(_pick(d,'b2cod','codigo')||'').trim();if(!cod)return;const local=String(_pick(d,'b2local','local')||'01').trim();seen[cod+'|'+local]={codigo:cod,local,saldo:parseFloat(_pick(d,'b2qatu','b2saldo','saldo'))||0};},onLog,'SB2');
  const rows=Object.values(seen);
  onLog(`Gravando ${rows.length} saldos…`);
  await db.from('estoque').delete().neq('id',-1);
  await upsert('estoque',rows,'codigo,local',onLog);
}

/* --- Pedidos de compra (SC7) — só das SCs associadas --- */
async function atualizarSC7(files,scNums,onLog){
  onLog(`Lendo SC7 e filtrando ${scNums.size} SC(s) associada(s)…`);
  const pcs=[];
  await _reduzir(files.sc7,d=>{const ns=String(d.c7numsc||'').trim();if(!scNums.has(ns))return;pcs.push({numsc:ns,produto:String(d.c7produto||'').trim(),pc_num:String(d.c7num||'').trim(),qtd:parseFloat(d.c7quant)||0,recebido:parseFloat(d.c7quje)||0,status:String(d.statusdesc||'').replace(/\s+/g,' ').trim(),emissao:_ymd(d.c7emissao)});},onLog,'SC7');
  onLog(`${pcs.length} pedidos ligados. Gravando…`);
  await db.from('pedidos_compra').delete().neq('id',-1);
  let d=0;for(const part of _ch(pcs,500)){const{error}=await db.from('pedidos_compra').insert(part);if(error)throw new Error('pedidos_compra: '+error.message);d+=part.length;onLog(`  enviados: ${d}/${pcs.length}`);}
}
/* ===================== APP (login) ===================== */
function App(){
  const [session,setSession]=useState(undefined);
  const [email,setEmail]=useState("");const [senha,setSenha]=useState("");const [erro,setErro]=useState("");const [ent,setEnt]=useState(false);
  useEffect(()=>{db.auth.getSession().then(({data})=>setSession(data.session));const {data:sub}=db.auth.onAuthStateChange((_e,s)=>setSession(s));return ()=>sub.subscription.unsubscribe();},[]);
  async function entrar(e){e.preventDefault();setErro("");setEnt(true);const {error}=await db.auth.signInWithPassword({email,password:senha});setEnt(false);if(error)setErro("E-mail ou senha inválidos.");}
  if(session===undefined)return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",color:C.muted}}>Carregando…</div>;
  if(!session)return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",padding:20}}>
    <form onSubmit={entrar} style={{width:"100%",maxWidth:360,background:"#fff",border:`1px solid ${C.line}`,borderRadius:16,padding:28,boxShadow:"0 10px 40px rgba(15,23,42,.08)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}><div style={{width:36,height:36,borderRadius:9,background:C.teal,display:"grid",placeItems:"center"}}><Ic.box size={20} color="#fff"/></div><div><div style={{fontWeight:800,fontSize:16,lineHeight:1}}>Ressuprimento</div><div style={{fontSize:11,color:C.muted,marginTop:3}}>Painel de gestão</div></div></div>
      <label style={{fontSize:12,fontWeight:600,color:C.muted}}>E-mail</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required style={{width:"100%",padding:"10px 12px",margin:"6px 0 14px",borderRadius:9,border:`1px solid ${C.line}`,fontSize:14,outline:"none"}}/>
      <label style={{fontSize:12,fontWeight:600,color:C.muted}}>Senha</label><input type="password" value={senha} onChange={e=>setSenha(e.target.value)} required style={{width:"100%",padding:"10px 12px",margin:"6px 0 16px",borderRadius:9,border:`1px solid ${C.line}`,fontSize:14,outline:"none"}}/>
      {erro&&<div style={{display:"flex",alignItems:"center",gap:6,color:C.red,fontSize:13,marginBottom:12}}><Ic.alert size={15} color={C.red}/> {erro}</div>}
      <button type="submit" disabled={ent} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"11px",borderRadius:9,border:"none",background:C.teal,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}><Ic.login size={17} color="#fff"/> {ent?"Entrando…":"Entrar"}</button>
    </form>
  </div>;
  return <Painel onLogout={()=>db.auth.signOut()} userEmail={session.user.email}/>;
}

/* ===================== PAINEL ===================== */
function Painel({onLogout,userEmail}){
  const [tab,setTab]=useState("solicitacoes");
  const [carregando,setCarregando]=useState(true);const [erro,setErro]=useState("");
  const [sols,setSols]=useState([]);const [ccs,setCcs]=useState([]);const [consumo,setConsumo]=useState([]);const [estoque,setEstoque]=useState([]);const [pcs,setPcs]=useState([]);
  const [fStatus,setFStatus]=useState("pendente");const [fEstado,setFEstado]=useState("");const [fMacro,setFMacro]=useState("");const [fCC,setFCC]=useState("");

  const carregar=useCallback(async()=>{
    setCarregando(true);setErro("");
    try{
      const [solDb,itDb,ccDb,consDb,estDb,pcDb]=await Promise.all([
        fetchAll("solicitacoes"),fetchAll("solicitacao_itens"),fetchAll("centros_custo"),
        fetchAll("consumo"),fetchAll("estoque"),fetchAll("pedidos_compra")]);
      const porSol={};itDb.forEach(i=>{(porSol[i.solicitacao_id]=porSol[i.solicitacao_id]||[]).push(i);});
      setSols(solDb.map(s=>({...s,itens:porSol[s.id]||[]})).sort((a,b)=>new Date(b.criado_em)-new Date(a.criado_em)));
      setCcs(ccDb);setConsumo(consDb);setEstoque(estDb);setPcs(pcDb);
    }catch(e){setErro("Erro ao carregar. Rodou o schema.sql novo? "+(e.message||""));}
    finally{setCarregando(false);}
  },[]);
  useEffect(()=>{carregar();},[carregar]);

  const ccMap=useMemo(()=>Object.fromEntries(ccs.map(c=>[c.cc,c])),[ccs]);
  const consumoMap=useMemo(()=>{const m={};consumo.forEach(c=>m[c.cc+'|'+c.codigo]=c);return m;},[consumo]);
  const estoqueMap=useMemo(()=>{const m={};estoque.forEach(e=>m[e.codigo]=(m[e.codigo]||0)+(Number(e.saldo)||0));return m;},[estoque]);
  const pcMap=useMemo(()=>{const m={};pcs.forEach(p=>{(m[p.numsc+'|'+p.produto]=m[p.numsc+'|'+p.produto]||[]).push(p);});return m;},[pcs]);

  const pendentes=sols.filter(s=>s.status==='pendente').length;
  const estados=useMemo(()=>[...new Set(ccs.map(c=>c.estado).filter(Boolean))].sort(),[ccs]);
  const macros=useMemo(()=>[...new Set(ccs.map(c=>c.macro).filter(Boolean))].sort(),[ccs]);
  const ccOpts=useMemo(()=>ccs.filter(c=>(!fEstado||c.estado===fEstado)&&(!fMacro||c.macro===fMacro)).map(c=>`${c.cc} — ${c.nome}`),[ccs,fEstado,fMacro]);
  const fCCcode=fCC?fCC.split(" — ")[0]:"";

  const solsFiltradas=useMemo(()=>sols.filter(s=>{
    if(fStatus!=='todas'&&s.status!==fStatus)return false;
    const cc=ccMap[s.cc];
    if(fEstado&&cc?.estado!==fEstado)return false;
    if(fMacro&&cc?.macro!==fMacro)return false;
    if(fCCcode&&s.cc!==fCCcode)return false;
    return true;
  }),[sols,fStatus,fEstado,fMacro,fCCcode,ccMap]);
  const associadas=useMemo(()=>sols.filter(s=>s.sc_numero&&s.sc_numero.trim()),[sols]);

  if(carregando)return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",color:C.muted,gap:12}}><Ic.loader size={28} color={C.muted}/><div>Carregando…</div></div>;
  if(erro)return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",padding:24}}><div style={{maxWidth:440,background:"#fff",border:`1px solid ${C.line}`,borderRadius:12,padding:24,textAlign:"center"}}><Ic.alert size={28} color={C.red}/><div style={{fontWeight:700,margin:"10px 0 6px"}}>Erro</div><div style={{fontSize:13.5,color:C.muted,marginBottom:16}}>{erro}</div><button onClick={carregar} style={{background:C.teal,color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontWeight:600,cursor:"pointer"}}>Tentar de novo</button></div></div>;

  return <div style={{display:"flex",minHeight:"100vh",background:C.paper}}>
    <nav style={{width:230,background:C.ink,color:"#cbd5e1",padding:"20px 14px",display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:9,padding:"0 8px 18px"}}><div style={{width:30,height:30,borderRadius:7,background:C.teal,display:"flex",alignItems:"center",justifyContent:"center"}}><Ic.box size={17} color="#fff"/></div><div><div style={{color:"#fff",fontWeight:700,fontSize:14,lineHeight:1}}>Ressuprimento</div><div style={{fontSize:10,color:"#64748b",marginTop:2}}>Painel de gestão</div></div></div>
      {[{id:"solicitacoes",label:"Solicitações",icon:Ic.inbox,badge:pendentes},{id:"acompanhamento",label:"Acompanhamento",icon:Ic.track},{id:"bases",label:"Bases",icon:Ic.db}].map(t=>{const Icon=t.icon,a=tab===t.id;
        return <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,border:"none",cursor:"pointer",textAlign:"left",background:a?C.teal:"transparent",color:a?"#fff":"#94a3b8",fontWeight:a?600:500,fontSize:13.5}}>
          <Icon size={17} color={a?"#fff":"#94a3b8"}/><span style={{flex:1}}>{t.label}</span>{t.badge?<span style={{background:"#ef4444",color:"#fff",fontSize:11,fontWeight:700,borderRadius:999,minWidth:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 6px"}}>{t.badge}</span>:null}
        </button>;})}
      <div style={{marginTop:"auto",paddingTop:16,borderTop:"1px solid #1e293b"}}>
        <button onClick={carregar} title="Atualizar" style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"9px 12px",borderRadius:8,border:"1px solid #334155",background:"#1e293b",color:"#cbd5e1",fontWeight:500,fontSize:13,cursor:"pointer",marginBottom:8}}><Ic.refresh size={15} color="#cbd5e1"/> Atualizar</button>
        <div style={{fontSize:11,color:"#64748b",padding:"0 8px 6px",wordBreak:"break-all"}}>{userEmail}</div>
        <button onClick={onLogout} style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"9px 12px",borderRadius:8,border:"1px solid #334155",background:"#1e293b",color:"#cbd5e1",fontWeight:500,fontSize:13,cursor:"pointer"}}><Ic.out size={15} color="#cbd5e1"/> Sair</button>
      </div>
    </nav>

    <main style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
      {tab==="solicitacoes"&&<>
        <div style={{background:"#fff",borderBottom:`1px solid ${C.line}`,padding:"16px 24px"}}>
          <div style={{display:"flex",alignItems:"center",gap:7,fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:12}}><Ic.filter size={14} color={C.muted}/> Filtros</div>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
            <Sel label="Status" value={fStatus} onChange={setFStatus} options={[["pendente","Pendentes"],["em_analise","Em análise"],["aprovada","Aprovadas"],["recusada","Recusadas"],["parcial","Parciais"],["todas","Todas"]]} todos={false}/>
            <Sel label="Estado" value={fEstado} onChange={v=>{setFEstado(v);setFCC("");}} options={estados.map(e=>[e,e])}/>
            <Sel label="Macro" value={fMacro} onChange={v=>{setFMacro(v);setFCC("");}} options={macros.map(e=>[e,e])}/>
            <Sel label="Centro de Custo" value={fCC} onChange={setFCC} options={ccOpts.map(e=>[e,e])}/>
          </div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:24}}>
          {solsFiltradas.length===0?<Vazio txt="Nenhuma solicitação para esse filtro."/>:
            <div style={{display:"flex",flexDirection:"column",gap:12,maxWidth:920}}>{solsFiltradas.map(s=><SolCard key={s.id} sol={s} ccMap={ccMap} consumoMap={consumoMap} estoqueMap={estoqueMap} onSalvo={carregar}/>)}</div>}
        </div>
      </>}

      {tab==="acompanhamento"&&<div style={{flex:1,overflowY:"auto",padding:24}}>
        <h2 style={{fontSize:16,marginTop:0}}>SCs associadas — status dos pedidos</h2>
        {associadas.length===0?<Vazio txt="Nenhuma solicitação com SC associada ainda. Associe o nº da SC numa solicitação aprovada (aba Solicitações)."/>:
          <div style={{display:"flex",flexDirection:"column",gap:12,maxWidth:920}}>{associadas.map(s=><AcompCard key={s.id} sol={s} ccMap={ccMap} pcMap={pcMap}/>)}</div>}
      </div>}

      {tab==="bases"&&<div style={{flex:1,overflowY:"auto",padding:24}}><Bases sols={sols} onConcluir={carregar}/></div>}
    </main>
  </div>;
}

function Sel({label,value,onChange,options,todos=true}){return <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:0,flex:"1 1 150px"}}>
  <span style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:"uppercase",letterSpacing:.4}}>{label}</span>
  <select value={value} onChange={e=>onChange(e.target.value)} style={{appearance:"none",background:"#fff",border:`1px solid ${C.line}`,borderRadius:8,padding:"9px 12px",fontSize:13,fontWeight:500,cursor:"pointer",outline:"none"}}>
    {todos&&<option value="">Todos</option>}{options.map(([v,l])=><option key={v} value={v}>{l}</option>)}
  </select></div>;}
function Vazio({txt}){return <div style={{background:"#fff",border:`1px dashed ${C.line}`,borderRadius:12,padding:40,textAlign:"center",color:C.muted,fontSize:13.5,maxWidth:920}}>{txt}</div>;}

/* ===================== SOLICITAÇÃO (avaliar) ===================== */
function SolCard({sol,ccMap,consumoMap,estoqueMap,onSalvo}){
  const [aberto,setAberto]=useState(false);
  const [sit,setSit]=useState(()=>Object.fromEntries(sol.itens.map(i=>[i.id,i.situacao||'pendente'])));
  const [scNum,setScNum]=useState(sol.sc_numero||"");
  const [obs,setObs]=useState(sol.observacao||"");
  const [salvando,setSalvando]=useState(false);
  const base=ccMap[sol.cc];
  const data=new Date(sol.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});

  async function salvar(){
    setSalvando(true);
    try{
      await Promise.all(sol.itens.map(i=>db.from('solicitacao_itens').update({situacao:sit[i.id]}).eq('id',i.id)));
      const vals=Object.values(sit);const ap=vals.filter(v=>v==='aprovado').length,re=vals.filter(v=>v==='recusado').length;
      let status='em_analise';
      if(ap>0&&re===0&&ap===vals.length)status='aprovada';
      else if(re===vals.length)status='recusada';
      else if(ap>0&&(re>0||ap<vals.length))status='parcial';
      else if(ap===0&&re===0)status='pendente';
      await db.from('solicitacoes').update({status,sc_numero:scNum.trim()||null,observacao:obs.trim()||null,atualizado_em:new Date().toISOString()}).eq('id',sol.id);
      onSalvo();
    }catch(e){alert("Erro ao salvar: "+(e.message||e));}
    finally{setSalvando(false);}
  }
  const setItem=(id,v)=>setSit(s=>({...s,[id]:s[id]===v?'pendente':v}));

  return <div style={{background:"#fff",borderRadius:12,border:`1px solid ${C.line}`,borderLeft:`4px solid ${(STATUS[sol.status]||{}).c||C.muted}`,overflow:"hidden"}}>
    <button onClick={()=>setAberto(v=>!v)} style={{width:"100%",border:"none",background:"none",cursor:"pointer",padding:16,textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
      <div style={{minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}><span style={{fontWeight:700,fontSize:14}}>{base?base.nome:sol.cc}</span><span style={{fontSize:12,color:C.muted,fontFamily:"ui-monospace,monospace"}}>· {sol.cc}</span><StatusPill s={sol.status}/></div>
        <div style={{fontSize:12,color:C.muted,marginTop:3}}>{sol.solicitante_nome} · mat. {sol.solicitante_matricula} · {data} · {sol.itens.length} {sol.itens.length===1?"item":"itens"}{sol.sc_numero?` · SC ${sol.sc_numero}`:""}</div>
      </div>
      <span style={{color:C.teal,fontWeight:600,fontSize:12.5,display:"flex",alignItems:"center",gap:3,whiteSpace:"nowrap"}}>{aberto?"Fechar":"Avaliar"} {aberto?<Ic.down size={15} color={C.teal}/>:<Ic.right size={15} color={C.teal}/>}</span>
    </button>
    {aberto&&<div style={{borderTop:`1px solid ${C.line}`,background:"#f8fafc",padding:16}}>
      <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,minWidth:680}}>
        <thead><tr style={{color:C.muted,textAlign:"left"}}>
          <th style={{padding:"8px 10px",fontWeight:600}}>Item</th><th style={{padding:"8px 6px",fontWeight:600,textAlign:"right"}}>Qtd ped.</th>
          <th style={{padding:"8px 6px",fontWeight:600,textAlign:"right"}}>Consumo/mês</th><th style={{padding:"8px 6px",fontWeight:600,textAlign:"right"}}>Estoque</th>
          <th style={{padding:"8px 10px",fontWeight:600}}>Justificativa</th><th style={{padding:"8px 10px",fontWeight:600,textAlign:"center"}}>Decisão</th>
        </tr></thead>
        <tbody>{sol.itens.map(it=>{const cm=consumoMap[sol.cc+'|'+it.codigo];const est=estoqueMap[it.codigo];
          return <tr key={it.id} style={{borderTop:`1px solid ${C.line}`,background:"#fff"}}>
            <td style={{padding:"9px 10px"}}><div style={{display:"flex",alignItems:"center",gap:7}}>{cm&&<CurvaBadge c={cm.curva}/>}<div><div style={{fontFamily:"ui-monospace,monospace",fontSize:11,color:C.muted}}>{it.codigo}</div><div style={{fontWeight:500}}>{it.descricao}</div></div></div></td>
            <td style={{padding:"9px 6px",textAlign:"right",fontFamily:"ui-monospace,monospace",fontWeight:700}}>{fmt(it.quantidade)}</td>
            <td style={{padding:"9px 6px",textAlign:"right",fontFamily:"ui-monospace,monospace",color:cm?C.ink:C.muted}}>{cm?fmt(cm.consumo_medio):"—"}</td>
            <td style={{padding:"9px 6px",textAlign:"right",fontFamily:"ui-monospace,monospace",color:est===0?C.red:C.ink}}>{est===undefined?"—":fmt(est)}</td>
            <td style={{padding:"9px 10px",color:"#334155",maxWidth:240}}>{it.justificativa}</td>
            <td style={{padding:"9px 10px",textAlign:"center",whiteSpace:"nowrap"}}>
              <button onClick={()=>setItem(it.id,'aprovado')} style={{border:"none",borderRadius:6,padding:"5px 9px",marginRight:5,cursor:"pointer",fontSize:11.5,fontWeight:700,background:sit[it.id]==='aprovado'?C.green:"#e2e8f0",color:sit[it.id]==='aprovado'?"#fff":C.muted}}>Aprovar</button>
              <button onClick={()=>setItem(it.id,'recusado')} style={{border:"none",borderRadius:6,padding:"5px 9px",cursor:"pointer",fontSize:11.5,fontWeight:700,background:sit[it.id]==='recusado'?C.red:"#e2e8f0",color:sit[it.id]==='recusado'?"#fff":C.muted}}>Recusar</button>
            </td>
          </tr>;})}</tbody>
      </table>
      </div>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end",marginTop:14,borderTop:`1px solid ${C.line}`,paddingTop:14}}>
        <div style={{flex:"1 1 160px"}}><div style={{fontSize:11,fontWeight:600,color:C.muted,marginBottom:5}}>Nº da SC (após abrir no Protheus)</div>
          <input value={scNum} onChange={e=>setScNum(e.target.value)} placeholder="Ex.: 045873" style={{width:"100%",padding:"9px 11px",borderRadius:8,border:`1px solid ${C.line}`,fontSize:13,outline:"none"}}/></div>
        <div style={{flex:"3 1 240px"}}><div style={{fontSize:11,fontWeight:600,color:C.muted,marginBottom:5}}>Observação (opcional)</div>
          <input value={obs} onChange={e=>setObs(e.target.value)} placeholder="Anotação sobre a decisão" style={{width:"100%",padding:"9px 11px",borderRadius:8,border:`1px solid ${C.line}`,fontSize:13,outline:"none"}}/></div>
        <button onClick={salvar} disabled={salvando} style={{background:C.teal,color:"#fff",border:"none",borderRadius:8,padding:"10px 20px",fontWeight:700,fontSize:13.5,cursor:"pointer",display:"flex",alignItems:"center",gap:7,height:38}}>{salvando?<Ic.loader size={16} color="#fff"/>:<Ic.check size={16} color="#fff"/>} Salvar</button>
      </div>
    </div>}
  </div>;
}

/* ===================== ACOMPANHAMENTO ===================== */
function AcompCard({sol,ccMap,pcMap}){
  const [aberto,setAberto]=useState(false);const base=ccMap[sol.cc];
  return <div style={{background:"#fff",borderRadius:12,border:`1px solid ${C.line}`,overflow:"hidden"}}>
    <button onClick={()=>setAberto(v=>!v)} style={{width:"100%",border:"none",background:"none",cursor:"pointer",padding:16,textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontFamily:"ui-monospace,monospace",fontWeight:700,fontSize:14}}>SC {sol.sc_numero}</span><StatusPill s={sol.status}/></div>
        <div style={{fontSize:12,color:C.muted,marginTop:3}}>{base?base.nome:sol.cc} · {sol.cc} · {sol.itens.length} itens</div></div>
      {aberto?<Ic.down size={16} color={C.muted}/>:<Ic.right size={16} color={C.muted}/>}
    </button>
    {aberto&&<div style={{borderTop:`1px solid ${C.line}`,background:"#f8fafc"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
        <thead><tr style={{color:C.muted,textAlign:"left"}}><th style={{padding:"8px 14px",fontWeight:600}}>Item</th><th style={{padding:"8px 6px",fontWeight:600}}>Pedido (PC)</th><th style={{padding:"8px 6px",fontWeight:600,textAlign:"right"}}>Qtd</th><th style={{padding:"8px 6px",fontWeight:600,textAlign:"right"}}>Receb.</th><th style={{padding:"8px 14px",fontWeight:600}}>Status</th></tr></thead>
        <tbody>{sol.itens.map(it=>{const ps=pcMap[sol.sc_numero+'|'+it.codigo]||[];
          if(ps.length===0)return <tr key={it.id} style={{borderTop:`1px solid ${C.line}`}}><td style={{padding:"9px 14px"}}><div style={{fontWeight:500}}>{it.descricao}</div><div style={{fontFamily:"ui-monospace,monospace",fontSize:11,color:C.muted}}>{it.codigo}</div></td><td colSpan={4} style={{padding:"9px 6px",color:C.muted,fontStyle:"italic"}}>sem pedido ainda</td></tr>;
          return ps.map((p,k)=><tr key={it.id+'_'+k} style={{borderTop:`1px solid ${C.line}`}}>
            <td style={{padding:"9px 14px"}}>{k===0&&<><div style={{fontWeight:500}}>{it.descricao}</div><div style={{fontFamily:"ui-monospace,monospace",fontSize:11,color:C.muted}}>{it.codigo}</div></>}</td>
            <td style={{padding:"9px 6px",fontFamily:"ui-monospace,monospace"}}>{p.pc_num}</td>
            <td style={{padding:"9px 6px",textAlign:"right",fontFamily:"ui-monospace,monospace"}}>{fmt(p.qtd)}</td>
            <td style={{padding:"9px 6px",textAlign:"right",fontFamily:"ui-monospace,monospace"}}>{fmt(p.recebido)}</td>
            <td style={{padding:"9px 14px"}}><span style={{fontSize:11.5,fontWeight:600,color:/receb/i.test(p.status)?C.green:/pend|aprov/i.test(p.status)?C.amber:C.muted}}>{p.status||"—"}</span></td>
          </tr>);})}</tbody>
      </table>
    </div>}
  </div>;
}

/* ===================== BASES (cada uma atualiza sozinha) ===================== */
function BaseUpdater({titulo,desc,campos,acao,onConcluir}){
  const [files,setFiles]=useState({});const [log,setLog]=useState([]);const [rod,setRod]=useState(false);
  const add=m=>setLog(l=>[...l,m]);
  const pronto=campos.filter(c=>!c.opcional).every(c=>files[c.k])&&!rod;
  async function run(){setRod(true);setLog([]);
    try{await acao(files,add);add('✓ Concluído!');setTimeout(()=>{setRod(false);onConcluir();},800);}
    catch(e){add('✗ Erro: '+(e.message||e));setRod(false);}}
  return <div style={{background:"#fff",border:`1px solid ${C.line}`,borderRadius:14,padding:18,marginBottom:14}}>
    <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{titulo}</div>
    <div style={{fontSize:12.5,color:C.muted,marginBottom:14}}>{desc}</div>
    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
      {campos.map(c=><label key={c.k} style={{flex:"1 1 200px",border:`1px solid ${files[c.k]?C.teal:C.line}`,background:files[c.k]?C.teal+"0d":"#fff",borderRadius:10,padding:11,cursor:rod?"default":"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontWeight:600,fontSize:13}}>{c.label}{c.opcional?" (opcional)":""}</div><div style={{fontSize:11,color:C.muted}}>{c.sub}</div></div>{files[c.k]?<Ic.check size={16} color={C.teal}/>:<Ic.up size={16} color={C.muted}/>}</div>
        {files[c.k]&&<div style={{fontSize:11,color:C.teal,marginTop:6,fontWeight:600,wordBreak:"break-all"}}>{files[c.k].name}</div>}
        <input type="file" accept={c.a} disabled={rod} style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(f)setFiles(p=>({...p,[c.k]:f}));}}/>
      </label>)}
    </div>
    <button onClick={run} disabled={!pronto} style={{background:pronto?C.teal:C.line,color:"#fff",border:"none",borderRadius:8,padding:"10px 18px",fontWeight:700,fontSize:13.5,cursor:pronto?"pointer":"not-allowed",display:"flex",alignItems:"center",gap:8}}>{rod?<Ic.loader size={16} color="#fff"/>:<Ic.db size={16} color="#fff"/>} {rod?"Processando…":"Atualizar"}</button>
    {log.length>0&&<Log linhas={log}/>}
  </div>;
}

function Bases({sols,onConcluir}){
  const scNums=useMemo(()=>new Set(sols.map(s=>(s.sc_numero||"").trim()).filter(Boolean)),[sols]);
  return <div style={{maxWidth:820}}>
    <h2 style={{fontSize:16,marginTop:0,marginBottom:4}}>Bases de dados</h2>
    <p style={{color:C.muted,fontSize:13,marginTop:0,marginBottom:16}}>Tudo fica guardado no banco — você só sobe quando quiser atualizar. Cada base é independente, e o processamento roda em segundo plano (pode usar as outras abas enquanto roda).</p>

    <BaseUpdater titulo="Consumo médio e curva ABC" desc="Recalcula o consumo dos últimos 12 meses e a curva ABC por CC. Precisa da SCP e do SB1."
      campos={[{k:"scp",label:"SCP — Solicitações",sub:"CSV",a:".csv"},{k:"sb1",label:"SB1 — Itens",sub:"CSV",a:".csv"}]}
      acao={atualizarConsumo} onConcluir={onConcluir}/>

    <BaseUpdater titulo="Pessoas por base" desc="Conta os funcionários ativos por centro de custo (SRA). Não altera o resto do cadastro do CC."
      campos={[{k:"sra",label:"SRA — Funcionários",sub:"CSV",a:".csv"}]}
      acao={atualizarPessoas} onConcluir={onConcluir}/>

    <BaseUpdater titulo="Estoque" desc="Atualiza o saldo por item (SB2). Use quando tiver o arquivo de estoque."
      campos={[{k:"sb2",label:"SB2 — Estoque",sub:"CSV",a:".csv"}]}
      acao={atualizarEstoque} onConcluir={onConcluir}/>

    <BaseUpdater titulo="Centros de custo" desc="Atualiza nome/estado/macro das bases (sem mexer na contagem de pessoas). Só use se mudou o cadastro de CC."
      campos={[{k:"cc",label:"Centro de Custo",sub:"Excel (.xlsx)",a:".xlsx,.xls"}]}
      acao={atualizarCC} onConcluir={onConcluir}/>

    <BaseUpdater titulo="Pedidos de compra — SC7 (diário)" desc={scNums.size>0?`Atualiza o status dos pedidos das ${scNums.size} SC(s) associada(s).`:"Associe o nº de uma SC numa solicitação aprovada antes de subir a SC7."}
      campos={[{k:"sc7",label:"SC7 — Pedidos de compra",sub:"CSV",a:".csv"}]}
      acao={(f,add)=>{if(scNums.size===0)throw new Error("Nenhuma SC associada ainda.");return atualizarSC7(f,scNums,add);}} onConcluir={onConcluir}/>
  </div>;
}
function Log({linhas}){return <div style={{marginTop:14,background:C.ink,color:"#cbd5e1",borderRadius:10,padding:14,fontFamily:"ui-monospace,monospace",fontSize:12.5,lineHeight:1.7,maxHeight:280,overflow:"auto",whiteSpace:"pre-wrap"}}>{linhas.map((l,i)=><div key={i} style={{color:l.startsWith("✓")?"#34d399":l.startsWith("✗")?"#fb7185":"#cbd5e1"}}>{l}</div>)}</div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
