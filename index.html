<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Teste — Passo 1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#0f172a;display:grid;place-items:center;min-height:100vh;padding:20px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:28px;width:100%;max-width:380px}
  h1{font-size:17px;margin:0 0 4px}
  p{color:#64748b;font-size:13px;margin:0 0 20px;line-height:1.5}
  label{font-size:12px;font-weight:600;color:#64748b;display:block;margin:12px 0 5px}
  input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e2e8f0;font-size:14px;box-sizing:border-box;outline:none}
  button{width:100%;margin-top:16px;padding:11px;border-radius:8px;border:none;background:#0d9488;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  button:disabled{background:#e2e8f0;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;line-height:1.5}
  .ok{background:#d1fae5;color:#065f46}
  .erro{background:#fee2e2;color:#991b1b}
  .linha{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
  table{width:100%;margin-top:10px;border-collapse:collapse}
</style>
</head>
<body>
<div class="card">
  <h1>Passo 1 — Teste de conexão</h1>
  <p>Sem React, sem Babel. Só testa login e leitura do banco.</p>

  <div id="login-area">
    <label>E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com"/>
    <label>Senha</label>
    <input id="senha" type="password" placeholder="senha"/>
    <button id="btn-entrar">Entrar</button>
  </div>

  <div id="resultado"></div>
</div>

<script>
  // ===== credenciais do projeto painel-protheus =====
  const SUPABASE_URL = "https://vvwtqbehfwrgcmbjdniu.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d3RxYmVoZndyZ2NtYmpkbml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjg3NTcsImV4cCI6MjA5NzEwNDc1N30.jHxva16Nae109RiWDlgl21saOJ6gBihstMmlKRRBXis";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);

  function mostrarMsg(texto, tipo) {
    const div = document.createElement("div");
    div.className = "msg " + tipo;
    div.textContent = texto;
    $("resultado").appendChild(div);
  }

  $("btn-entrar").addEventListener("click", async () => {
    $("resultado").innerHTML = "";
    const email = $("email").value.trim();
    const senha = $("senha").value;
    if (!email || !senha) { mostrarMsg("Preencha e-mail e senha.", "erro"); return; }

    $("btn-entrar").disabled = true;
    $("btn-entrar").textContent = "Entrando...";

    // 1) tenta logar
    const { data: loginData, error: loginErro } = await db.auth.signInWithPassword({ email, password: senha });

    if (loginErro) {
      mostrarMsg("Login falhou: " + loginErro.message, "erro");
      $("btn-entrar").disabled = false;
      $("btn-entrar").textContent = "Entrar";
      return;
    }

    mostrarMsg("✓ Login funcionou! Usuário: " + loginData.user.email, "ok");

    // 2) tenta ler a tabela centros_custo (testa RLS + leitura)
    const { data: ccs, error: leituraErro } = await db.from("centros_custo").select("*").limit(10);

    if (leituraErro) {
      mostrarMsg("✗ Leitura falhou: " + leituraErro.message, "erro");
    } else {
      mostrarMsg("✓ Leitura funcionou! " + ccs.length + " centro(s) de custo encontrado(s).", "ok");
      if (ccs.length > 0) {
        const tabela = document.createElement("table");
        tabela.innerHTML = "<tr><th style='text-align:left;font-size:12px;color:#64748b'>CC</th><th style='text-align:left;font-size:12px;color:#64748b'>Nome</th><th style='text-align:right;font-size:12px;color:#64748b'>Pessoas</th></tr>" +
          ccs.map(c => `<tr><td style='font-size:13px;padding:4px 0'>${c.cc}</td><td style='font-size:13px'>${c.nome||""}</td><td style='font-size:13px;text-align:right'>${c.pessoas||0}</td></tr>`).join("");
        $("resultado").appendChild(tabela);
      }
    }

    $("btn-entrar").disabled = false;
    $("btn-entrar").textContent = "Entrar";
  });

  // Enter no campo de senha também envia
  $("senha").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-entrar").click(); });
</script>
</body>
</html>
