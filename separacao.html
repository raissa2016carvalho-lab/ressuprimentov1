<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Separação</title>
<script src="vendor/supabase-2.118.0.js"></script>
<link rel="stylesheet" href="/padrao.css"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--bq-fonte);background:var(--bq-fundo);color:var(--bq-texto);min-height:100vh}
body.bq-trancado>*:not(#tela-login){display:none!important}
.lg-lbl{display:block;color:#64748b;font-size:12px;font-weight:600;margin:0 0 5px}
.lg-inp{width:100%;border:1px solid #e2e8f0;border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:14px;font-family:inherit;outline:none}
.lg-inp:focus{border-color:#1e40af}
.topo-dir{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:#94a3b8}
.btn{background:#fff;color:#475569;border:1px solid #e2e8f0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:#1e40af;color:#1e40af}
.btn.azul{background:#1e40af;color:#fff;border-color:#1e40af}.btn.azul:hover{background:#1d3a9e;color:#fff}
.btn.verde{background:#16a34a;color:#fff;border-color:#16a34a}.btn.verde:hover{background:#15803d;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sair{background:transparent;border:1px solid #334155;color:#cbd5e1;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.corpo{max-width:1100px;margin:0 auto;padding:20px 24px 40px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:#64748b;cursor:pointer;font-family:inherit}
.chip.ativo{background:#1e40af;border-color:#1e40af;color:#fff}
.busca{flex:1;min-width:200px;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.grupo-tit{font-size:11.5px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.mob{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center;cursor:pointer}
.mob:hover{border-color:#1e40af}
.mob .nome{font-weight:700;font-size:14px}
.mob .sub{font-size:12px;color:#64748b;margin-top:3px}
.barra{height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden;width:140px;margin-top:6px}
.barra i{display:block;height:100%;background:#16a34a}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.p-pendente{background:#fef3c7;color:#92400e}.p-em_separacao{background:#dbeafe;color:#1e40af}.p-concluida{background:#dcfce7;color:#166534}
.vazio{text-align:center;color:#64748b;padding:40px;background:#fff;border:1px dashed #e2e8f0;border-radius:12px;font-size:13.5px}
.cab{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px;margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cab h2{font-size:17px}
.resumo{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.resumo div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 12px;font-size:12px;color:#64748b;text-align:center}
.resumo b{display:block;font-size:17px;color:#0f172a}
.item{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:minmax(200px,1.6fr) 90px 170px 110px minmax(140px,1fr);gap:12px;align-items:center}
.item.tem{border-left:4px solid #16a34a}.item.naotem{border-left:4px solid #dc2626;background:#fffafa}
.item .desc{font-weight:600;font-size:13px}.item .cod{font-family:ui-monospace,monospace;font-size:11px;color:#94a3b8;margin-top:2px}
.item .lbl{font-size:10.5px;color:#94a3b8;font-weight:600;display:block;margin-bottom:3px}
.item .sol{font-family:ui-monospace,monospace;font-weight:700;font-size:15px}
.tn{display:flex;gap:4px}
.tn button{flex:1;border:1px solid #e2e8f0;background:#fff;border-radius:7px;padding:7px 6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:#64748b}
.tn button.on-tem{background:#16a34a;border-color:#16a34a;color:#fff}
.tn button.on-nao{background:#dc2626;border-color:#dc2626;color:#fff}
.inp{width:100%;border:1px solid #e2e8f0;border-radius:7px;padding:7px 8px;font-size:13px;font-family:inherit;outline:none;background:#fff}
.inp:focus{border-color:#1e40af}.inp.num{text-align:right;font-family:ui-monospace,monospace;font-weight:700}
.inp:disabled{background:#f8fafc;color:#94a3b8}
.extra{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.salvo{font-size:10.5px;color:#16a34a;height:12px}
.rodape{position:sticky;bottom:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 -4px 16px #0f172a0d}
.aviso{background:#fef3c7;color:#92400e;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.abas{display:flex;gap:4px;border-bottom:1px solid #e2e8f0;margin-bottom:14px}
.abas button{border:none;background:none;padding:9px 14px;font-size:13.5px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}
.abas button.on{color:#1e40af;border-bottom-color:#1e40af}
.ritem{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:minmax(200px,1.6fr) 90px 230px 110px;gap:12px;align-items:center}
.ritem.feito{border-left:4px solid #0e7490}.ritem.zero{border-left:4px solid #dc2626;background:#fffafa}
.ritem .desc{font-weight:600;font-size:13px}.ritem .cod{font-family:ui-monospace,monospace;font-size:11px;color:#94a3b8;margin-top:2px}
.ritem .lbl{font-size:10.5px;color:#94a3b8;font-weight:600;display:block;margin-bottom:3px}
.ritem .big{font-family:ui-monospace,monospace;font-weight:700;font-size:15px}
.rq{display:flex;gap:4px;align-items:center}.rq .inp{width:80px}
.rq button{border:1px solid #e2e8f0;background:#fff;border-radius:7px;padding:6px 8px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;color:#64748b;white-space:nowrap}
.rq button:hover{border-color:#1e40af;color:#1e40af}
@media(max-width:800px){.ritem{grid-template-columns:1fr 1fr}.ritem>div:first-child{grid-column:1/-1}}
.ok{background:#dcfce7;color:#166534;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media(max-width:800px){.corpo{padding:14px 16px 40px}.item{grid-template-columns:1fr 1fr}.item>div:first-child{grid-column:1/-1}.extra{grid-template-columns:1fr}.resumo{margin-left:0}.mob{flex-wrap:wrap}}
</style>
<body class="bq-trancado">

<div id="tela-login" class="bq-login-fundo" style="display:none;min-height:100vh;padding:20px">
  <div class="login-card" style="background:#fff;border-radius:14px;width:100%;max-width:360px;padding:32px">
    <span class="bq-login-logo" role="img" aria-label="B&amp;Q"></span>
    <h1 style="margin:0 0 4px;font-size:16px">Separação</h1>
    <p style="color:#64748b;margin:0 0 18px;font-size:12.5px">Entre com o mesmo e-mail e senha do Painel principal</p>
    <label class="lg-lbl">E-mail</label><input id="lg-email" type="email" class="lg-inp" autocomplete="email">
    <label class="lg-lbl">Senha</label><input id="lg-senha" type="password" class="lg-inp" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <div id="lg-msg" style="color:#991b1b;background:#fee2e2;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:12px;display:none"></div>
    <button id="lg-btn" onclick="entrar()" style="width:100%;background:#1e40af;color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Entrar</button>
    <a class="bq-login-voltar" href="/los.html">← Voltar ao menu de sistemas</a>
  </div>
</div>

<div class="bq-topo">
  <a class="bq-marca" href="/los.html" title="Voltar ao menu">B<b>&amp;</b>Q</a>
  <div><h1>Separação</h1><div class="bq-sub">Conferir o estoque e separar o material das mobilizações e dos ressuprimentos</div></div>
  <div class="topo-dir"><span id="user-email"></span><button class="btn-sair" onclick="sair()">Sair</button></div>
</div>

<div class="corpo" id="corpo"></div>

<script>
const db=window.supabase.createClient('https://eugefrjckrxisfpizkjb.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Z2Vmcmpja3J4aXNmcGl6a2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzEzNjksImV4cCI6MjEwNDAwNzM2OX0.sNQjKjlUm1TWeiDGG2SDeER7GGaf4PucofJWNKxqygI');
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN=v=>(Math.round((Number(v)||0)*100)/100).toLocaleString('pt-BR');
const fmtDH=iso=>iso?new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const STATUS={pendente:'Pendente',em_separacao:'Em separação',concluida:'Concluída'};
let userEmail='',isAdmin=false,FILTRO='abertas',MOBS=[],ATUAL=null;
// modo da tela: mobilizações ou ressuprimento (solicitações em aberto)
let MODO=(()=>{let q=new URLSearchParams(location.search);return q.get('ressup')||q.get('modo')==='ressup'?'ressup':'mob'})();
let RESS=[],ATUAL_R=null,FILTRO_R='todas';
// Item já conferido? Estoque lançado antes desta tela (quantidade > 0, sem marcação) conta como "Tem"
const dispo=r=>!r?null:r.disponivel!=null?r.disponivel:(Number(r.qtd_estoque)>0?true:null);

// lê a tabela inteira de 1000 em 1000 (o Supabase devolve no máximo 1000 por vez)
async function todas(tab,cols){let out=[];for(let o=0;;o+=1000){let{data,error}=await db.from(tab).select(cols).order('id').range(o,o+999);if(error||!data||!data.length)break;out=out.concat(data);if(data.length<1000)break}return out}
// ── Lista de mobilizações ──────────────────────────────────────────────────
function abasHtml(){return `<div class="abas"><button class="${MODO==='mob'?'on':''}" onclick="irModo('mob')">🦺 Mobilizações</button><button class="${MODO==='ressup'?'on':''}" onclick="irModo('ressup')">📦 Ressuprimento</button></div>`}
function irModo(m){MODO=m;carregarLista()}
async function carregarLista(){
  if(MODO==='ressup')return carregarRessup();
  $('corpo').innerHTML=abasHtml()+'<div class="vazio">Carregando mobilizações...</div>';
  let[{data:mobs,error},itens,est]=await Promise.all([
    db.from('mobilizacoes').select('*').order('criado_em',{ascending:false}),
    todas('mobilizacao_itens','mobilizacao_id,codigo,excluido'),
    todas('mobilizacao_estoque','mobilizacao_id,codigo,disponivel,qtd_estoque')
  ]);
  if(error){$('corpo').innerHTML='<div class="vazio">Não consegui carregar: '+esc(error.message)+'</div>';return}
  let nItens={},nConf={};
  (itens||[]).forEach(i=>{if(i.codigo==null||i.excluido)return;(nItens[i.mobilizacao_id]=nItens[i.mobilizacao_id]||new Set()).add(String(i.codigo))});
  (est||[]).forEach(e=>{if(dispo(e)!=null)(nConf[e.mobilizacao_id]=nConf[e.mobilizacao_id]||new Set()).add(String(e.codigo))});
  MOBS=(mobs||[]).filter(m=>!String(m.grupo||'').toUpperCase().startsWith('OCULTO')).map(m=>{
    let tot=nItens[m.id]?nItens[m.id].size:0,conf=nConf[m.id]?[...nConf[m.id]].filter(c=>nItens[m.id]&&nItens[m.id].has(c)).length:0;
    return {...m,_tot:tot,_conf:conf,_st:m.sep_status||'pendente'}});
  desenharLista();
}
function desenharLista(){
  ATUAL=null;history.replaceState(null,'',location.pathname);
  let q=($('busca')?.value||'').toLowerCase().trim();
  let lista=MOBS.filter(m=>FILTRO==='todas'||(FILTRO==='concluidas'?m._st==='concluida':m._st!=='concluida'))
    .filter(m=>!q||(m.nome||'').toLowerCase().includes(q)||(m.grupo||'').toLowerCase().includes(q));
  let chips=[['abertas','Para separar'],['concluidas','Concluídas'],['todas','Todas']].map(([k,t])=>
    `<button class="chip${FILTRO===k?' ativo':''}" onclick="FILTRO='${k}';desenharLista()">${t} (${MOBS.filter(m=>k==='todas'||(k==='concluidas'?m._st==='concluida':m._st!=='concluida')).length})</button>`).join('');
  let grupos={};lista.forEach(m=>{(grupos[m.grupo||'Sem grupo']=grupos[m.grupo||'Sem grupo']||[]).push(m)});
  let html=Object.keys(grupos).sort((a,b)=>a==='Sem grupo'?1:b==='Sem grupo'?-1:a.localeCompare(b)).map(g=>'<div class="grupo-tit">'+esc(g)+'</div>'+grupos[g].map(m=>{
    let pct=m._tot?Math.round(m._conf/m._tot*100):0;
    return `<div class="mob" onclick="abrir(${m.id})">
      <div style="flex:1;min-width:0"><div class="nome">${esc(m.nome)} <span class="pill p-${m._st}">${STATUS[m._st]||m._st}</span></div>
        <div class="sub">${m.num_equipes?m.num_equipes+' equipe(s) · ':''}${m._tot} item(ns) · criada em ${fmtDH(m.criado_em)}${m._st==='concluida'&&m.sep_operador?' · separada por '+esc(m.sep_operador)+' em '+fmtDH(m.sep_concluida_em):''}</div></div>
      <div style="text-align:right"><div style="font-size:12px;color:#64748b">${m._conf}/${m._tot} conferidos</div><div class="barra"><i style="width:${pct}%"></i></div></div>
      <span style="color:#1e40af;font-weight:700">→</span></div>`}).join('')).join('');
  $('corpo').innerHTML=abasHtml()+`<div class="filtros">${chips}<input class="busca" id="busca" placeholder="Buscar mobilização ou grupo..." value="${esc(q)}" oninput="desenharLista();this.focus();this.setSelectionRange(this.value.length,this.value.length)"></div>`+
    (html||'<div class="vazio">Nenhuma mobilização '+(FILTRO==='concluidas'?'concluída':'para separar')+'.</div>');
}

// ── Separação de uma mobilização ───────────────────────────────────────────
async function abrir(id){
  $('corpo').innerHTML='<div class="vazio">Carregando itens...</div>';
  history.replaceState(null,'','?id='+id);
  let[{data:mob},{data:itens},{data:est}]=await Promise.all([
    db.from('mobilizacoes').select('*').eq('id',id).maybeSingle(),
    db.from('mobilizacao_itens').select('*').eq('mobilizacao_id',id),
    db.from('mobilizacao_estoque').select('*').eq('mobilizacao_id',id)
  ]);
  if(!mob){$('corpo').innerHTML='<div class="vazio">Mobilização não encontrada. <a href="#" onclick="carregarLista();return false">Voltar</a></div>';return}
  // mesmo agrupamento do card: um item por código, somando as funções
  itens=(itens||[]).filter(i=>!i.excluido);let por={};itens.forEach(i=>{if(i.codigo==null)return;let k=String(i.codigo);por[k]=por[k]||{codigo:k,descricao:i.descricao,sol:0};por[k].sol+=Number(i.total_mob)||0});
  let semCod=(itens||[]).filter(i=>i.codigo==null).length;
  let e={};(est||[]).forEach(r=>{e[String(r.codigo)]=r});
  ATUAL={mob,itens:Object.values(por).sort((a,b)=>(a.descricao||'').localeCompare(b.descricao||'')),est:e,semCod};
  desenharSeparacao();
}
function travada(){return ATUAL.mob.sep_status==='concluida'}
function desenharSeparacao(){
  let {mob,itens,est,semCod}=ATUAL,trav=travada(),dis=trav?' disabled':'';
  let conf=itens.filter(i=>dispo(est[i.codigo])!=null).length,
      tem=itens.filter(i=>dispo(est[i.codigo])===true).length,
      nao=itens.filter(i=>dispo(est[i.codigo])===false).length;
  let linhas=itens.map(i=>{let r=est[i.codigo]||{},d=dispo(r),c=esc(i.codigo);
    return `<div class="item ${d===true?'tem':d===false?'naotem':''}" id="it-${c}">
      <div><div class="desc">${esc(i.descricao)}</div><div class="cod">${c}${r.disponivel==null&&d===true?' · <span style="color:#16a34a;font-family:var(--bq-fonte)">já lançado no card</span>':''}</div></div>
      <div><span class="lbl">Solicitado</span><span class="sol">${fmtN(i.sol)}</span></div>
      <div><span class="lbl">Tem no estoque?</span><div class="tn"><button class="${d===true?'on-tem':''}" onclick="marcar('${c}',true)"${dis}>✓ Tem</button><button class="${d===false?'on-nao':''}" onclick="marcar('${c}',false)"${dis}>✕ Não tem</button></div></div>
      <div><span class="lbl">Qtd separada</span><input class="inp num" type="number" min="0" step="1" id="q-${c}" value="${r.qtd_estoque!=null?r.qtd_estoque:''}" placeholder="0" onchange="salvarItem('${c}')"${trav||d===false?' disabled':''}><div class="salvo" id="ok-${c}"></div></div>
      <div><span class="lbl">Patrimônios (separe por vírgula)</span><input class="inp" id="p-${c}" value="${esc(r.patrimonios||'')}" placeholder="Ex.: 12345, 12346" onchange="salvarItem('${c}')"${dis}></div>
      ${r.observacao||!trav?`<div class="extra"><div><input class="inp" id="o-${c}" value="${esc(r.observacao||'')}" placeholder="Observação do item (opcional)" onchange="salvarItem('${c}')"${dis}></div><div style="font-size:11px;color:#94a3b8;align-self:center">${r.separado_por?'Último registro: '+esc(r.separado_por)+' · '+fmtDH(r.separado_em):''}</div></div>`:''}
    </div>`}).join('');
  $('corpo').innerHTML=`
    <button class="btn" onclick="carregarLista()" style="margin-bottom:12px">← Voltar às mobilizações</button>
    <div class="cab"><div><h2>${esc(mob.nome)} <span class="pill p-${mob.sep_status||'pendente'}">${STATUS[mob.sep_status||'pendente']}</span></h2>
      <div style="font-size:12.5px;color:#64748b;margin-top:4px">${mob.grupo?esc(mob.grupo)+' · ':''}${mob.num_equipes?mob.num_equipes+' equipe(s) · ':''}${itens.length} item(ns)</div></div>
      <div class="resumo"><div><b>${conf}/${itens.length}</b>conferidos</div><div><b style="color:#16a34a">${tem}</b>tem</div><div><b style="color:#dc2626">${nao}</b>não tem</div></div></div>
    ${trav?`<div class="ok">✓ Separação concluída por <b>${esc(mob.sep_operador||'')}</b> em ${fmtDH(mob.sep_concluida_em)}. As quantidades já estão na coluna Estoque do card da mobilização.</div>`:''}
    ${semCod?`<div class="aviso">${semCod} item(ns) desta mobilização estão sem código e não aparecem aqui.</div>`:''}
    ${linhas||'<div class="vazio">Esta mobilização não tem itens com código.</div>'}
    <div class="rodape">
      <div style="font-size:12.5px;color:#64748b;flex:1;min-width:200px" id="msg-rodape">${trav?'':'Tudo é salvo automaticamente. Ao terminar de conferir todos os itens, conclua a separação.'}</div>
      ${trav?(isAdmin?'<button class="btn" onclick="reabrir()">↺ Reabrir separação</button>':''):`<button class="btn verde" onclick="concluir()"${conf<itens.length||!itens.length?' disabled title="Confira todos os itens primeiro"':''}>✓ Concluir separação</button>`}
    </div>`;
}
async function marcarEmSeparacao(){
  if(ATUAL.mob.sep_status&&ATUAL.mob.sep_status!=='pendente')return;
  let{error}=await db.from('mobilizacoes').update({sep_status:'em_separacao'}).eq('id',ATUAL.mob.id);
  if(!error)ATUAL.mob.sep_status='em_separacao';
}
async function gravar(cod,campos){
  let reg=Object.assign({mobilizacao_id:Number(ATUAL.mob.id),codigo:Number(cod),separado_por:userEmail,separado_em:new Date().toISOString()},campos);
  let{data,error}=await db.from('mobilizacao_estoque').upsert(reg,{onConflict:'mobilizacao_id,codigo'}).select().maybeSingle();
  if(error){alert('Não consegui salvar: '+error.message);return false}
  ATUAL.est[cod]=Object.assign(ATUAL.est[cod]||{},data||reg);
  await marcarEmSeparacao();
  return true;
}
async function marcar(cod,tem){
  if(travada())return;
  let it=ATUAL.itens.find(i=>i.codigo===cod),atual=ATUAL.est[cod]||{};
  let qtd=tem?(dispo(atual)===true&&atual.qtd_estoque!=null?atual.qtd_estoque:Math.round(it.sol)):0;
  if(await gravar(cod,{disponivel:tem,qtd_estoque:qtd}))desenharSeparacao();
}
async function salvarItem(cod){
  if(travada())return;
  let atual=ATUAL.est[cod]||{},q=$('q-'+cod).value,campos={
    qtd_estoque:q===''?null:Math.max(0,Math.round(Number(q)||0)),
    patrimonios:$('p-'+cod).value.trim()||null,
    observacao:($('o-'+cod)?$('o-'+cod).value.trim():atual.observacao)||null};
  // digitar a quantidade já conta como "tem" (se ainda não foi conferido)
  if(dispo(atual)==null&&campos.qtd_estoque>0)campos.disponivel=true;
  if(await gravar(cod,campos)){
    if(campos.disponivel===true&&dispo(atual)==null){desenharSeparacao();return}
    let ok=$('ok-'+cod);if(ok){ok.textContent='✓ salvo';setTimeout(()=>{ok.textContent=''},1500)}
  }
}
async function concluir(){
  let falta=ATUAL.itens.filter(i=>dispo(ATUAL.est[i.codigo])==null);
  if(falta.length){alert('Faltam '+falta.length+' item(ns) para conferir.');return}
  let semQtd=ATUAL.itens.filter(i=>dispo(ATUAL.est[i.codigo])===true&&!(Number(ATUAL.est[i.codigo].qtd_estoque)>0));
  if(semQtd.length&&!confirm(semQtd.length+' item(ns) marcados como "Tem" estão com quantidade 0. Concluir mesmo assim?'))return;
  if(!confirm('Concluir a separação de "'+ATUAL.mob.nome+'"? Depois disso ela fica travada.'))return;
  let upd={sep_status:'concluida',sep_operador:userEmail,sep_concluida_em:new Date().toISOString()};
  let{error}=await db.from('mobilizacoes').update(upd).eq('id',ATUAL.mob.id);
  if(error){alert('Não consegui concluir: '+error.message);return}
  Object.assign(ATUAL.mob,upd);desenharSeparacao();window.scrollTo({top:0});
}
async function reabrir(){
  if(!isAdmin||!confirm('Reabrir a separação para edição?'))return;
  let upd={sep_status:'em_separacao',sep_operador:null,sep_concluida_em:null};
  let{error}=await db.from('mobilizacoes').update(upd).eq('id',ATUAL.mob.id);
  if(error){alert('Não consegui reabrir: '+error.message);return}
  Object.assign(ATUAL.mob,upd);desenharSeparacao();
}

// ── Ressuprimento: solicitações em aberto (as mesmas que aparecem no Painel) ─────────────
// A equipe informa quanto sai do estoque central; isso vai para solicitacao_itens.qtd_estoque_central
// e desconta da quantidade do Almoxarifado Matriz (o que fica para a SC).
const FILIAIS={'01':['CE','MATRIZ'],'03':['RN','PAU DOS FERROS'],'04':['CE','ITAPIPOCA'],'06':['RN','CURRAIS NOVOS'],'07':['CE','SOBRAL'],'08':['GO','APARECIDA DE GOIANIA'],'09':['CE','MARACANAU'],'10':['RN','MOSSORO'],'11':['GO','ANAPOLIS'],'13':['BA','ALAGOINHAS'],'14':['BA','RIBEIRA DO POMBAL'],'15':['BA','PAULO AFONSO'],'22':['GO','GOIANIA'],'23':['CE','BATURITE'],'24':['GO','MORRINHOS'],'25':['CE','CASCAVEL'],'27':['CE','CAUCAIA'],'29':['CE','HORIZONTE'],'34':['BA','SENHOR DO BONFIM'],'36':['GO','LUZIANIA'],'37':['MG','DIVINOPOLIS'],'39':['SP','SÃO PAULO'],'40':['PE','GARANHUNS'],'41':['PI','FLORIANO'],'42':['BA','LIVRAMENTO DE NOSSA SENHORA'],'43':['SP','HORTOLANDIA'],'44':['BA','BRUMADO'],'45':['RJ','NITEROI']};
// mesma ordem de atendimento da tela Estoque central
const GRUPOS_R=[
  {nome:'1º · Ceará — Metrôs e Obras Atlântico/Norte',cc:['141080101','141080103','141080104','141080105','141080102','141060102','141060101']},
  {nome:'2º · Rio Grande do Norte — TEC Oeste e Alto Oeste',cc:['145040101','145030102']},
  {nome:'3º · Bahia',uf:['BA']},
  {nome:'4º · Demais bases do Ceará e RN',uf:['CE','RN']},
  {nome:'Outros estados',uf:null}];
const ufDe=f=>(FILIAIS[String(f||'').trim()]||['?'])[0];
const nomeFil=f=>{f=String(f||'').trim();return f+(FILIAIS[f]?' — '+FILIAIS[f][1]:'')};
function grupoR(s){let cc=String(s.cc||'').trim(),u=ufDe(s.filial);for(let i=0;i<GRUPOS_R.length-1;i++){let g=GRUPOS_R[i];if((g.cc&&g.cc.includes(cc))||(g.uf&&g.uf.includes(u)))return i}return GRUPOS_R.length-1}
const precisa=i=>(Number(i.quantidade)||0)+(Number(i.qtd_estoque_central)||0);   // o que o Almoxarifado Matriz liberou
const doCentral=i=>Number(i.qtd_estoque_central)||0;

async function carregarRessup(){
  $('corpo').innerHTML=abasHtml()+'<div class="vazio">Carregando solicitações...</div>';
  history.replaceState(null,'','?modo=ressup');
  let[{data:sols,error},{data:ccs}]=await Promise.all([
    db.from('solicitacoes').select('id,cc,filial,status,criado_em,solicitante_nome').in('status',['pendente','aguardando_master']).order('criado_em'),
    db.from('centros_custo').select('cc,nome')]);
  if(error){$('corpo').innerHTML=abasHtml()+'<div class="vazio">Não consegui carregar: '+esc(error.message)+'</div>';return}
  let nomeCC={};(ccs||[]).forEach(c=>nomeCC[String(c.cc).trim()]=String(c.nome||'').replace(/\s+/g,' ').trim());
  let ids=(sols||[]).map(s=>s.id),itens=[];
  for(let i=0;i<ids.length;i+=100){for(let o=0;;o+=1000){let{data}=await db.from('solicitacao_itens').select('solicitacao_id,quantidade,qtd_estoque_central,situacao').in('solicitacao_id',ids.slice(i,i+100)).order('id').range(o,o+999);itens=itens.concat(data||[]);if(!data||data.length<1000)break}}
  let por={};itens.forEach(i=>{if(i.situacao==='recusado'||precisa(i)<=0)return;let o=por[i.solicitacao_id]=por[i.solicitacao_id]||{n:0,c:0,un:0};o.n++;if(doCentral(i)>0){o.c++;o.un+=doCentral(i)}});
  RESS=(sols||[]).filter(s=>por[s.id]).map(s=>({...s,_base:nomeCC[String(s.cc||'').trim()]||s.cc,_g:grupoR(s),_n:por[s.id].n,_c:por[s.id].c,_un:por[s.id].un}));
  desenharListaRessup();
}
function desenharListaRessup(){
  ATUAL_R=null;
  let q=($('busca-r')?.value||'').toLowerCase().trim();
  let lista=RESS.filter(s=>FILTRO_R==='todas'||(FILTRO_R==='com'?s._c>0:s._c===0))
    .filter(s=>!q||(s._base||'').toLowerCase().includes(q)||nomeFil(s.filial).toLowerCase().includes(q)||String(s.id).includes(q));
  let chips=[['todas','Todas'],['sem','Sem estoque central'],['com','Com estoque central']].map(([k,t])=>
    `<button class="chip${FILTRO_R===k?' ativo':''}" onclick="FILTRO_R='${k}';desenharListaRessup()">${t} (${RESS.filter(s=>k==='todas'||(k==='com'?s._c>0:s._c===0)).length})</button>`).join('');
  let html=GRUPOS_R.map((g,gi)=>{let ls=lista.filter(s=>s._g===gi);if(!ls.length)return '';
    return '<div class="grupo-tit">'+esc(g.nome)+'</div>'+ls.map(s=>{let pct=s._n?Math.round(s._c/s._n*100):0;
      return `<div class="mob" onclick="abrirRessup(${s.id})">
        <div style="flex:1;min-width:0"><div class="nome">${esc(s._base)} <span style="color:#94a3b8;font-weight:500;font-size:12px">#${s.id}</span></div>
          <div class="sub">${esc(nomeFil(s.filial))} · ${s._n} item(ns) · enviada em ${fmtDH(s.criado_em)}${s.solicitante_nome?' · '+esc(s.solicitante_nome):''}</div></div>
        <div style="text-align:right"><div style="font-size:12px;color:#64748b">${s._c}/${s._n} com estoque central${s._un?' · '+fmtN(s._un)+' un.':''}</div><div class="barra"><i style="width:${pct}%;background:#0e7490"></i></div></div>
        <span style="color:#1e40af;font-weight:700">→</span></div>`}).join('')}).join('');
  $('corpo').innerHTML=abasHtml()+`<div class="filtros">${chips}<input class="busca" id="busca-r" placeholder="Buscar base, filial ou nº da solicitação..." value="${esc(q)}" oninput="desenharListaRessup();this.focus();this.setSelectionRange(this.value.length,this.value.length)"></div>`+
    (html||'<div class="vazio">Nenhuma solicitação em aberto.</div>');
}
async function abrirRessup(id){
  $('corpo').innerHTML='<div class="vazio">Carregando itens...</div>';
  history.replaceState(null,'','?ressup='+id);
  let[{data:sol},{data:itens}]=await Promise.all([
    db.from('solicitacoes').select('id,cc,filial,status,criado_em,solicitante_nome').eq('id',id).maybeSingle(),
    db.from('solicitacao_itens').select('id,codigo,descricao,quantidade,qtd_estoque_central,situacao').eq('solicitacao_id',id).order('id')]);
  if(!sol){$('corpo').innerHTML='<div class="vazio">Solicitação não encontrada. <a href="#" onclick="irModo(\'ressup\');return false">Voltar</a></div>';return}
  let base=(RESS.find(s=>s.id===sol.id)||{})._base;
  if(!base){let{data:c}=await db.from('centros_custo').select('nome').eq('cc',sol.cc).maybeSingle();base=c&&c.nome||sol.cc}
  ATUAL_R={sol,base,aberta:sol.status==='pendente'||sol.status==='aguardando_master',
    itens:(itens||[]).filter(i=>i.situacao!=='recusado'&&precisa(i)>0).sort((a,b)=>(a.descricao||'').localeCompare(b.descricao||''))};
  desenharRessup();
}
function desenharRessup(){
  let {sol,base,itens,aberta}=ATUAL_R,dis=aberta?'':' disabled';
  let com=itens.filter(i=>doCentral(i)>0).length,un=itens.reduce((t,i)=>t+doCentral(i),0),
      fica=itens.reduce((t,i)=>t+(Number(i.quantidade)||0),0);
  let linhas=itens.map(i=>{let c=doCentral(i),p=precisa(i);
    return `<div class="ritem ${c>0?'feito':''}" id="ri-${i.id}">
      <div><div class="desc">${esc(i.descricao)}</div><div class="cod">${esc(i.codigo||'')}</div></div>
      <div><span class="lbl">Liberado</span><span class="big">${fmtN(p)}</span></div>
      <div><span class="lbl">Sai do estoque central</span><div class="rq">
        <input class="inp num" type="number" min="0" max="${p}" step="1" id="rq-${i.id}" value="${c||''}" placeholder="0" onchange="salvarRessup(${i.id},this.value)"${dis}>
        <button onclick="salvarRessup(${i.id},${p})" title="O estoque atende tudo"${dis}>Tudo</button>
        <button onclick="salvarRessup(${i.id},0)" title="Não tem no estoque central"${dis}>Não tem</button></div><div class="salvo" id="rok-${i.id}"></div></div>
      <div><span class="lbl">Fica para a SC</span><span class="big" id="rf-${i.id}">${fmtN(Number(i.quantidade)||0)}</span></div>
    </div>`}).join('');
  $('corpo').innerHTML=`
    <button class="btn" onclick="irModo('ressup')" style="margin-bottom:12px">← Voltar ao ressuprimento</button>
    <div class="cab"><div><h2>${esc(base)} <span style="color:#94a3b8;font-weight:500;font-size:13px">#${sol.id}</span></h2>
      <div style="font-size:12.5px;color:#64748b;margin-top:4px">${esc(nomeFil(sol.filial))} · enviada em ${fmtDH(sol.criado_em)}${sol.solicitante_nome?' · '+esc(sol.solicitante_nome):''} · ${itens.length} item(ns)</div></div>
      <div class="resumo"><div><b>${com}/${itens.length}</b>com estoque central</div><div><b style="color:#0e7490">${fmtN(un)}</b>un. do estoque</div><div><b>${fmtN(fica)}</b>un. para a SC</div></div></div>
    ${aberta?'':'<div class="aviso">Esta solicitação já saiu do aberto (SC gerada ou finalizada): só consulta.</div>'}
    ${linhas||'<div class="vazio">Nenhum item com quantidade liberada.</div>'}
    <div class="rodape"><div style="font-size:12.5px;color:#64748b;flex:1;min-width:200px">Tudo é salvo automaticamente. O que sai do estoque central aparece na coluna <b>Estoque central</b> do Painel e já sai da quantidade da SC.</div></div>`;
}
async function salvarRessup(id,valor){
  if(!ATUAL_R||!ATUAL_R.aberta)return;
  // relê o item no banco para não usar quantidade velha (o Almoxarifado Matriz pode ter mudado)
  let{data:at,error:e1}=await db.from('solicitacao_itens').select('id,quantidade,qtd_estoque_central').eq('id',id).maybeSingle();
  if(e1||!at){alert('Não consegui ler o item: '+(e1?e1.message:'não encontrado'));return}
  let p=precisa(at),v=Math.max(0,Math.min(p,Math.round(Number(valor)||0)));
  if(Number(valor)>p)alert('O máximo para este item é '+fmtN(p)+' (o que foi liberado).');
  let{data:upd,error}=await db.from('solicitacao_itens').update({quantidade:p-v,qtd_estoque_central:v||null})
    .eq('id',id).eq('quantidade',at.quantidade).select('id,quantidade,qtd_estoque_central');
  if(error){alert('Não consegui salvar: '+error.message);return}
  if(!upd||!upd.length){alert('Este item foi alterado por outra pessoa agora. Vou recarregar.');return abrirRessup(ATUAL_R.sol.id)}
  let it=ATUAL_R.itens.find(i=>i.id===id);Object.assign(it,upd[0]);
  desenharRessup();
  let ok=$('rok-'+id);if(ok){ok.textContent='✓ salvo';setTimeout(()=>{ok.textContent=''},1500)}
}

// ── Login: mesmo usuário do Painel principal ───────────────────────────────
async function liberar(email){
  userEmail=email||'';$('user-email').textContent=userEmail;
  try{let{data}=await db.from('perfis_usuario').select('role').eq('email',userEmail.toLowerCase().trim()).maybeSingle();isAdmin=data&&data.role==='admin'}catch(e){}
  document.body.classList.remove('bq-trancado');$('tela-login').style.display='none';
  let qs=new URLSearchParams(location.search),id=qs.get('id'),rid=qs.get('ressup');
  if(rid){MODO='ressup';await carregarRessup();abrirRessup(Number(rid))}
  else if(id){MODO='mob';await carregarLista();abrir(Number(id))}else carregarLista();
}
async function entrar(){
  let email=$('lg-email').value.trim(),senha=$('lg-senha').value,msg=$('lg-msg'),b=$('lg-btn');msg.style.display='none';
  if(!email||!senha){msg.textContent='Preencha e-mail e senha.';msg.style.display='block';return}
  b.disabled=true;b.textContent='Entrando...';
  let{data,error}=await db.auth.signInWithPassword({email,password:senha});
  b.disabled=false;b.textContent='Entrar';
  if(error){msg.textContent=error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':error.message;msg.style.display='block';return}
  liberar(data.user&&data.user.email);
}
async function sair(){await db.auth.signOut();location.reload()}
(async()=>{let{data}=await db.auth.getSession();if(data&&data.session)liberar(data.session.user.email);else $('tela-login').style.display='flex'})();
</script>
