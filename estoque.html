<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posição de Estoque</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
.topo{background:#0f172a;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topo .logo{background:#1e40af;border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.topo h1{font-size:15px;font-weight:700}
.topo span{color:#64748b;font-size:12px}
.tag{background:#1e293b;border:1px solid #334155;border-radius:6px;padding:3px 10px;font-size:11.5px;color:#94a3b8}
.topo-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.filtros-wrap{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filtros-wrap label{font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:4px}
.filtros-wrap input,.filtros-wrap select{border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff}
.filtros-wrap input:focus,.filtros-wrap select:focus{border-color:#1e40af}
.f-group{display:flex;flex-direction:column;min-width:0}
.f-busca{flex:1;min-width:200px}
.f-busca input{width:100%}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:12px 24px;background:#fff;border-bottom:1px solid #e2e8f0}
.pill-btn{border:1px solid #e2e8f0;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#475569;font-family:inherit;transition:all .15s}
.pill-btn.ativo{background:#1e40af;border-color:#1e40af;color:#fff}
.resumo{display:flex;flex-wrap:wrap;gap:10px;padding:16px 24px}
.resumo-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;min-width:140px;flex:1}
.resumo-card .val{font-size:22px;font-weight:800;color:#0f172a;line-height:1}
.resumo-card .lab{font-size:11.5px;color:#64748b;margin-top:3px}
.resumo-card.alerta .val{color:#ef4444}
.resumo-card.bloq .val{color:#f59e0b}
.tabela-wrap{padding:0 24px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;font-size:13px;margin-top:12px}
th{text-align:left;color:#64748b;border-bottom:1px solid #e2e8f0;padding:9px 10px;font-size:11px;font-weight:600;white-space:nowrap;background:#f8fafc;cursor:pointer;user-select:none}
th:hover{background:#f1f5f9}
td{border-bottom:1px solid #f1f5f9;padding:8px 10px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.num{text-align:right;font-family:ui-monospace,monospace;font-weight:600}
.cod{font-family:ui-monospace,monospace;color:#1e40af;font-size:12px}
.badge-bloq{background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:700}
.badge-ok{background:#dcfce7;color:#166534;border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:700}
.badge-alerta{background:#fee2e2;color:#991b1b;border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:700}
.badge-zero{background:#f1f5f9;color:#64748b;border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:700}
.paginador{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#fff;border-top:1px solid #e2e8f0;flex-wrap:wrap;gap:8px;font-size:13px;color:#64748b}
.pag-btns{display:flex;gap:6px}
.pag-btn{border:1px solid #e2e8f0;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;font-family:inherit}
.pag-btn:disabled{opacity:.4;cursor:not-allowed}
.pag-btn.ativo{background:#1e40af;border-color:#1e40af;color:#fff}
.vazio{text-align:center;color:#64748b;padding:48px;font-size:14px}
.loading{text-align:center;color:#94a3b8;padding:48px;font-size:13px}
.btn-excel{background:#166534;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-atualizar{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
</style>
<body>

<div class="topo">
  <div class="logo">E</div>
  <div>
    <h1>Posição de Estoque</h1>
    <span>LWHSB2010 — SB2</span>
  </div>
  <div class="tag" id="tag-sync">Carregando...</div>
  <div id="tag-ultima" style="font-size:11px;color:#475569;margin-left:4px"></div>
  <div class="topo-right">
    <button class="btn-atualizar" onclick="carregar()">↻ Atualizar</button>
    <button class="btn-excel" onclick="exportarExcel()">⬇ Excel</button>
  </div>
</div>

<div class="filtros-wrap">
  <div class="f-group">
    <label>Filial</label>
    <select id="f-filial" onchange="aplicarFiltros()">
      <option value="">Todas as filiais</option>
      <option value="01">01 — MATRIZ</option>
      <option value="03">03 — PAU DOS FERROS</option>
      <option value="04">04 — ITAPIPOCA</option>
      <option value="06">06 — CURRAIS NOVOS</option>
      <option value="07">07 — SOBRAL</option>
      <option value="08">08 — APARECIDA DE GOIANIA</option>
      <option value="09">09 — MARACANAU</option>
      <option value="10">10 — MOSSORO</option>
      <option value="11">11 — ANAPOLIS</option>
      <option value="13">13 — ALAGOINHAS</option>
      <option value="14">14 — RIBEIRA DO POMBAL</option>
      <option value="15">15 — PAULO AFONSO</option>
      <option value="22">22 — GOIANIA</option>
      <option value="23">23 — BATURITE</option>
      <option value="24">24 — MORRINHOS</option>
      <option value="25">25 — CASCAVEL</option>
      <option value="27">27 — CAUCAIA</option>
      <option value="29">29 — HORIZONTE</option>
      <option value="34">34 — SENHOR DO BONFIM</option>
      <option value="36">36 — LUZIANIA</option>
      <option value="37">37 — DIVINOPOLIS</option>
      <option value="40">40 — GARANHUNS</option>
      <option value="41">41 — FLORIANO</option>
      <option value="42">42 — LIVRAMENTO DE NOSSA SENHORA</option>
      <option value="43">43 — HORTOLANDIA</option>
      <option value="44">44 — BRUMADO</option>
      <option value="45">45 — NITEROI</option>
    </select>
  </div>
  <div class="f-group">
    <label>Armazém</label>
    <select id="f-armazem" onchange="aplicarFiltros()">
      <option value="">Todos</option>
    </select>
  </div>
  <div class="f-group">
    <label>Grupo</label>
    <select id="f-grupo" onchange="aplicarFiltros()">
      <option value="">Todos os grupos</option>
    </select>
  </div>
  <div class="f-group f-busca">
    <label>Código / Descrição</label>
    <input id="f-busca" placeholder="🔍 Buscar..." oninput="aplicarFiltros()">
  </div>
  <div class="f-group">
    <label>Nível mínimo</label>
    <select id="f-nivel" onchange="aplicarFiltros()">
      <option value="">Qualquer quantidade</option>
      <option value="0">Zerados (= 0)</option>
      <option value="10">Baixo estoque (≤ 10)</option>
      <option value="50">Baixo estoque (≤ 50)</option>
    </select>
  </div>
</div>

<div class="pills">
  <button class="pill-btn ativo" id="pill-todos" onclick="setPill('todos')">Todos</button>
  <button class="pill-btn" id="pill-ok" onclick="setPill('ok')">✓ Normal</button>
  <button class="pill-btn" id="pill-alerta" onclick="setPill('alerta')">⚠ Nível baixo (≤ 10)</button>
  <button class="pill-btn" id="pill-zero" onclick="setPill('zero')">✕ Zerados</button>
  <button class="pill-btn" id="pill-bloqueado" onclick="setPill('bloqueado')">🔒 Bloqueados</button>
  <button class="pill-btn" id="pill-desbloqueado" onclick="setPill('desbloqueado')">🔓 Desbloqueados</button>
</div>

<div class="resumo" id="resumo"></div>
<div class="tabela-wrap"><div id="tabela-container"><div class="loading">Conectando ao banco...</div></div></div>
<div class="paginador" id="paginador" style="display:none">
  <span id="pag-info"></span>
  <div class="pag-btns" id="pag-btns"></div>
</div>

<script>
const SUPABASE_URL = 'https://vvwtqbehfwrgcmbjdniu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d3RxYmVoZndyZ2NtYmpkbml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjg3NTcsImV4cCI6MjA5NzEwNDc1N30.jHxva16Nae109RiWDlgl21saOJ6gBihstMmlKRRBXis';

const FILIAIS = {
  '01': 'MATRIZ', '03': 'PAU DOS FERROS', '04': 'ITAPIPOCA',
  '06': 'CURRAIS NOVOS', '07': 'SOBRAL', '08': 'APARECIDA DE GOIANIA',
  '09': 'MARACANAU', '10': 'MOSSORO', '11': 'ANAPOLIS',
  '13': 'ALAGOINHAS', '14': 'RIBEIRA DO POMBAL', '15': 'PAULO AFONSO',
  '22': 'GOIANIA', '23': 'BATURITE', '24': 'MORRINHOS',
  '25': 'CASCAVEL', '27': 'CAUCAIA', '29': 'HORIZONTE',
  '34': 'SENHOR DO BONFIM', '36': 'LUZIANIA', '37': 'DIVINOPOLIS',
  '40': 'GARANHUNS', '41': 'FLORIANO', '42': 'LIVRAMENTO DE NOSSA SENHORA',
  '43': 'HORTOLANDIA', '44': 'BRUMADO', '45': 'NITEROI'
};
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const POR_PAGINA = 100;
const NIVEL_BAIXO = 10;

let _todos = [];
let _filtrados = [];
let _pagina = 1;
let _sortCol = 'filial';
let _sortDir = 1;
let _pillAtiva = 'todos';
let _paginaAtual = [];
let _mapaConsumo = {};

// ── CARREGAR ────────────────────────────────────────────
async function carregar() {
  document.getElementById('tabela-container').innerHTML = '<div class="loading">Carregando dados do estoque...</div>';
  document.getElementById('resumo').innerHTML = '';
  document.getElementById('paginador').style.display = 'none';
  document.getElementById('tag-sync').textContent = 'Carregando...';
  document.getElementById('tag-ultima').textContent = '';

  // Última atualização
  try {
    const { data: st } = await db.from('bases_status').select('atualizado_em,registros').eq('base','estoque_sb2').single();
    if (st && st.atualizado_em) {
      const dt = new Date(st.atualizado_em);
      const fmt = dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('tag-ultima').innerHTML =
        `<span style="color:#64748b">Última atualização:</span> <strong style="color:#e2e8f0">${fmt}</strong> <span style="color:#64748b">(${(st.registros||0).toLocaleString('pt-BR')} itens)</span>`;
    }
  } catch(e) {}

  // Buscar estoque
  let rows = [], off = 0;
  for (;;) {
    const { data, error } = await db
      .from('estoque_sb2')
      .select('filial,codigo,descricao,grupo,armazem,qtd_atual,custo_medio,bloqueado,status,dt_ult_movimento')
      .range(off, off + 999);
    if (error) {
      document.getElementById('tabela-container').innerHTML = '<div class="vazio">Erro ao carregar: ' + error.message + '</div>';
      return;
    }
    if (!data || !data.length) break;
    rows = rows.concat(data);
    if (data.length < 1000) break;
    off += 1000;
  }

  // Popular selects de armazém e grupo
  const arms = new Set(rows.map(r => (r.armazem||'').trim()).filter(Boolean));
  const selArm = document.getElementById('f-armazem');
  selArm.innerHTML = '<option value="">Todos</option>';
  [...arms].sort().forEach(a => { const o = document.createElement('option'); o.value=a; o.textContent=a; selArm.appendChild(o); });

  const grps = new Set(rows.map(r => (r.grupo||'').trim()).filter(Boolean));
  const selGrp = document.getElementById('f-grupo');
  selGrp.innerHTML = '<option value="">Todos os grupos</option>';
  [...grps].sort().forEach(g => { const o = document.createElement('option'); o.value=g; o.textContent=g; selGrp.appendChild(o); });

  // Consolidar por filial+codigo (somar armazéns)
  const mapa = {};
  rows.forEach(r => {
    const k = `${(r.filial||'').trim()}|${(r.codigo||'').trim()}`;
    if (!mapa[k]) mapa[k] = { ...r, qtd_atual: 0, _armazens: [] };
    mapa[k].qtd_atual += Number(r.qtd_atual) || 0;
    mapa[k]._armazens.push({
      armazem: (r.armazem||'').trim().replace(/^0+/,'') || '—',
      qtd: Number(r.qtd_atual) || 0
    });
  });
  _todos = Object.values(mapa);

  // Buscar consumo anual
  await carregarConsumo(_todos);

  document.getElementById('tag-sync').textContent = _todos.length.toLocaleString('pt-BR') + ' registros';
  aplicarFiltros();
}

// ── CONSUMO ANUAL ────────────────────────────────────────
async function carregarConsumo(rows) {
  _mapaConsumo = {};
  let consumos = [], off = 0;
  for (;;) {
    const { data } = await db.from('consumo_anual').select('filial,produto,total_ano').range(off, off + 999);
    if (!data || !data.length) break;
    consumos = consumos.concat(data);
    if (data.length < 1000) break;
    off += 1000;
  }
  consumos.forEach(r => {
    const k = `${(r.filial||'').trim()}|${(r.produto||'').trim()}`;
    _mapaConsumo[k] = { total: Number(r.total_ano) || 0 };
  });

  const mesesDecorridos = Math.max(1, new Date().getMonth() + 1);
  rows.forEach(r => {
    const k = `${(r.filial||'').trim()}|${(r.codigo||'').trim()}`;
    const cons = _mapaConsumo[k];
    if (cons && cons.total > 0) {
      const media = cons.total / mesesDecorridos;
      r._consumo_total = cons.total;
      r._consumo_media = media;
      r._cobertura = media > 0 ? (Number(r.qtd_atual)||0) / media : null;
    } else {
      r._consumo_total = 0;
      r._consumo_media = 0;
      r._cobertura = null;
    }
  });
}

// ── FILTROS ──────────────────────────────────────────────
function aplicarFiltros() {
  const filial  = document.getElementById('f-filial').value.trim();
  const armazem = document.getElementById('f-armazem').value.trim();
  const grupo   = document.getElementById('f-grupo').value.trim();
  const busca   = document.getElementById('f-busca').value.toLowerCase().trim();
  const nivel   = document.getElementById('f-nivel').value;

  _filtrados = _todos.filter(r => {
    const fil  = (r.filial||'').trim();
    const cod  = (r.codigo||'').trim();
    const qatu = Number(r.qtd_atual) || 0;
    const isBloq = r.bloqueado === true || r.bloqueado === '1' || r.bloqueado === 'S';

    if (filial && fil !== filial) return false;
    if (grupo && (r.grupo||'').trim() !== grupo) return false;
    if (busca && !cod.toLowerCase().includes(busca) && !(r.descricao||'').toLowerCase().includes(busca)) return false;
    if (nivel === '0' && qatu !== 0) return false;
    if (nivel === '10' && qatu > 10) return false;
    if (nivel === '50' && qatu > 50) return false;
    if (_pillAtiva === 'bloqueado'    && !isBloq) return false;
    if (_pillAtiva === 'desbloqueado' && isBloq) return false;
    if (_pillAtiva === 'alerta' && (qatu > NIVEL_BAIXO || qatu <= 0)) return false;
    if (_pillAtiva === 'zero'   && qatu !== 0) return false;
    if (_pillAtiva === 'ok'     && qatu <= NIVEL_BAIXO) return false;
    return true;
  });

  _filtrados.sort((a, b) => {
    let va = a[_sortCol] ?? '', vb = b[_sortCol] ?? '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return _sortDir * (va < vb ? -1 : va > vb ? 1 : 0);
  });

  _pagina = 1;
  renderResumo();
  renderTabela();
  renderPaginador();
}

function setPill(p) {
  _pillAtiva = p;
  document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('ativo'));
  const el = document.getElementById('pill-' + p);
  if (el) el.classList.add('ativo');
  aplicarFiltros();
}

// ── RESUMO ───────────────────────────────────────────────
function renderResumo() {
  const total    = _filtrados.length;
  const zerados  = _filtrados.filter(r => (Number(r.qtd_atual)||0) === 0).length;
  const baixos   = _filtrados.filter(r => { const q=Number(r.qtd_atual)||0; return q>0&&q<=NIVEL_BAIXO; }).length;
  const bloqs    = _filtrados.filter(r => r.bloqueado===true||r.bloqueado==='1'||r.bloqueado==='S').length;
  document.getElementById('resumo').innerHTML = `
    <div class="resumo-card"><div class="val">${total.toLocaleString('pt-BR')}</div><div class="lab">Itens encontrados</div></div>
    <div class="resumo-card alerta"><div class="val">${zerados.toLocaleString('pt-BR')}</div><div class="lab">Zerados</div></div>
    <div class="resumo-card alerta"><div class="val">${baixos.toLocaleString('pt-BR')}</div><div class="lab">Nível baixo (≤ ${NIVEL_BAIXO})</div></div>
    <div class="resumo-card bloq"><div class="val">${bloqs.toLocaleString('pt-BR')}</div><div class="lab">Bloqueados</div></div>`;
}

// ── TABELA ───────────────────────────────────────────────
function renderTabela() {
  const inicio = (_pagina - 1) * POR_PAGINA;
  const pagina = _filtrados.slice(inicio, inicio + POR_PAGINA);
  _paginaAtual = pagina;

  if (!_filtrados.length) {
    document.getElementById('tabela-container').innerHTML = '<div class="vazio">Nenhum item encontrado com esses filtros.</div>';
    return;
  }

  function th(col, label) {
    const seta = col === _sortCol ? (_sortDir === 1 ? ' ↑' : ' ↓') : '';
    return `<th onclick="sortBy('${col}')">${label}${seta}</th>`;
  }

  function fmtData(d) {
    if (!d) return '—';
    const s = String(d).trim();
    if (/^\d{8}$/.test(s)) return s.slice(6,8)+'/'+s.slice(4,6)+'/'+s.slice(0,4);
    return s;
  }

  function badgeQtd(q) {
    const n = Number(q)||0;
    if (n === 0)          return `<span class="badge-zero">${n}</span>`;
    if (n <= NIVEL_BAIXO) return `<span class="badge-alerta">⚠ ${n}</span>`;
    return `<span class="badge-ok">${n.toLocaleString('pt-BR')}</span>`;
  }

  function badgeBloq(b) {
    const isBloq = b===true||b==='1'||b==='S';
    return isBloq ? '<span class="badge-bloq">🔒 Bloqueado</span>' : '<span class="badge-ok">🔓 Livre</span>';
  }

  function corCobertura(c) {
    if (c == null) return '#94a3b8';
    if (c < 1) return '#ef4444';
    if (c < 3) return '#f59e0b';
    return '#16a34a';
  }

  const linhas = pagina.map((r, i) => `
    <tr>
      <td class="cod" title="${(r.filial||'').trim()}">${FILIAIS[(r.filial||'').trim()] || (r.filial||'').trim()}</td>
      <td class="cod">${(r.codigo||'').trim()}</td>
      <td>${r.descricao||'—'}</td>
      <td>${(r.grupo||'—')}</td>
      <td class="num" onclick="abrirPopup(${i})" style="cursor:pointer;color:#1e40af;text-decoration:underline dotted" title="Ver por armazém">${badgeQtd(r.qtd_atual)}</td>
      <td class="num">${(Number(r.custo_medio)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td>${badgeBloq(r.bloqueado)}</td>
      <td style="color:#64748b;font-size:12px">${fmtData(r.dt_ult_movimento)}</td>
      <td class="num">${(Number(r._consumo_total)||0) > 0 ? Number(r._consumo_total).toLocaleString('pt-BR') : '—'}</td>
      <td class="num" style="color:${corCobertura(r._cobertura)};cursor:${r._cobertura != null ? 'help' : 'default'}" 
        title="${r._cobertura != null ? 
          'Cobertura: ' + Number(r._cobertura).toFixed(1) + ' meses\n' +
          'Qtd atual: ' + (Number(r.qtd_atual)||0).toLocaleString('pt-BR') + ' un\n' +
          'Consumo 2026: ' + (Number(r._consumo_total)||0).toLocaleString('pt-BR') + ' un\n' +
          'Média mensal: ' + (Number(r._consumo_media)||0).toFixed(1) + ' un/mês\n' +
          'Cálculo: ' + (Number(r.qtd_atual)||0) + ' ÷ ' + (Number(r._consumo_media)||0).toFixed(1) + ' = ' + Number(r._cobertura).toFixed(1) + ' meses'
          : 'Sem histórico de consumo em 2026'}">${r._cobertura != null ? Number(r._cobertura).toFixed(1)+' m' : '—'}</td>
      <td style="text-align:center"><button onclick="baixarExcelSCsAbertas('${(r.filial||'').trim()}','${(r.codigo||'').trim()}','${(r.descricao||'').replace(/'/g,\"\\'\")}'" style="background:#1e40af;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;font-weight:600">⬇ SCs</button></td>
    </tr>`).join('');

  document.getElementById('tabela-container').innerHTML = `
    <table>
      <thead><tr>
        ${th('filial','Filial / Nome')}
        ${th('codigo','Código')}
        ${th('descricao','Descrição')}
        ${th('grupo','Grupo')}
        ${th('qtd_atual','Qtd Atual')}
        ${th('custo_medio','Custo Médio')}
        ${th('bloqueado','Status')}
        ${th('dt_ult_movimento','Últ. Mov.')}
        ${th('_consumo_total','Consumo 2026')}
        ${th('_cobertura','Cobertura')}
        <th>SCs Abertas</th>
      </tr></thead>
      <tbody>${linhas}</tbody>
    </table>`;
}

// ── EXCEL SCs ABERTAS ────────────────────────────────────
async function baixarExcelSCsAbertas(filial, codigo, descricao) {
  if (!codigo) { alert('Código inválido.'); return; }
  // Buscar sc_pedidos por produto e filial
  let rows = [], off = 0;
  for (;;) {
    const { data } = await db.from('sc_pedidos')
      .select('c1_num,c1_filial,c1_cc,c1_produto,c1_descri,c1_quant,c1_quje,status_desc,pc_numero,c1_emissao,pc_comprador')
      .eq('c1_produto', codigo)
      .neq('status_desc', 'Solicitação Totalmente Atendida')
      .neq('status_desc', 'Elim. por Resíduo')
      .neq('status_desc', 'Solicitação Rejeitada')
      .neq('status_desc', 'Solicitação Rejeitada pelo Compras')
      .range(off, off + 999);
    if (!data || !data.length) break;
    rows = rows.concat(data);
    if (data.length < 1000) break;
    off += 1000;
  }
  if (!rows.length) { alert('Nenhuma SC aberta encontrada para este item.'); return; }
  // Buscar pedidos_compra para trazer status real do PC
  const scNums = [...new Set(rows.map(r => (r.c1_num||'').trim()).filter(Boolean))];
  let pcMap = {};
  for (let i = 0; i < scNums.length; i += 50) {
    const lote = scNums.slice(i, i+50);
    const vars = lote.map(s => `c7_numsc.eq.${s}`).join(',');
    const { data: pcs } = await db.from('pedidos_compra')
      .select('c7_numsc,c7_produto,c7_num,c7_quant,c7_total,status_desc,dt_entrega,c7_comprador')
      .or(vars)
      .eq('c7_produto', codigo);
    (pcs||[]).forEach(p => {
      const k = (p.c7_numsc||'').trim();
      if (!pcMap[k]) pcMap[k] = [];
      pcMap[k].push(p);
    });
  }
  const excelRows = rows.map(r => {
    const sc = (r.c1_num||'').trim();
    const pcs = pcMap[sc] || [];
    const pcNums = pcs.map(p => p.c7_num).filter((v,i,a)=>a.indexOf(v)===i).join(', ');
    const pcStatus = pcs.length ? [...new Set(pcs.map(p=>p.status_desc))].join(', ') : 'Sem PC';
    const qtdPedida = pcs.reduce((a,p)=>a+(Number(p.c7_quant)||0),0);
    const valorPC = pcs.reduce((a,p)=>a+(Number(p.c7_total)||0),0);
    const dtEntrega = pcs.map(p=>p.dt_entrega).filter(Boolean).sort().pop() || '';
    const fmtDt = d => { if(!d)return''; const s=String(d).replace(/-/g,''); return s.length===8?s.slice(6,8)+'/'+s.slice(4,6)+'/'+s.slice(0,4):d; };
    return {
      'SC': sc,
      'Filial SC': (r.c1_filial||'').trim(),
      'CC': (r.c1_cc||'').trim(),
      'Código': codigo,
      'Descrição': descricao,
      'Qtd SC': Number(r.c1_quant)||0,
      'Qtd Entregue': Number(r.c1_quje)||0,
      'Status SC': r.status_desc||'',
      'Emissão SC': fmtDt(r.c1_emissao),
      'Nº PC': pcNums||'Sem PC',
      'Qtd PC': qtdPedida||'',
      'Valor PC (R$)': valorPC ? valorPC.toFixed(2) : '',
      'Status PC': pcStatus,
      'Previsão Entrega': fmtDt(dtEntrega),
      'Comprador': r.pc_comprador||'',
    };
  });
  const ws = XLSX.utils.json_to_sheet(excelRows);
  ws['!cols'] = [{wch:10},{wch:8},{wch:12},{wch:12},{wch:50},{wch:8},{wch:10},{wch:30},{wch:12},{wch:14},{wch:8},{wch:12},{wch:30},{wch:14},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'SCs Abertas');
  XLSX.writeFile(wb, `scs_abertas_${codigo}.xlsx`);
}

// ── POPUP ARMAZÉNS ───────────────────────────────────────
function abrirPopup(i) {
  const r = _paginaAtual[i];
  if (!r || !r._armazens) return;
  const old = document.getElementById('popup-arm');
  if (old) old.remove();

  const linhas = r._armazens.sort((a,b) => b.qtd-a.qtd).map(a =>
    `<tr><td style="padding:6px 12px;border-bottom:1px solid #f1f5f9;font-family:monospace">${a.armazem}</td>
     <td style="padding:6px 12px;border-bottom:1px solid #f1f5f9;text-align:right;font-weight:700">${a.qtd.toLocaleString('pt-BR')}</td></tr>`
  ).join('');

  const popup = document.createElement('div');
  popup.id = 'popup-arm';
  popup.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.2);z-index:9999;min-width:280px;overflow:hidden';
  popup.innerHTML = `
    <div style="background:#0f172a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-weight:700;font-size:13px">${(r.codigo||'').trim()} — Filial ${(r.filial||'').trim()}</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:2px">${(r.descricao||'').trim()}</div>
      </div>
      <button onclick="document.getElementById('popup-arm').remove()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:18px;line-height:1">✕</button>
    </div>
    <div style="padding:8px 0">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr>
          <th style="padding:6px 12px;text-align:left;color:#64748b;font-size:11px;border-bottom:2px solid #e2e8f0">Armazém</th>
          <th style="padding:6px 12px;text-align:right;color:#64748b;font-size:11px;border-bottom:2px solid #e2e8f0">Qtd</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
        <tfoot><tr>
          <td style="padding:8px 12px;font-weight:700;border-top:2px solid #e2e8f0">Total</td>
          <td style="padding:8px 12px;font-weight:700;text-align:right;border-top:2px solid #e2e8f0">${(Number(r.qtd_atual)||0).toLocaleString('pt-BR')}</td>
        </tr></tfoot>
      </table>
    </div>`;
  document.body.appendChild(popup);
  setTimeout(() => document.addEventListener('click', function h(e) {
    if (!popup.contains(e.target)) { popup.remove(); document.removeEventListener('click',h); }
  }), 100);
}

// ── PAGINADOR ────────────────────────────────────────────
function renderPaginador() {
  const total = _filtrados.length;
  const totalPags = Math.ceil(total / POR_PAGINA);
  const pag = document.getElementById('paginador');
  if (!total) { pag.style.display='none'; return; }
  pag.style.display='flex';
  document.getElementById('pag-info').textContent =
    `${(_pagina-1)*POR_PAGINA+1}–${Math.min(_pagina*POR_PAGINA,total)} de ${total.toLocaleString('pt-BR')} itens`;

  let html = `<button class="pag-btn" onclick="irPag(${_pagina-1})" ${_pagina===1?'disabled':''}>‹ Ant.</button>`;
  for (let p=1; p<=totalPags; p++) {
    if (p===1||p===totalPags||(p>=_pagina-2&&p<=_pagina+2))
      html += `<button class="pag-btn ${p===_pagina?'ativo':''}" onclick="irPag(${p})">${p}</button>`;
    else if (p===_pagina-3||p===_pagina+3)
      html += `<span style="padding:0 4px;color:#94a3b8">…</span>`;
  }
  html += `<button class="pag-btn" onclick="irPag(${_pagina+1})" ${_pagina===totalPags?'disabled':''}>Próx. ›</button>`;
  document.getElementById('pag-btns').innerHTML = html;
}

function irPag(p) {
  const t = Math.ceil(_filtrados.length/POR_PAGINA);
  if (p<1||p>t) return;
  _pagina=p; renderTabela(); renderPaginador();
  window.scrollTo({top:0,behavior:'smooth'});
}

function sortBy(col) {
  if (_sortCol===col) _sortDir*=-1; else { _sortCol=col; _sortDir=1; }
  aplicarFiltros();
}

// ── EXCEL ─────────────────────────────────────────────────
function exportarExcel() {
  if (!_filtrados.length) { alert('Nenhum dado para exportar.'); return; }
  const linhas = _filtrados.map(r => ({
    Filial:     (r.filial||'').trim(),
    Código:     (r.codigo||'').trim(),
    Descrição:  (r.descricao||'').trim(),
    Grupo:      (r.grupo||'').trim(),
    'Qtd Atual': Number(r.qtd_atual)||0,
    'Custo Médio': Number(r.custo_medio)||0,
    Status:     r.bloqueado ? 'Bloqueado' : 'Livre',
    'Últ. Mov.': r.dt_ult_movimento||'',
    'Consumo 2026': Number(r._consumo_total)||0,
    'Cobertura (meses)': r._cobertura!=null ? parseFloat(Number(r._cobertura).toFixed(1)) : '',
  }));
  const ws = XLSX.utils.json_to_sheet(linhas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Estoque');
  XLSX.writeFile(wb, 'posicao_estoque.xlsx');
}

window.irPag=irPag; window.sortBy=sortBy; window.setPill=setPill;
window.aplicarFiltros=aplicarFiltros; window.exportarExcel=exportarExcel;
window.carregar=carregar; window.abrirPopup=abrirPopup;

carregar();
</script>
