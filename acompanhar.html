<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Acompanhar Solicitação</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#0f172a}
.page{max-width:980px;margin:0 auto;padding:24px 16px}
.header-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo{width:36px;height:36px;border-radius:9px;background:#1e40af;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0}
h2{font-size:18px;font-weight:700;margin:0 0 2px}
p.sub{color:#64748b;font-size:13px;margin:0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin-bottom:14px}
label{font-size:12px;font-weight:600;color:#64748b;display:block;margin:0 0 5px}
input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #e2e8f0;font-size:13.5px;outline:none;font-family:inherit;background:#fff;margin:0}
input:focus{border-color:#1e40af}
.btn{background:#1e40af;color:#fff;border:none;border-radius:9px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{font-size:13px;padding:10px 14px;border-radius:8px;margin:10px 0}
.erro{background:#fee2e2;color:#991b1b}

/* Cards de solicitação */
.sol-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden}
.sol-header{padding:14px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sol-header:hover{background:#fafafa}
.sol-titulo{font-size:13.5px;font-weight:700;color:#0f172a}
.sol-sub{font-size:12px;color:#64748b;margin-top:3px}
.sol-badges{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
.st-pendente{background:#dbeafe;color:#1e40af}
.st-gerente{background:#fef3c7;color:#b45309}
.st-master{background:#fce7f3;color:#9d174d}
.st-aprovada{background:#dcfce7;color:#166634}
.st-reprovada{background:#fee2e2;color:#991b1b}
.pct-badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.sol-body{display:none;border-top:1px solid #f1f5f9}
.sol-body.aberto{display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:#64748b;font-weight:600;font-size:11.5px;padding:8px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
td{padding:8px 14px;border-bottom:1px solid #f8fafc;vertical-align:middle}
tr:last-child td{border-bottom:none}
.mono{font-family:ui-monospace,monospace;font-size:11.5px}
.status-pc{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px}
.recebido{background:#dcfce7;color:#166634}
.pendente-pc{background:#fef3c7;color:#b45309}
.sem-pedido{background:#f1f5f9;color:#64748b}
.vazio{text-align:center;color:#94a3b8;padding:30px;font-size:13px}
.sla{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px}
.sla-ok{background:#dcfce7;color:#166634}
.sla-alerta{background:#fef3c7;color:#b45309}
.sla-crit{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="page">
  <div class="header-logo">
    <div class="logo">R</div>
    <div>
      <h2>Acompanhar Solicitações</h2>
      <p class="sub">Consulte o status dos seus pedidos de ressuprimento</p>
    </div>
  </div>

  <div class="card">
    <div class="grid2">
      <div>
        <label>Código da solicitação</label>
        <input id="codigo" placeholder="Ex.: 335" type="number"/>
      </div>
      <div>
        <label>Matrícula</label>
        <input id="matricula" placeholder="Ex.: 014943" onkeydown="if(event.key==='Enter') buscar()"/>
      </div>
    </div>
    <div id="msg"></div>
    <button class="btn" onclick="buscar()">🔍 Buscar minhas solicitações</button>
  </div>

  <div id="resultado"></div>
</div>

<script>
const SUPABASE_URL = "https://vvwtqbehfwrgcmbjdniu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d3RxYmVoZndyZ2NtYmpkbml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjg3NTcsImV4cCI6MjA5NzEwNDc1N30.jHxva16Nae109RiWDlgl21saOJ6gBihstMmlKRRBXis";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmtData(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function fmtData8(d) {
  if (!d || String(d).length < 8) return '—';
  const s = String(d);
  return s.slice(6,8)+'/'+s.slice(4,6)+'/'+s.slice(0,4);
}

function fmtBRL(v) {
  return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

function statusBadge(st) {
  const map = {
    'pendente': ['st-pendente','🔵 Pendente'],
    'aguardando_master': ['st-master','⚡ Aguardando master'],
    'em_analise': ['st-gerente','🔄 Em análise'],
    'aprovada': ['st-aprovada','✅ Aprovada'],
    'reprovada': ['st-reprovada','❌ Reprovada'],
  };
  const [cls, label] = map[st] || ['st-pendente', st];
  return '<span class="badge '+cls+'">'+label+'</span>';
}

function pcStatusBadge(st) {
  if (!st) return '<span class="status-pc sem-pedido">Sem pedido</span>';
  const s = st.toLowerCase();
  const cls = s.includes('receb') ? 'recebido' : s.includes('pend') ? 'pendente-pc' : 'sem-pedido';
  return '<span class="status-pc '+cls+'">'+st+'</span>';
}

function diasAte(dataStr) {
  if (!dataStr) return null;
  const d = new Date(String(dataStr).length === 8
    ? dataStr.slice(0,4)+'-'+dataStr.slice(4,6)+'-'+dataStr.slice(6,8)
    : dataStr);
  return Math.ceil((d - new Date()) / 86400000);
}

function slaBadge(dataEntrega) {
  const d = diasAte(dataEntrega);
  if (d === null) return '';
  const cls = d < 0 ? 'sla-crit' : d <= 7 ? 'sla-alerta' : 'sla-ok';
  const txt = d < 0 ? 'Atrasado '+Math.abs(d)+'d' : 'Entrega em '+d+'d';
  return '<span class="sla '+cls+'">'+txt+'</span>';
}

function toggle(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('aberto');
}
window.toggle = toggle;

async function buscar() {
  const codigo = (document.getElementById('codigo').value || '').trim();
  const mat    = (document.getElementById('matricula').value || '').trim();
  const msgEl  = document.getElementById('msg');
  const resEl  = document.getElementById('resultado');

  if (!codigo || !mat) {
    msgEl.innerHTML = '<div class="msg erro">Preencha o código da solicitação e a matrícula.</div>';
    return;
  }
  msgEl.innerHTML = '';
  resEl.innerHTML = '<div class="vazio">⏳ Buscando...</div>';

  // Buscar todas as solicitações com a mesma matrícula e mesmo envio
  // O código é o ID de uma das solicitações — buscar pelo criado_em dela para pegar todas do mesmo envio
  const { data: solRef } = await db.from('solicitacoes').select('criado_em,solicitante_matricula').eq('id', Number(codigo)).maybeSingle();

  if (!solRef || solRef.solicitante_matricula !== mat) {
    resEl.innerHTML = '<div class="vazio">Código ou matrícula incorretos.</div>';
    return;
  }

  // Buscar todas solicitações enviadas no mesmo momento (±5 segundos) com a mesma matrícula
  const dtRef = new Date(solRef.criado_em);
  const dtIni = new Date(dtRef.getTime() - 5000).toISOString();
  const dtFim = new Date(dtRef.getTime() + 5000).toISOString();

  let query = db.from('solicitacoes').select('*')
    .eq('solicitante_matricula', mat)
    .gte('criado_em', dtIni)
    .lte('criado_em', dtFim)
    .order('criado_em', {ascending: false});

  const { data: sols, error } = await query;
  if (error || !sols || !sols.length) {
    resEl.innerHTML = '<div class="vazio">Nenhuma solicitação encontrada.</div>';
    return;
  }

  // Buscar itens da solicitação (para mostrar quando não há SC ainda)
  const solIds = sols.map(s => s.id);
  let solItensMap = {};
  if (solIds.length > 0) {
    const {data: solItens} = await db.from('solicitacao_itens')
      .select('solicitacao_id,codigo,descricao,quantidade,qtd_sugerida,situacao')
      .in('solicitacao_id', solIds);
    (solItens || []).forEach(function(it) {
      if (!solItensMap[it.solicitacao_id]) solItensMap[it.solicitacao_id] = [];
      solItensMap[it.solicitacao_id].push(it);
    });
  }

  // Buscar sc_pedidos para as SCs aprovadas
  const scsComNum = sols.filter(s => s.sc_numero && s.sc_numero.trim());
  let scPedidos = {};

  if (scsComNum.length > 0) {
    const scsNums = [...new Set(scsComNum.map(s => s.sc_numero.trim()))];
    for (let i = 0; i < scsNums.length; i += 50) {
      const lote = scsNums.slice(i, i+50);
      let off = 0;
      while (true) {
        let q = db.from('sc_pedidos')
          .select('c1_num,c1_produto,c1_descri,c1_quant,pc_numero,pc_status,pc_total,pc_dt_entrega,pc_comprador')
          .in('c1_num', lote)
          .range(off, off+999);
        // filtrar por filial se disponível
        const {data: rows} = await q;
        if (!rows || !rows.length) break;
        rows.forEach(r => {
          const sc = (r.c1_num||'').trim();
          if (!scPedidos[sc]) scPedidos[sc] = [];
          scPedidos[sc].push(r);
        });
        if (rows.length < 1000) break;
        off += 1000;
      }
    }
  }

  // Renderizar cards
  let html = '<div style="font-size:13px;color:#64748b;margin-bottom:12px"><strong>'+sols.length+'</strong> solicitação(ões) encontrada(s)</div>';

  sols.forEach(function(sol, idx) {
    const sc = sol.sc_numero ? sol.sc_numero.trim() : null;
    const itens = sc ? (scPedidos[sc] || []) : [];
    const total = itens.length;
    const recebidos = itens.filter(function(it) {
      const s = (it.pc_status||'').toLowerCase();
      return s.includes('receb') || s.includes('pré-nota');
    }).length;
    const pct = total > 0 ? Math.round(recebidos/total*100) : null;
    const valorTotal = itens.reduce(function(s,it){ return s+(Number(it.pc_total)||0); }, 0);
    const dtEntregas = itens.map(function(it){ return it.pc_dt_entrega; }).filter(Boolean).sort();
    const dtEntregaMaisRecente = dtEntregas.length ? dtEntregas[dtEntregas.length-1] : null;
    const compradores = [...new Set(itens.map(function(it){ return (it.pc_comprador||'').trim(); }).filter(Boolean))];

    const corPct = pct === null ? '#94a3b8' : pct === 100 ? '#16a34a' : pct > 50 ? '#1e40af' : pct > 0 ? '#d97706' : '#ef4444';

    html += '<div class="sol-card">';
    html += '<div class="sol-header" onclick="toggle(\'sol-'+idx+'\')">';
    html += '<div>';
    html += '<div class="sol-titulo">'+(sol.cc||'')+'</div>';
    html += '<div class="sol-sub">'+fmtData(sol.criado_em);
    if (sol.periodo_meses) html += ' · '+sol.periodo_meses+' meses';
    if (sc) html += ' · <span class="mono">SC '+sc+'</span>';
    if (sol.observacao) html += ' · <em>"'+sol.observacao+'"</em>';
    html += '</div>';
    if (compradores.length) html += '<div style="font-size:11px;color:#64748b;margin-top:3px">🛒 '+compradores.join(' · ')+'</div>';
    html += '</div>';
    html += '<div class="sol-badges">';
    html += statusBadge(sol.status);
    if (pct !== null) html += '<span class="pct-badge" style="background:'+corPct+'1a;color:'+corPct+'">'+pct+'% recebido</span>';
    if (dtEntregaMaisRecente) html += slaBadge(dtEntregaMaisRecente);
    html += '<span style="color:#94a3b8;font-size:12px">▾</span>';
    html += '</div></div>';

    // Corpo expandido
    html += '<div class="sol-body" id="sol-'+idx+'">';
    if (!sc) {
      const itensSol = solItensMap[sol.id] || [];
      if (itensSol.length > 0) {
        const statusSol = sol.status;
        const labelStatus = statusSol === 'aguardando_master' ? '⚡ Aguardando revisão do master'
          : statusSol === 'em_analise' ? '🔄 Em análise pelo gerente'
          : '⏳ Aguardando aprovação';
        html += '<div style="padding:10px 14px;background:#fef3c7;border-bottom:1px solid #fde68a;font-size:12px;color:#b45309;font-weight:600">'+labelStatus+' — itens solicitados:</div>';
        html += '<table>';
        html += '<tr><th>Item</th><th style="text-align:right">Qtd solicitada</th><th style="text-align:right">Qtd sugerida</th><th>Situação</th></tr>';
        itensSol.forEach(function(it) {
          const sit = it.situacao || 'pendente';
          const sitCor = sit === 'aprovado' ? '#16a34a' : sit === 'recusado' ? '#ef4444' : '#d97706';
          const sitLabel = sit === 'aprovado' ? '✅ Aprovado' : sit === 'recusado' ? '❌ Recusado' : '⏳ Pendente';
          html += '<tr>';
          html += '<td><div>'+it.descricao+'</div><div class="mono" style="color:#94a3b8">'+it.codigo+'</div></td>';
          html += '<td style="text-align:right;font-family:ui-monospace,monospace;font-weight:700">'+(it.quantidade||0)+'</td>';
          html += '<td style="text-align:right;font-family:ui-monospace,monospace;color:#64748b">'+(it.qtd_sugerida||'—')+'</td>';
          html += '<td><span style="font-size:11.5px;font-weight:600;color:'+sitCor+'">'+sitLabel+'</span></td>';
          html += '</tr>';
        });
        html += '</table>';
      } else {
        html += '<div class="vazio" style="padding:16px">SC ainda não gerada — aguardando aprovação.</div>';
      }
    } else if (!itens.length) {
      html += '<div class="vazio" style="padding:16px">Nenhum item encontrado no Protheus para SC '+sc+'.</div>';
    } else {
      if (valorTotal > 0) {
        html += '<div style="padding:10px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;gap:16px;font-size:12px;flex-wrap:wrap">';
        html += '<span>📦 <strong>'+total+'</strong> iten(s)</span>';
        html += '<span>✅ <strong>'+recebidos+'</strong> recebido(s)</span>';
        html += '<span>💰 <strong>'+fmtBRL(valorTotal)+'</strong></span>';
        if (dtEntregaMaisRecente) html += '<span>📅 Entrega: <strong>'+fmtData8(dtEntregaMaisRecente)+'</strong></span>';
        html += '</div>';
      }
      html += '<table>';
      html += '<tr><th>Item</th><th>Nº PC</th><th style="text-align:right">Qtd</th><th style="text-align:right">Valor</th><th>Status</th><th>Comprador</th><th>Entrega</th></tr>';
      itens.forEach(function(it) {
        html += '<tr>';
        html += '<td><div>'+it.c1_descri+'</div><div class="mono" style="color:#94a3b8">'+it.c1_produto+'</div></td>';
        html += '<td class="mono">'+(it.pc_numero||'—')+'</td>';
        html += '<td style="text-align:right;font-family:ui-monospace,monospace">'+(it.c1_quant||0)+'</td>';
        html += '<td style="text-align:right">'+(Number(it.pc_total)>0?fmtBRL(it.pc_total):'—')+'</td>';
        html += '<td>'+pcStatusBadge(it.pc_status)+'</td>';
        html += '<td style="font-size:11.5px;color:#475569">'+(it.pc_comprador||'—')+'</td>';
        html += '<td class="mono" style="white-space:nowrap">'+fmtData8(it.pc_dt_entrega)+(it.pc_dt_entrega?slaBadge(it.pc_dt_entrega):'')+'</td>';
        html += '</tr>';
      });
      html += '</table>';
    }
    html += '</div></div>';
  });

  resEl.innerHTML = html;
}

// Restaurar última busca
window.addEventListener('load', function() {
  const mat = localStorage.getItem('ressuprimento_matricula');
  const cod = localStorage.getItem('ressuprimento_codigo');
  if (mat) document.getElementById('matricula').value = mat;
  if (cod) document.getElementById('codigo').value = cod;
});

// Salvar última busca
document.getElementById('matricula').addEventListener('change', function() {
  localStorage.setItem('ressuprimento_matricula', this.value);
});
document.getElementById('codigo').addEventListener('change', function() {
  localStorage.setItem('ressuprimento_codigo', this.value);
});
</script>
</body>
</html>
