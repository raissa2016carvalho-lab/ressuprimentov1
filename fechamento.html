<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fechamento de Consumo — B&Q</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;
  --surface:#ffffff;
  --surface2:#f1f5f9;
  --border:#e2e8f0;
  --text:#0f172a;
  --text2:#475569;
  --text3:#94a3b8;
  --primary:#6366f1;
  --primary-dark:#4f46e5;
  --primary-light:#eef2ff;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --accent:#8b5cf6;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
.header{
  background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e1b4b 100%);
  color:#fff;padding:0 28px;height:60px;
  display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 20px rgba(99,102,241,.25);
}
.header-title{font-size:15px;font-weight:700;letter-spacing:-.3px;color:#fff}
.header-sub{font-size:11px;color:#a5b4fc}
.btn-voltar{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#c7d2fe;padding:7px 14px;border-radius:8px;font-size:12px;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s;
  backdrop-filter:blur(4px);
}
.btn-voltar:hover{background:rgba(255,255,255,.2);color:#fff}
.btn-excel{
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;border:none;border-radius:8px;padding:8px 16px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.2s;
  box-shadow:0 2px 8px rgba(16,185,129,.3);
}
.btn-excel:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.4)}

/* FILTROS */
.filtros{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 28px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.f-group{display:flex;flex-direction:column;gap:4px}
.f-group label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.f-group select,.f-group input{
  border:1.5px solid var(--border);border-radius:8px;
  padding:7px 12px;font-size:13px;background:var(--bg);
  color:var(--text);min-width:140px;transition:.2s;
  font-family:inherit;
}
.f-group select:focus,.f-group input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,102,241,.1);
}
.btn-aplicar{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;border:none;border-radius:8px;padding:8px 18px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.2s;
  box-shadow:0 2px 8px rgba(99,102,241,.3);font-family:inherit;
}
.btn-aplicar:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.4)}

/* ABAS */
.abas{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 28px;display:flex;gap:2px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.aba-btn{
  border:none;background:none;padding:14px 16px;
  font-size:12.5px;font-weight:500;color:var(--text3);
  cursor:pointer;border-bottom:2.5px solid transparent;
  transition:.2s;font-family:inherit;border-radius:4px 4px 0 0;
}
.aba-btn.ativa{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;background:var(--primary-light)}
.aba-btn:hover:not(.ativa){color:var(--text2);background:var(--surface2)}

/* CONTENT */
.content{padding:24px 28px;max-width:1700px;margin:0 auto}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi{
  background:var(--surface);border-radius:16px;padding:20px;
  border:1px solid var(--border);
  box-shadow:0 1px 4px rgba(0,0,0,.05);
  transition:.2s;position:relative;overflow:hidden;
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.kpi-valor{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.5px}
.kpi-label{font-size:12px;color:var(--text2);margin-top:6px;font-weight:500}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:2px}
.kpi.vermelho::before{background:linear-gradient(90deg,#ef4444,#f97316)}
.kpi.vermelho .kpi-valor{color:#dc2626}
.kpi.amarelo::before{background:linear-gradient(90deg,#f59e0b,#fcd34d)}
.kpi.amarelo .kpi-valor{color:#d97706}
.kpi.verde::before{background:linear-gradient(90deg,#10b981,#34d399)}
.kpi.verde .kpi-valor{color:#059669}
.kpi.azul::before{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.kpi.azul .kpi-valor{color:#6366f1}

/* CARDS */
.card{
  background:var(--surface);border-radius:16px;
  border:1px solid var(--border);overflow:hidden;margin-bottom:20px;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.card-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,#fafbff,#f8fafc);
}
.card-title{font-size:14px;font-weight:700;color:var(--text)}
.card-sub{font-size:12px;color:var(--text3)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  padding:11px 14px;text-align:left;font-size:10.5px;font-weight:700;
  color:var(--text3);text-transform:uppercase;letter-spacing:.6px;
  background:var(--surface2);border-bottom:1px solid var(--border);
}
td{padding:10px 14px;border-bottom:1px solid #f8fafc;color:var(--text)}
tr:hover td{background:#fafbff}
tr:last-child td{border-bottom:none}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--text3)}
.spinner{
  width:24px;height:24px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* PROGRESSO */
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:2px;transition:width .3s}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-verde{background:#dcfce7;color:#166534}
.badge-azul{background:var(--primary-light);color:var(--primary-dark)}
.badge-vermelho{background:#fee2e2;color:#991b1b}
.badge-amarelo{background:#fef9c3;color:#854d0e}

/* VAZIO */
.vazio{text-align:center;padding:60px 20px;color:var(--text3)}
.vazio-icon{font-size:48px;margin-bottom:12px;opacity:.5}

/* GRID GRAFICOS */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}

/* MODAL */
#modal-zero-content{padding:20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-box{background:#fff;border-radius:20px;padding:28px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.2)}

/* SYNC BADGE */
#sync-badge{font-size:10px;color:#a5b4fc;align-self:flex-end;margin-left:auto;margin-right:8px;text-align:right;line-height:1.4}

/* GRAFICOS SIDE BY SIDE */
.graficos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.grafico-card{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.grafico-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px}
.grafico-wrap{position:relative;height:260px}
@media(max-width:900px){.graficos{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <button class="btn-voltar" onclick="history.back()">← Voltar</button>
  <div>
    <div class="header-title">📦 Fechamento de Consumo</div>
    <div class="header-sub" id="sub-header">Carregando...</div>
  </div>
  <div id="sync-badge" style="font-size:10px;color:#94a3b8;align-self:flex-end;margin-left:auto;margin-right:8px;text-align:right;line-height:1.4"></div>
  <div style="display:flex;gap:8px">
    <button class="btn-excel" onclick="exportarExcel()">⬇ Excel</button>
  </div>
</div>

<!-- FILTROS -->
<div class="filtros">
  <div class="f-group">
    <label>Filial</label>
    <select id="f-filial">
      <option value="">Todas as filiais</option>
      <option value="01">01 — Matriz</option>

      <option value="14">14 — Ribeira do Pombal</option>
      <option value="15">15 — Paulo Afonso</option>
      <option value="22">22 — Goiania</option>
      <option value="23">23 — Baturite</option>
      <option value="24">24 — Morrinhos</option>
      <option value="25">25 — Cascavel</option>
      <option value="27">27 — Caucaia</option>
      <option value="29">29 — Horizonte</option>

    <label>Centro de Custo</label>
    <select id="f-cc"><option value="">Todos os CCs</option></select>

    <label>Período</label>
    <select id="f-periodo" onchange="atualizarMeses()">
      <option value="2026">2026</option>

    <select id="f-custo-zero">

    <label>Buscar</label>
    <input type="text" id="f-busca" placeholder="Código ou descrição...">

</div>

<!-- ABAS -->
<div class="abas">
  <button class="aba-btn ativa" onclick="irParaAba('resumo',this)">📊 Fechamento</button>
  <button class="aba-btn" onclick="irParaAba('por-cc',this)">👥 Por CC</button>
  <button class="aba-btn" onclick="irParaAba('mensal',this)">📅 Mensal</button>
  <button class="aba-btn" onclick="irParaAba('custo-zero',this)">⚠️ Custo Zero</button>
  <button class="aba-btn" onclick="irParaAba('analise',this)">🔍 Análise</button>
  <button class="aba-btn" onclick="irParaAba('auditoria',this)">🧮 Auditoria</button>
  <button class="aba-btn" onclick="irParaAba('devolucoes',this)">↩️ Devoluções</button>
  <button class="aba-btn" onclick="irParaAba('comparativo',this)">🤝 Comparativo</button>
</div>

<!-- CONTENT -->
<div class="content" id="content">
  <div class="loading"><span class="spinner"></span>Carregando dados...</div>
</div>

<script>
const SUPABASE_URL='https://eugefrjckrxisfpizkjb.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Z2Vmcmpja3J4aXNmcGl6a2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzEzNjksImV4cCI6MjEwNDAwNzM2OX0.sNQjKjlUm1TWeiDGG2SDeER7GGaf4PucofJWNKxqygI';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let _dados=[], _filtrados=[], _abaAtual='resumo', _ccMap={};
let _chartMes=null, _chartGrupo=null, _chartFilial=null, _chartDev=null;
let _devResumoCache=null; // cache de devoluções por mês para aba Fechamento

const FNOMES={'01':'Matriz','03':'Pau dos Ferros','04':'Itapipoca','06':'Currais Novos','07':'Sobral','08':'Aparecida de Goiânia','09':'Maracanau','10':'Mossoro','11':'Anapolis','13':'Alagoinhas','14':'Ribeira do Pombal','15':'Paulo Afonso','22':'Goiania','23':'Baturite','24':'Morrinhos','25':'Cascavel','27':'Caucaia','29':'Horizonte','34':'Senhor do Bonfim','36':'Luziania','37':'Divinopolis','40':'Garanhuns','41':'Floriano','42':'Livramento','43':'Hortolandia','44':'Brumado'};

function fmtVal(v){return'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtQtd(v){return(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2})}
function fmtMes(m){const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return meses[Number(m.slice(4,6))-1]+'/'+m.slice(2,4)}

async function carregar(){
  const cacheKey='consumo_resumo_v1';
  const cacheTS='consumo_resumo_ts';
  const CACHE_HORAS=4;

  document.getElementById('content').innerHTML='<div class="loading"><span class="spinner"></span>Carregando...</div>';

  function setProgresso(pct,msg){
    document.getElementById('content').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:20px">
      <div style="font-size:13px;color:#64748b;font-weight:500">${msg}</div>
      <div style="width:380px;background:#e2e8f0;border-radius:999px;height:10px;overflow:hidden">
        <div style="height:100%;border-radius:999px;background:linear-gradient(90deg,#1e40af,#3b82f6);width:${pct}%;transition:width .4s ease"></div>
      </div>
      <div style="font-size:22px;font-weight:800;color:#1e40af">${pct}%</div>
      <div style="font-size:11px;color:#94a3b8">Aguarde, carregando dados...</div>
    </div>`;
  }

  setProgresso(5,'Conectando...');
  const{data:ccs}=await db.from('centros_custo').select('cc,nome');
  (ccs||[]).forEach(c=>{_ccMap[c.cc]=c.nome});

  const cacheStr=localStorage.getItem(cacheKey);
  const cacheTSVal=localStorage.getItem(cacheTS);
  const agora=Date.now();
  const cacheValido=cacheStr&&cacheTSVal&&(agora-Number(cacheTSVal))<CACHE_HORAS*3600*1000;

  if(cacheValido&&cacheStr){
    try{
      const cached=JSON.parse(cacheStr);
      _dados=cached;
      const tsDate=new Date(Number(cacheTSVal));
      const tsStr=` • Cache ${tsDate.toLocaleDateString('pt-BR')} ${tsDate.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
      const mesesUniq=[...new Set(cached.map(r=>r.mes))];
      document.getElementById('sub-header').textContent=`${cached.length.toLocaleString('pt-BR')} registros • ${mesesUniq.length} meses${tsStr}`;
      popularSelects(cached);
      atualizarMeses();
      await carregarJustificativas();
      aplicarFiltros();
      return;
    }catch(e){localStorage.removeItem(cacheKey);}
  }

  setProgresso(15,'Verificando última sincronização...');
  let ultimoSync='';
  // Badge de sync
  db.from('sync_log').select('atualizado_em').eq('chave','consumo_scp').maybeSingle().then(({data:log})=>{
    if(log?.atualizado_em){
      const d=new Date(log.atualizado_em);
      const b=document.getElementById('sync-badge');
      if(b) b.innerHTML=`🔄 Atualizado<br>${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
    }
  });
  try{
    const{data:log}=await db.from('sync_log').select('atualizado_em,total').eq('chave','consumo_scp').maybeSingle();
    if(log?.atualizado_em){
      const d=new Date(log.atualizado_em);
      ultimoSync=` • Sync ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
    }
  }catch(e){}

  // Carregar resumo agregado (~8000 linhas, ~8 requests de 1000)
  let todos=[],off=0;
  for(;;){
    const pct=Math.min(88,25+Math.round((off/8000)*63));
    setProgresso(pct,`Carregando... ${todos.length.toLocaleString('pt-BR')} registros`);
    const{data,error}=await db
      .from('consumo_scp_resumo')
      .select('filial,cc,mes,grupo,motivo,valor_total,quantidade,custo_zero_count,ycustd_zero_count')
      .order('id')
      .range(off,off+999);
    if(error||!data||!data.length)break;
    todos=todos.concat(data);
    off+=data.length;
    if(data.length<1000&&off%1000!==0)continue;
  }

  _dados=todos.map(r=>({
    filial:           r.filial,
    cc:               r.cc,
    mes:              r.mes,
    grupo:            r.grupo,
    motivo:           r.motivo,
    valor_total:      Number(r.valor_total)||0,
    quantidade:       Number(r.quantidade)||0,
    custo_zero:       (r.ycustd_zero_count||0)>0,
    custo_zero_count: r.ycustd_zero_count||0,
    produto:'', descricao:'', custo_unit:0,
  }));

  setProgresso(93,'Salvando cache...');
  try{
    localStorage.setItem(cacheKey,JSON.stringify(_dados));
    localStorage.setItem(cacheTS,String(Date.now()));
  }catch(e){console.warn('Cache:',e);}

  setProgresso(98,'Preparando visualização...');
  const mesesUniq=[...new Set(_dados.map(r=>r.mes))];
  document.getElementById('sub-header').textContent=`${_dados.length.toLocaleString('pt-BR')} registros • ${mesesUniq.length} meses${ultimoSync}`;
  popularSelects(_dados);
  atualizarMeses();
  await carregarJustificativas();
  setProgresso(100,'Pronto! ✅');
  setTimeout(()=>aplicarFiltros(),300);
}


function _expandirCache(compacto){
  // Expande chaves compactas de volta ao formato normal
  if(!compacto||!compacto.length)return[];
  if(compacto[0].filial!==undefined)return compacto; // já expandido
  return compacto.map(r=>({
    filial:r.f,produto:r.p,descricao:r.d,grupo:r.g,cc:r.c,
    mes:r.m,quantidade:r.q,custo_unit:r.cu,valor_total:r.v,
    custo_zero:r.z,motivo:r.mo
  }));
}

function popularSelects(todos){
  const grupos=[...new Set(todos.map(r=>r.grupo).filter(Boolean))].sort();
  const selGrupo=document.getElementById('f-grupo');
  selGrupo.innerHTML='<option value="">Todos os grupos</option>'+grupos.map(g=>`<option value="${g}">${g}</option>`).join('');

  const ccsUniq=[...new Set(todos.map(r=>r.cc).filter(Boolean))].sort();
  const selCC=document.getElementById('f-cc');
  selCC.innerHTML='<option value="">Todos os CCs</option>'+ccsUniq.map(c=>`<option value="${c}">${c}${_ccMap[c]?' — '+_ccMap[c]:''}</option>`).join('');
}

function atualizarMeses(){
  const periodo=document.getElementById('f-periodo').value;
  const ano=periodo==='todos'?null:periodo;
  const mesesDisp=[...new Set(_dados.filter(r=>!ano||r.mes.startsWith(ano)).map(r=>r.mes))].sort();
  const MNOMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const selMes=document.getElementById('f-mes');
  selMes.innerHTML='<option value="">Todos os meses</option>'+mesesDisp.map(m=>{
    const num=Number(m.slice(4,6))-1;
    const label=MNOMES[num]+'/'+m.slice(0,4);
    return`<option value="${m}">${label}</option>`;
  }).join('');
}

function aplicarFiltros(){
  const filial=document.getElementById('f-filial').value;
  const grupo=document.getElementById('f-grupo').value;
  const cc=document.getElementById('f-cc').value;
  const periodo=document.getElementById('f-periodo').value;
  const mes=document.getElementById('f-mes').value;
  const custoZero=document.getElementById('f-custo-zero').value;
  const busca=(document.getElementById('f-busca').value||'').toLowerCase().trim();

  _devResumoCache=null; // invalidar cache de devoluções ao refiltrar
  _filtrados=_dados.filter(r=>{
    if(filial&&r.filial!==filial)return false;
    if(grupo&&r.grupo!==grupo)return false;
    if(cc&&r.cc!==cc)return false;
    if(mes&&r.mes!==mes)return false;
    else if(!mes&&periodo==='2026'&&!r.mes.startsWith('2026'))return false;
    else if(!mes&&periodo==='2025'&&!r.mes.startsWith('2025'))return false;
    if(custoZero==='sim'&&!r.custo_zero)return false;
    if(custoZero==='nao'&&r.custo_zero)return false;
    if(busca&&!(r.produto?.toLowerCase().includes(busca)||r.descricao?.toLowerCase().includes(busca)))return false;
    return true;
  });

  renderAba(_abaAtual);
}

function irParaAba(aba,btn){
  _abaAtual=aba;
  document.querySelectorAll('.aba-btn').forEach(b=>b.classList.remove('ativa'));
  btn.classList.add('ativa');
  renderAba(aba);
}

function renderAba(aba){
  if(aba==='resumo')renderResumo();
  else if(aba==='por-grupo')renderPorGrupo();
  else if(aba==='por-filial')renderPorFilial();
  else if(aba==='por-cc')renderPorCC();
  else if(aba==='mensal')renderMensal();
  else if(aba==='custo-zero')renderCustoZero();
  else if(aba==='itens')renderItens();
  else if(aba==='analise')renderAnalise();
  else if(aba==='auditoria')renderAuditoria();
  else if(aba==='devolucoes')renderDevolucoes();
  else if(aba==='comparativo')renderComparativo();
}

function kpisHTML(){
  const totalVal=_filtrados.reduce((a,r)=>a+(r.valor_total||0),0);
  const totalQtd=_filtrados.reduce((a,r)=>a+(r.quantidade||0),0);
  const custoZeroCount=_filtrados.filter(r=>r.custo_zero).length;
  const custoZeroVal=_filtrados.filter(r=>r.custo_zero).reduce((a,r)=>a+(r.quantidade||0),0);
  const itensUniq=new Set(_filtrados.map(r=>r.produto)).size;
  const mesesUniq=[...new Set(_filtrados.map(r=>r.mes))].sort();
  const mediaM=mesesUniq.length>0?totalVal/mesesUniq.length:0;
  return `<div class="kpis">
    <div class="kpi azul"><div class="kpi-valor">${fmtVal(totalVal)}</div><div class="kpi-label">Valor total consumido</div><div class="kpi-sub">${mesesUniq.length} meses</div></div>

    <div class="kpi ${custoZeroCount>0?'vermelho':'verde'}"><div class="kpi-valor">${custoZeroCount.toLocaleString('pt-BR')}</div><div class="kpi-label">Registros custo zero</div><div class="kpi-sub">${fmtQtd(custoZeroVal)} unidades sem custo</div></div>
  </div>`;
}

async function renderResumo(){
  const meses=[...new Set(_filtrados.map(r=>r.mes))].sort();

  // Detectar se valor está todo zerado → usar quantidade como fallback
  const totalValCheck=_filtrados.reduce((a,r)=>a+(r.valor_total||0),0);
  const semValor=totalValCheck===0;
  const metrica=r=>semValor?(r.quantidade||0):(r.valor_total||0);
  const fmtMetrica=v=>semValor?fmtQtd(v):fmtVal(v);
  const labelMetrica=semValor?'Quantidade':'Valor (R$)';

  const valPorMes=meses.map(m=>_filtrados.filter(r=>r.mes===m).reduce((a,r)=>a+metrica(r),0));

  // ── Buscar devoluções (mov_sd3_001) para o gráfico lado a lado ──
  const filialFiltro=document.getElementById('f-filial')?.value||'';
  const ccFiltro=document.getElementById('f-cc')?.value||'';
  if(!_devResumoCache){
    try{
      // Paginar: Supabase limita a 1000 linhas por request
      let todos=[],off=0;
      for(;;){
        let q=db.from('mov_sd3_001').select('mes,valor_total,quantidade,filial,cc').order('id').range(off,off+999);
        if(filialFiltro) q=q.eq('filial',filialFiltro);
        if(ccFiltro) q=q.eq('cc',ccFiltro);
        const{data,error}=await q;
        if(error||!data||!data.length)break;
        todos=todos.concat(data);
        if(data.length<1000)break;
        off+=data.length;
      }
      _devResumoCache=todos;
    }catch(e){_devResumoCache=[];}
  }
  let devFilt=_devResumoCache;
  if(filialFiltro) devFilt=devFilt.filter(r=>r.filial===filialFiltro);
  if(ccFiltro) devFilt=devFilt.filter(r=>r.cc===ccFiltro);
  const devPorMes=meses.map(m=>devFilt.filter(r=>r.mes===m).reduce((a,r)=>a+(semValor?(r.quantidade||0):(r.valor_total||0)),0));
  const totalDev=devPorMes.reduce((a,v)=>a+v,0);

  // Top grupos
  const grupoMap={};
  _filtrados.forEach(r=>{const g=r.grupo||'SEM GRUPO';grupoMap[g]=(grupoMap[g]||0)+metrica(r);});
  const topGrupos=Object.entries(grupoMap).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Top filiais
  const filialMap={};
  _filtrados.forEach(r=>{filialMap[r.filial]=(filialMap[r.filial]||0)+metrica(r);});
  const topFiliais=Object.entries(filialMap).sort((a,b)=>b[1]-a[1]).slice(0,10);

  const avisoValor=semValor?`<div style="background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <span style="font-size:18px">⚠️</span>
    <div><strong style="font-size:13px;color:#92400e">Custo não disponível nos dados</strong>
    <span style="font-size:12px;color:#b45309;display:block">Os campos custo_unit e valor_total estão zerados na tabela consumo_scp. Verifique o sync_consumo_scp.py (campo CP_VUNIT do Protheus). Os gráficos abaixo mostram <strong>quantidade</strong> como alternativa.</span></div>
  </div>`:'';

  const content=document.getElementById('content');
  content.innerHTML=kpisHTML()+avisoValor+`
  <div class="graficos">
    <div class="grafico-card">
      <div class="grafico-title">📅 Consumo mensal (${labelMetrica})</div>
      <div class="grafico-wrap"><canvas id="chart-mes"></canvas></div>
    </div>
    <div class="grafico-card">
      <div class="grafico-title">↩️ Devoluções mensal (${labelMetrica})</div>
      <div class="grafico-wrap"><canvas id="chart-dev"></canvas></div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px;text-align:right">Total: <strong style="color:var(--text)">${fmtMetrica(totalDev)}</strong></div>
    </div>
  </div>
  <div class="graficos">
    <div class="grafico-card">
      <div class="grafico-title">🏷️ Top grupos por ${semValor?'quantidade':'valor'}</div>
      <div class="grafico-wrap" style="max-height:260px;position:relative"><canvas id="chart-grupo" style="max-height:260px"></canvas></div>
    </div>
    <div class="grafico-card">
      <div class="grafico-title">🏢 Consumo por filial (${labelMetrica})</div>
      <div class="grafico-wrap"><canvas id="chart-filial"></canvas></div>
    </div>
  </div>
  <div class="graficos">
    <div class="grafico-card">
      <div class="grafico-title">⚠️ Alertas de custo zero por mês</div>
      <div class="grafico-wrap"><canvas id="chart-zero"></canvas></div>
    </div>
    <div class="grafico-card" style="display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px">
      <!-- espaço reservado para futuro indicador -->
    </div>
  </div>`;

  setTimeout(()=>{
    // Plugin de rótulos inline (Chart.js nativo via afterDraw)
    const labelPlugin={
      id:'barLabels',
      afterDatasetsDraw(chart){
        const{ctx}=chart;
        ctx.save();
        chart.data.datasets.forEach((ds,di)=>{
          chart.getDatasetMeta(di).data.forEach((bar,i)=>{
            const val=ds.data[i];
            if(!val)return;
            const txt=ds._labelFmt?ds._labelFmt(val):val.toLocaleString('pt-BR');
            ctx.font='bold 11px Inter,system-ui,sans-serif';
            ctx.fillStyle='#1e293b';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            if(chart.config.options?.indexAxis==='y'){
              ctx.textAlign='left';
              ctx.fillText(txt, bar.x+5, bar.y);
            } else {
              ctx.fillText(txt, bar.x, bar.y-8);
            }
          });
        });
        ctx.restore();
      }
    };

    // Gráfico CONSUMO mensal
    const ctxM=document.getElementById('chart-mes').getContext('2d');
    if(_chartMes)_chartMes.destroy();
    _chartMes=new Chart(ctxM,{type:'bar',data:{labels:meses.map(fmtMes),datasets:[{label:labelMetrica,data:valPorMes,backgroundColor:'#3b82f6',borderRadius:4,_labelFmt:fmtMetrica}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmtMetrica(v)}}}},plugins:[labelPlugin]});

    // Gráfico DEVOLUÇÕES mensal (lado a lado com consumo)
    const ctxD=document.getElementById('chart-dev').getContext('2d');
    if(_chartDev)_chartDev.destroy();
    _chartDev=new Chart(ctxD,{type:'bar',data:{labels:meses.map(fmtMes),datasets:[{label:labelMetrica,data:devPorMes,backgroundColor:'#10b981',borderRadius:4,_labelFmt:fmtMetrica}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmtMetrica(v)}}}},plugins:[labelPlugin]});

    // Gráfico grupos (doughnut)
    const ctxG=document.getElementById('chart-grupo').getContext('2d');
    const totalGrupos=topGrupos.reduce((a,g)=>a+g[1],0);
    new Chart(ctxG,{type:'doughnut',data:{labels:topGrupos.map(g=>g[0].slice(0,25)),datasets:[{data:topGrupos.map(g=>g[1]),backgroundColor:['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#ec4899']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:12}},tooltip:{callbacks:{label:ctx=>{const pct=totalGrupos>0?((ctx.raw/totalGrupos)*100).toFixed(1)+'%':'';return ctx.label+': '+fmtMetrica(ctx.raw)+' ('+pct+')';}}}}}});

    // Gráfico filiais (horizontal)
    const ctxF=document.getElementById('chart-filial').getContext('2d');
    new Chart(ctxF,{type:'bar',data:{labels:topFiliais.map(f=>FNOMES[f[0]]||f[0]),datasets:[{label:labelMetrica,data:topFiliais.map(f=>f[1]),backgroundColor:'#10b981',borderRadius:4,_labelFmt:fmtMetrica}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{right:120}},indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>fmtMetrica(v)}}}},plugins:[labelPlugin]});

    // Gráfico custo zero
    const zeroPorMes=meses.map(m=>_filtrados.filter(r=>r.mes===m&&r.custo_zero).length);
    const ctxZ=document.getElementById('chart-zero').getContext('2d');
    new Chart(ctxZ,{type:'bar',data:{labels:meses.map(fmtMes),datasets:[{label:'Registros',data:zeroPorMes,backgroundColor:'#ef4444',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},plugins:{legend:{display:false}}},plugins:[labelPlugin]});
  },100);
}

function _semValorGlobal(){return _filtrados.reduce((a,r)=>a+(r.valor_total||0),0)===0;}

function renderPorGrupo(){

    grupoMap[g].qtd+=r.quantidade||0;
    grupoMap[g].valor+=r.valor_total||0;
    if(r.custo_zero)grupoMap[g].zero++;
    grupoMap[g].itens.add(r.produto);
  });
  const lista=Object.values(grupoMap).sort((a,b)=>semV?(b.qtd-a.qtd):(b.valor-a.valor));

function renderMensal(){
  const semV=_semValorGlobal();
  const metrica=r=>semV?(r.quantidade||0):(r.valor_total||0);
  const fmtM=v=>semV?fmtQtd(v):fmtVal(v);
  const meses=[...new Set(_filtrados.map(r=>r.mes))].sort();
  const grupos=[...new Set(_filtrados.map(r=>r.grupo||'SEM GRUPO'))].sort();

  const cross={};
  _filtrados.forEach(r=>{
    const g=r.grupo||'SEM GRUPO';
    if(!cross[g])cross[g]={};
    cross[g][r.mes]=(cross[g][r.mes]||0)+metrica(r);
  });

  const totalPorMes={};
  meses.forEach(m=>{totalPorMes[m]=grupos.reduce((a,g)=>a+(cross[g]?.[m]||0),0);});

  function seta(atual, anterior){
    if(!anterior||anterior===0)return'';
    const pct=((atual-anterior)/anterior*100);
    if(Math.abs(pct)<1)return`<span style="color:#94a3b8;font-size:10px"> ➡ ${pct.toFixed(0)}%</span>`;
    if(pct>0)return`<span style="color:#dc2626;font-size:10px;font-weight:700"> ▲ ${pct.toFixed(0)}%</span>`;
    return`<span style="color:#16a34a;font-size:10px;font-weight:700"> ▼ ${Math.abs(pct).toFixed(0)}%</span>`;
  }

  document.getElementById('content').innerHTML=kpisHTML()+`
  <div class="card">
    <div class="card-header"><div class="card-title">Consumo Mensal por Grupo (${semV?'Qtd':'R$'})</div><div class="card-sub">${meses.length} meses × ${grupos.length} grupos</div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Grupo</th>${meses.map((m,i)=>`<th class="num">${fmtMes(m)}</th>`).join('')}<th class="num" style="background:#e0e7ff">Total</th></tr></thead>
      <tbody>
        ${grupos.map(g=>{
          const totalG=meses.reduce((a,m)=>a+(cross[g]?.[m]||0),0);
          return`<tr>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${g}</td>
            ${meses.map((m,i)=>{
              const v=cross[g]?.[m]||0;
              const vant=i>0?cross[g]?.[meses[i-1]]||0:null;
              return`<td class="num" style="color:${v>0?'#1e293b':'#cbd5e1'}">${v>0?fmtM(v)+''+seta(v,vant):'—'}</td>`;
            }).join('')}
            <td class="num" style="font-weight:700;background:#f0f4ff">${fmtM(totalG)}</td>
          </tr>`;
        }).join('')}
        <tr style="background:#f0f4ff;font-weight:700">
          <td>TOTAL</td>
          ${meses.map((m,i)=>{
            const v=totalPorMes[m];
            const vant=i>0?totalPorMes[meses[i-1]]:null;
            return`<td class="num">${fmtM(v)}${seta(v,vant)}</td>`;
          }).join('')}
          <td class="num">${fmtM(meses.reduce((a,m)=>a+totalPorMes[m],0))}</td>
        </tr>
      </tbody>
    </table></div>
  </div>`;
}

function renderCustoZero(){
  const zeros=_filtrados.filter(r=>r.custo_zero && (r.mes||'')>='202501');
  const meses=[...new Set(zeros.map(r=>r.mes))].sort();
  const filiais=[...new Set(zeros.map(r=>r.filial))].sort();

  if(!zeros.length){
    document.getElementById('content').innerHTML='<div class="loading">Nenhum item com custo zero encontrado.</div>';
    return;
  }

  // Agrupa por filial+mes → lista de itens
  const cross={};
  zeros.forEach(r=>{
    if(!cross[r.filial])cross[r.filial]={};
    if(!cross[r.filial][r.mes])cross[r.filial][r.mes]=[];
    cross[r.filial][r.mes].push(r);
  });

  const totalPorMes={};
  meses.forEach(m=>{totalPorMes[m]=filiais.reduce((a,f)=>a+(cross[f]?.[m]?.length||0),0);});
  const totalGeral=zeros.length;

  const rows=filiais.map(f=>{
    const totalF=meses.reduce((a,m)=>a+(cross[f]?.[m]?.length||0),0);
    if(!totalF)return'';
    return`<tr>
      <td><strong>${f}</strong></td>
      <td>${FNOMES[f]||'—'}</td>
      ${meses.map(m=>{
        const itens=cross[f]?.[m]||[];
        if(!itens.length)return`<td class="num" style="color:#cbd5e1">—</td>`;
        return`<td class="num">
          <button onclick="abrirDrilldown('${f}','${m}')" style="background:#fef3c7;border:1px solid #f59e0b;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:700;color:#92400e;cursor:pointer">
            ${itens.length}
          </button>
        </td>`;
      }).join('')}
      <td class="num" style="font-weight:700;background:#fef9c3">${totalF}</td>
    </tr>`;
  }).join('');

  const totalGeral2=meses.reduce((a,m)=>a+totalPorMes[m],0);

  document.getElementById('content').innerHTML=`
  <div class="alerta-banner" style="margin-bottom:14px">
    <span class="icon">⚠️</span>
    <div><strong>${zeros.length.toLocaleString('pt-BR')} registros com custo zero</strong>
    <span style="display:block;font-size:12px;color:#b45309">${new Set(zeros.map(r=>r.produto)).size} itens distintos • Clique nos números para ver o detalhe</span></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title">⚠️ Itens com Custo Zero — Filial × Mês</div>
      <div class="card-sub">Quantidade de registros zerados por filial e mês</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Fil.</th><th>Nome</th>
        ${meses.map(m=>`<th class="num">${fmtMes(m)}</th>`).join('')}
        <th class="num" style="background:#fef9c3">Total</th>
      </tr></thead>
      <tbody>
        ${rows}
        <tr style="background:#fef9c3;font-weight:700">
          <td colspan="2">TOTAL</td>
          ${meses.map(m=>`<td class="num">${totalPorMes[m]||'—'}</td>`).join('')}
          <td class="num">${totalGeral2}</td>
        </tr>
      </tbody>
    </table></div>
  </div>

  <!-- Modal drilldown -->
  <div id="modal-zero" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;overflow-y:auto">
    <div style="background:#fff;border-radius:12px;max-width:900px;margin:40px auto;padding:24px;position:relative">
      <button onclick="document.getElementById('modal-zero').style.display='none'"
        style="position:absolute;top:12px;right:16px;background:#f1f5f9;border:none;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer">✕ Fechar</button>
      <div id="modal-zero-content"></div>
    </div>
  </div>`;

  // Guarda referência para o drilldown
  window._zeroCross=cross;
  window._zeroMeses=meses;
}

let _justificativas={};

async function carregarJustificativas(){
  try{
    const{data}=await db.from('justificativas_consumo').select('*');
    (data||[]).forEach(j=>{_justificativas[j.chave]=j;});
  }catch(e){}
}

async function salvarJustificativa(chave,texto,btnEl,spanEl){
  const partes=chave.split('|');
  const rec={chave,cc:partes[0],mes:partes[1],texto,atualizado_em:new Date().toISOString()};
  try{
    await db.from('justificativas_consumo').upsert(rec,{onConflict:'chave'});
    _justificativas[chave]=rec;
    spanEl.textContent='✓ Salvo!';
    setTimeout(()=>{spanEl.textContent='';},2000);
  }catch(e){spanEl.textContent='Erro ao salvar';}
}

function renderEstouros(){
  const semV=_semValorGlobal();
  const fmt=v=>semV?fmtQtd(v):fmtVal(v);

  const meses=[...new Set(_filtrados.map(r=>r.mes))].sort();
  if(!meses.length){
    document.getElementById('analise-content').innerHTML='<div class="loading">Nenhum dado disponível com os filtros atuais.</div>';
    return;
  }
  const ultimoMes=meses[meses.length-1];
  const mesesAnt=meses.slice(0,-1);

  // Agrupa por CC + mês
  const ccMesMap={};
  _filtrados.forEach(r=>{
    const k=r.cc+'|'+r.mes;
    if(!ccMesMap[k])ccMesMap[k]={cc:r.cc,mes:r.mes,valor:0,qtd:0};
    ccMesMap[k].valor+=r.valor_total||0;
    ccMesMap[k].qtd+=r.quantidade||0;
  });

  // Agrupa por CC — calcula média dos meses anteriores e último mês
  const ccMap={};
  Object.values(ccMesMap).forEach(r=>{
    if(!ccMap[r.cc])ccMap[r.cc]={cc:r.cc,nome:_ccMap[r.cc]||'—',ultimo:0,media:0,meses:{}};
    ccMap[r.cc].meses[r.mes]=semV?r.qtd:r.valor;
    if(r.mes===ultimoMes)ccMap[r.cc].ultimo=semV?r.qtd:r.valor;
  });

  // Calcula média dos meses anteriores
  Object.values(ccMap).forEach(c=>{
    const vals=mesesAnt.map(m=>c.meses[m]||0).filter(v=>v>0);
    c.media=vals.length>0?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    c.variacao=c.media>0?((c.ultimo-c.media)/c.media*100):null;
    c.absoluto=c.ultimo-c.media;
  });

  // Ordena pelos maiores estouros absolutos no último mês
  const lista=Object.values(ccMap)
    .filter(c=>c.ultimo>0)
    .sort((a,b)=>b.absoluto-a.absoluto)
    .slice(0,50);

  const rows=lista.map((c,i)=>{
    const varPct=c.variacao!=null?c.variacao.toFixed(1)+'%':'N/A';
    const varClass=c.variacao==null?'var-neu':c.variacao>20?'var-up':c.variacao<-20?'var-down':'var-neu';
    const seta=c.variacao==null?'—':c.variacao>0?'▲':'▼';
    const chave=c.cc+'|'+ultimoMes;
    const just=_justificativas[chave];
    return`<tr>
      <td style="color:#94a3b8;font-size:11px">${i+1}</td>
      <td><strong>${c.cc}</strong></td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${c.nome}</td>
      <td class="num">${fmt(c.media||0)}</td>
      <td class="num"><strong>${fmt(c.ultimo)}</strong></td>
      <td class="num"><span class="var-badge ${varClass}">${seta} ${varPct}</span></td>
      <td class="num" style="color:${c.absoluto>0?'#dc2626':'#16a34a'}">${c.absoluto>0?'+':''}${fmt(c.absoluto)}</td>
      <td>
        <button class="just-btn" onclick="toggleJust('just-${i}')">
          ${just?'✏️ Ver/Editar':'+ Justificar'}
        </button>
        <span class="just-saved" id="saved-${i}"></span>
        <div id="just-${i}" style="display:none" class="just-box">
          <div style="font-size:11px;color:#64748b;margin-bottom:4px">Justificativa — <strong>${c.cc}</strong> / ${fmtMes(ultimoMes)}</div>
          <textarea id="txt-${i}" placeholder="Descreva o motivo do estouro...">${just?just.texto:''}</textarea>
          <button class="save-btn" onclick="salvarJust('${chave}','txt-${i}','saved-${i}')">💾 Salvar</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('analise-content').innerHTML=`
  <div class="card">
    <div class="card-header">
      <div class="card-title">🚨 Top 50 Estouros por CC — ${fmtMes(ultimoMes)} vs Média anterior</div>
      <div class="card-sub">Comparando ${fmtMes(ultimoMes)} com média de ${mesesAnt.length} meses anteriores</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>#</th><th>CC</th><th>Nome</th>
        <th class="num">Média Ant.</th>
        <th class="num">${fmtMes(ultimoMes)}</th>
        <th class="num">Variação</th>
        <th class="num">Diferença</th>
        <th>Justificativa</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderMotivo(){
  const semV=_semValorGlobal();
  const fmt=v=>semV?fmtQtd(v):fmtVal(v);
  const meses=[...new Set(_filtrados.map(r=>r.mes))].sort();

  // Por motivo agregado
  const motivoMap={};
  _filtrados.forEach(r=>{
    const m=r.motivo||'NÃO CLASSIFICADO';
    if(!motivoMap[m])motivoMap[m]={motivo:m,valor:0,qtd:0,registros:0,meses:{}};
    motivoMap[m].valor+=r.valor_total||0;
    motivoMap[m].qtd+=r.quantidade||0;
    motivoMap[m].registros++;
    motivoMap[m].meses[r.mes]=(motivoMap[m].meses[r.mes]||0)+(semV?r.quantidade:r.valor_total)||0;
  });

  const lista=Object.values(motivoMap).sort((a,b)=>semV?(b.qtd-a.qtd):(b.valor-a.valor));
  const totalGeral=lista.reduce((a,r)=>a+(semV?r.qtd:r.valor),0);
  const maxVal=lista[0]?semV?lista[0].qtd:lista[0].valor:1;

  // Cores por motivo
  const CORES={'CONSUMO':'#3b82f6','MANUTENÇÃO':'#f59e0b','DESGASTE':'#8b5cf6',
    'DEFEITO':'#ef4444','MAL USO':'#dc2626','PERDA':'#f97316','ROUBO':'#ec4899',
    'MOBILIZAÇÃO':'#06b6d4','TRANSFERÊNCIA':'#10b981','ADMISSIONAL':'#84cc16','COMPLEMENTAÇÃO':'#6366f1','NÃO CLASSIFICADO':'#94a3b8'};

  // Tabela cruzada motivo x mes
  const crossRows=lista.map(r=>{
    const ref=semV?r.qtd:r.valor;
    const pct=totalGeral>0?(ref/totalGeral*100).toFixed(1)+'%':'—';
    const cor=CORES[r.motivo]||'#94a3b8';
    const barW=Math.round((ref/maxVal)*120);
    return`<tr>
      <td>
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${cor};margin-right:6px;vertical-align:middle"></span>
        <strong>${r.motivo}</strong>
      </td>
      <td class="num">${r.registros.toLocaleString('pt-BR')}</td>
      <td class="num">${fmtQtd(r.qtd)}</td>
      <td class="num"><strong>${fmt(semV?r.qtd:r.valor)}</strong></td>
      <td class="num">${pct}</td>
      ${meses.map(m=>{const v=r.meses[m]||0;return`<td class="num" style="color:${v>0?'#1e293b':'#cbd5e1'}">${v>0?fmt(v):'—'}</td>`;}).join('')}
    </tr>`;
  }).join('');

  // Top CCs por motivo crítico (MAL USO + PERDA + ROUBO)
  const motivosCriticos=['MAL USO','PERDA','ROUBO','DEFEITO'];
  const criticos=_filtrados.filter(r=>motivosCriticos.includes(r.motivo));
  const ccCriticoMap={};
  criticos.forEach(r=>{
    const k=r.cc;
    if(!ccCriticoMap[k])ccCriticoMap[k]={cc:k,nome:_ccMap[k]||'—',valor:0,qtd:0,motivos:{}};
    ccCriticoMap[k].valor+=r.valor_total||0;
    ccCriticoMap[k].qtd+=r.quantidade||0;
    ccCriticoMap[k].motivos[r.motivo]=(ccCriticoMap[k].motivos[r.motivo]||0)+1;
  });
  const topCriticos=Object.values(ccCriticoMap).sort((a,b)=>semV?(b.qtd-a.qtd):(b.valor-a.valor)).slice(0,15);

  document.getElementById('analise-content').innerHTML=`
  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title">🏷️ Consumo por Motivo</div><div class="card-sub">${lista.length} motivos distintos</div></div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Motivo</th><th class="num">Registros</th><th class="num">Qtd Total</th>
        <th class="num">${semV?'Qtd':'Valor'} Total</th><th class="num">% do Total</th>
        ${meses.map(m=>`<th class="num">${fmtMes(m)}</th>`).join('')}
      </tr></thead>
      <tbody>${crossRows}</tbody>
    </table></div>
  </div>
  ${topCriticos.length>0?`
  <div class="card">
    <div class="card-header">
      <div class="card-title">⚠️ Top CCs com Motivos Críticos (Mal Uso / Perda / Roubo / Defeito)</div>
      <div class="card-sub">${topCriticos.length} CCs com ocorrências críticas</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>CC</th><th>Nome</th><th class="num">${semV?'Qtd':'Valor'}</th>
        ${motivosCriticos.map(m=>`<th class="num">${m}</th>`).join('')}
      </tr></thead>
      <tbody>${topCriticos.map(c=>`<tr>
        <td><strong>${c.cc}</strong></td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${c.nome}</td>
        <td class="num"><strong style="color:#dc2626">${fmt(semV?c.qtd:c.valor)}</strong></td>
        ${motivosCriticos.map(m=>`<td class="num">${c.motivos[m]?`<span class="badge-zero">${c.motivos[m]}</span>`:'—'}</td>`).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`:''}`;
}

async function renderAuditoria(){
  const content=document.getElementById('content');
  content.innerHTML='<div class="loading"><span class="spinner"></span>Carregando auditoria de custo...</div>';

  // Busca dados brutos de auditoria do Supabase — filtra pelos filtros ativos
  const _aMes    = document.getElementById('f-mes')?.value || '';
  const _aFilial = document.getElementById('f-filial')?.value || '';
  const _aCc     = document.getElementById('f-cc')?.value || '';
  const _aBusca  = (document.getElementById('f-busca')?.value || '').trim();

  if(!_aMes){
    content.innerHTML='<div style="padding:40px;text-align:center;color:#64748b">Selecione um <strong>mês</strong> para carregar a auditoria.</div>';
    return;
  }

  let auditoria=[],off=0;
  for(;;){
    let q=db.from('consumo_scp')
      .select('produto,descricao,grupo,cc,mes,filial,quantidade,custo_unit,valor_total,custo_fonte,custo_zero')
      .eq('mes',_aMes);
    if(_aFilial) q=q.eq('filial',_aFilial);
    if(_aCc)     q=q.eq('cc',_aCc);
    if(_aBusca)  q=q.ilike('descricao','%'+_aBusca+'%');
    const{data,error}=await q.range(off,off+999);
    if(error||!data||!data.length)break;
    auditoria=auditoria.concat(data);
    if(data.length<1000)break;
    off+=1000;
  }

  if(!auditoria.length){
    content.innerHTML='<div class="loading">Nenhum dado de auditoria disponível. Rode o sync atualizado.</div>';
    return;
  }

  // Aplicar filtros dos selects
  const filial=document.getElementById('f-filial').value;
  const grupo=document.getElementById('f-grupo').value;
  const cc=document.getElementById('f-cc').value;
  const periodo=document.getElementById('f-periodo').value;
  const mes=document.getElementById('f-mes').value;

  const filtrado=auditoria.filter(r=>{
    if(filial&&r.filial!==filial)return false;
    if(grupo&&r.grupo!==grupo)return false;
    if(cc&&r.cc!==cc)return false;
    if(mes&&r.mes!==mes)return false;
    else if(!mes&&periodo!=='todos'&&!r.mes.startsWith(periodo))return false;
    return true;
  });

  // 1. Distribuição por fonte de custo
  const fontes={};
  filtrado.forEach(r=>{
    const f=r.custo_fonte||'ZERO';
    if(!fontes[f])fontes[f]={count:0,valor:0,qtd:0};
    fontes[f].count++;
    fontes[f].valor+=Number(r.valor_total)||0;
    fontes[f].qtd+=Number(r.quantidade)||0;
  });

  const totalReg=filtrado.length;
  const CORES_FONTE={'B2_CM1':'#16a34a','CP_YCUSTD':'#f59e0b','CP_VUNIT':'#3b82f6','SD1_ULTIMO_PRECO':'#8b5cf6','ZERO':'#ef4444'};
  const LABELS_FONTE={'B2_CM1':'✅ Custo Médio (B2_CM1)','CP_YCUSTD':'🟡 Custo do Lote (CP_YCUSTD)','CP_VUNIT':'🔵 Custo Unit. Protheus','SD1_ULTIMO_PRECO':'🟣 Último Preço Compra (SD1)','ZERO':'🔴 Sem Custo'};

  const fontesRows=Object.entries(fontes).sort((a,b)=>b[1].count-a[1].count).map(([f,d])=>`
    <tr>
      <td><span style="display:inline-flex;align-items:center;gap:8px">
        <span style="width:12px;height:12px;border-radius:50%;background:${CORES_FONTE[f]||'#94a3b8'}"></span>
        <strong>${LABELS_FONTE[f]||f}</strong>
      </span></td>
      <td class="num">${d.count.toLocaleString('pt-BR')}</td>
      <td class="num">${((d.count/totalReg)*100).toFixed(1)}%</td>
      <td class="num">${fmtVal(d.valor)}</td>
      <td class="num">${fmtQtd(d.qtd)}</td>
    </tr>`).join('');

  // 2. Busca detalhes dos itens zerados direto da consumo_scp
  let zeradosDetalhe=[],offZ=0;
  for(;;){
    const{data,error}=await db
      .from('consumo_scp')
      .select('filial,produto,descricao,grupo,cc,mes,quantidade,custo_unit,custo_fonte,custo_zero')
      .eq('custo_fonte','ZERO')
      .range(offZ,offZ+999);
    if(error||!data||!data.length)break;
    zeradosDetalhe=zeradosDetalhe.concat(data);
    if(data.length<1000)break;
    offZ+=1000;
  }

  // Aplicar filtros
  const zeradosFilt=zeradosDetalhe.filter(r=>{
    if(filial&&r.filial!==filial)return false;
    if(grupo&&r.grupo!==grupo)return false;
    if(cc&&r.cc!==cc)return false;
    if(mes&&r.mes!==mes)return false;
    else if(!mes&&periodo!=='todos'&&!r.mes.startsWith(periodo))return false;
    return true;
  });

  // 3. Tabela cruzada: produto × mês com custo unitário e variação
  let variacoes=[],offV=0;
  for(;;){
    const{data,error}=await db
      .from('consumo_scp')
      .select('produto,descricao,grupo,filial,mes,quantidade,custo_ycustd,custo_b2cm1,custo_fonte')
      .gt('custo_ycustd',0)
      .gt('custo_b2cm1',0)
      .range(offV,offV+999);
    if(error||!data||!data.length)break;
    variacoes=variacoes.concat(data);
    if(data.length<1000)break;
    offV+=1000;
  }

  // Agrupa por produto+filial × mês — calcula custo médio ponderado por mês
  const prodMesMap={};
  variacoes.filter(r=>{
    if(filial&&r.filial!==filial)return false;
    if(grupo&&r.grupo!==grupo)return false;
    if(!mes&&periodo!=='todos'&&!r.mes.startsWith(periodo))return false;
    return true;
  }).forEach(r=>{
    const chave=`${r.filial}|${r.produto}`;
    if(!prodMesMap[chave])prodMesMap[chave]={filial:r.filial,produto:r.produto,descricao:r.descricao,grupo:r.grupo,meses:{}};
    if(!prodMesMap[chave].meses[r.mes])prodMesMap[chave].meses[r.mes]={totalCusto:0,totalQtd:0};
    prodMesMap[chave].meses[r.mes].totalCusto+=r.custo_ycustd*(r.quantidade||1);
    prodMesMap[chave].meses[r.mes].totalQtd+=(r.quantidade||1);
  });

  // Calcula variação máxima por produto e filtra top 30
  const mesesDisp=[...new Set(variacoes.map(r=>r.mes))].sort();
  const mesesFilt=mes?[mes]:mesesDisp.filter(m=>periodo==='todos'||m.startsWith(periodo));

  const prodList=Object.values(prodMesMap).map(p=>{
    const custos=mesesFilt.map(m=>{
      const d=p.meses[m];
      return d&&d.totalQtd>0?d.totalCusto/d.totalQtd:null;
    }).filter(v=>v!==null);
    const maxVar=custos.length>1?((Math.max(...custos)-Math.min(...custos))/Math.min(...custos)*100):0;
    return{...p,maxVar};
  }).filter(p=>p.maxVar>20).sort((a,b)=>b.maxVar-a.maxVar).slice(0,30);

  const variacaoHTML=prodList.length>0?`
  <div class="card" style="margin-top:16px">
    <div class="card-header">
      <div class="card-title">📊 Variação de Custo Unitário por Mês</div>
      <div class="card-sub">Top 30 itens com maior oscilação • clique na linha para ver detalhes</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Filial</th><th>Código</th><th>Descrição</th>
        ${mesesFilt.map(m=>`<th class="num">${fmtMes(m)}</th>`).join('')}
        <th class="num">Variação</th>
      </tr></thead>
      <tbody>${prodList.map((p,idx)=>{
        let prev=null;
        const cells=mesesFilt.map(m=>{
          const d=p.meses[m];
          const cu=d&&d.totalQtd>0?d.totalCusto/d.totalQtd:null;
          let icone='';
          if(cu!==null&&prev!==null){
            const v=((cu-prev)/prev*100);
            if(v>10)icone=`<span style="color:#dc2626;font-size:10px"> ▲${v.toFixed(0)}%</span>`;
            else if(v<-10)icone=`<span style="color:#16a34a;font-size:10px"> ▼${Math.abs(v).toFixed(0)}%</span>`;
            else icone=`<span style="color:#94a3b8;font-size:10px"> ≈</span>`;
          }
          if(cu!==null)prev=cu;
          return cu!==null?`<td class="num" style="white-space:nowrap">${fmtVal(cu)}${icone}</td>`:`<td class="num" style="color:#cbd5e1">—</td>`;
        }).join('');
        const detalheRows=mesesFilt.map(m=>{
          const d=p.meses[m];
          if(!d||!d.totalQtd)return'';
          const cu=d.totalCusto/d.totalQtd;
          return`<tr style="background:#f8fafc"><td style="padding:4px 16px;font-size:11px;color:#64748b">${fmtMes(m)}</td><td style="padding:4px 8px;font-size:11px">Qtd: <strong>${fmtQtd(d.totalQtd)}</strong></td><td style="padding:4px 8px;font-size:11px">Custo unit.: <strong>${fmtVal(cu)}</strong></td><td style="padding:4px 8px;font-size:11px">Total: ${fmtVal(d.totalCusto)}</td><td colspan="${mesesFilt.length}"></td></tr>`;
        }).join('');
        return`<tr style="cursor:pointer" onclick="toggleVarRow('var-${idx}',this)">
          <td><strong>${p.filial}</strong></td>
          <td style="font-family:monospace;font-size:11px;color:#1e40af">${p.produto}</td>
          <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;font-size:11px">${p.descricao||'—'}</td>
          ${cells}
          <td class="num"><span class="var-badge var-up">▲ ${p.maxVar.toFixed(0)}%</span></td>
        </tr>
        <tr id="var-${idx}" style="display:none;background:#f0f4ff"><td colspan="${mesesFilt.length+4}" style="padding:0"><table style="width:100%;border-collapse:collapse"><tr style="background:#e0e7ff"><td colspan="2" style="padding:6px 16px;font-weight:600;color:#1e40af">📅 ${p.produto} — ${p.filial} — ${p.grupo||''}</td><td colspan="${mesesFilt.length+2}"></td></tr>${detalheRows}</table></td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`:'';

  window.toggleVarRow=function(id,tr){const el=document.getElementById(id);if(!el)return;const open=el.style.display!=='none';el.style.display=open?'none':'table-row';tr.style.background=open?'':'#dbeafe';};

  content.innerHTML=kpisHTML()+`
  <div class="card" style="margin-bottom:16px">
    <div class="card-header">
      <div class="card-title">🧮 Distribuição por Fonte de Custo</div>
      <div class="card-sub">${totalReg.toLocaleString('pt-BR')} registros analisados</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Fonte</th>
        <th class="num">Registros</th>
        <th class="num">% Total</th>
        <th class="num">Valor Total</th>
        <th class="num">Quantidade</th>
      </tr></thead>
      <tbody>${fontesRows}</tbody>
    </table></div>
  </div>

  ${zeradosFilt.length>0?`
  <div class="card">
    <div class="card-header">
      <div class="card-title">🔴 Itens Sem Custo em Nenhuma Fonte (${zeradosFilt.length} registros)</div>
      <div class="card-sub">Precisam de atenção — não há CP_YCUSTD, B2_CM1 nem SD1 disponível</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Filial</th>
        <th>Código</th>
        <th>Descrição</th>
        <th>Grupo</th>
        <th>CC</th>
        <th class="num">Mês</th>
        <th class="num">Qtd</th>
        <th class="num">CP_YCUSTD</th>
        <th class="num">B2_CM1</th>
        <th class="num">SD1</th>
      </tr></thead>
      <tbody>${zeradosFilt.sort((a,b)=>b.quantidade-a.quantidade).map(r=>`<tr class="alerta">
        <td><strong>${r.filial}</strong> <span style="font-size:10px;color:#94a3b8">${FNOMES[r.filial]||''}</span></td>
        <td style="font-family:monospace;font-size:11px;color:#1e40af">${r.produto}</td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${r.descricao||'—'}</td>
        <td style="font-size:11px">${r.grupo||'—'}</td>
        <td style="font-size:11px">${r.cc||'—'}</td>
        <td class="num">${fmtMes(r.mes)}</td>
        <td class="num"><strong>${fmtQtd(r.quantidade)}</strong></td>
        <td class="num"><span class="badge-zero">R$ 0,00</span></td>
        <td class="num"><span class="badge-zero">Sem registro</span></td>
        <td class="num"><span class="badge-zero">Sem NF entrada</span></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`:'<div class="card"><div style="padding:20px;text-align:center;color:#16a34a;font-weight:600">✅ Nenhum item sem custo encontrado!</div></div>'}
  ${variacaoHTML}`;
}

              <td style="padding:9px 12px;text-align:right">${totalQtd.toLocaleString('pt-BR',{maximumFractionDigits:2})}</td>
              <td style="padding:9px 12px;text-align:right">${fmtVal(totalVal)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>`;
  } catch(e){
    content.innerHTML = `<div style="padding:40px;text-align:center;color:#ef4444">Erro: ${e.message}</div>`;
  }
}

// =============================================
// ABA COMPARATIVO (CC x Grupo = SCP + SD3 TM001)
// =============================================
let _dadosDevComp = null;

async function renderComparativo(){
  const content = document.getElementById('content');

  // Meses disponíveis nos dados SCP
  const mesesDisp = [...new Set(_dados.map(r=>r.mes))].filter(Boolean).sort();
  const ultimoMes = mesesDisp[mesesDisp.length-1] || '';
  if(!_mesComparativo) _mesComparativo = ultimoMes;

  content.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b">Carregando comparativo...</div>';

  // Buscar dados de devolução (mov_sd3_001) para o mês
  try {
    if(_dadosDevComp?.mes !== _mesComparativo){
      const {data, error} = await db.from('mov_sd3_001')
        .select('cc,grupo,valor_total')
        .eq('mes', _mesComparativo)
        .limit(50000);
      if(!error) _dadosDevComp = {mes: _mesComparativo, data: data||[]};
    }
  } catch(e){ _dadosDevComp = {mes: _mesComparativo, data:[]}; }

  const devData = _dadosDevComp?.data || [];

  function buildTable(mes){
    const scpFilt = _dados.filter(r => r.mes === mes);
    const fmt = v => v ? 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';

    // Agregar SCP por CC + coluna amigo
    const mapCC = {};
    const mapConsumo = {}; // consumo bruto
    const mapDev = {};     // devolucoes
    scpFilt.forEach(r => {
      const col = GRUPO_DEPARA[r.grupo] || 'OUTROS';
      if(!GRUPOS_COLS.includes(col)) return;
      if(!mapCC[r.cc]) mapCC[r.cc] = {};
      if(!mapConsumo[r.cc]) mapConsumo[r.cc] = {};
      mapCC[r.cc][col] = (mapCC[r.cc][col]||0) + (r.valor_total||0);
      mapConsumo[r.cc][col] = (mapConsumo[r.cc][col]||0) + (r.valor_total||0);
    });

    // Subtrair devoluções (mov_sd3_001) por CC + coluna amigo
    devData.forEach(r => {
      const col = GRUPO_DEPARA[r.grupo] || 'OUTROS';
      if(!GRUPOS_COLS.includes(col)) return;
      // Incluir CC mesmo que não tenha consumo SCP
      if(!mapCC[r.cc]) mapCC[r.cc] = {};
      if(!mapConsumo[r.cc]) mapConsumo[r.cc] = {};
      if(!mapDev[r.cc]) mapDev[r.cc] = {};
      mapCC[r.cc][col] = (mapCC[r.cc][col]||0) - (r.valor_total||0);
      mapDev[r.cc][col] = (mapDev[r.cc][col]||0) + (r.valor_total||0);
    });

    const ccs = Object.keys(mapCC).sort();
    const totaisGrupo = {};
    GRUPOS_COLS.forEach(g => { totaisGrupo[g] = ccs.reduce((a,cc)=>a+(mapCC[cc][g]||0),0); });
    const totalGeral = Object.values(totaisGrupo).reduce((a,v)=>a+v,0);

    return `
      <div style="margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div>
          <label style="font-size:12px;color:#64748b;margin-right:6px">📅 Mês:</label>
          <select id="sel-mes-comp" onchange="_mesComparativo=this.value;_dadosDevComp=null;renderComparativo()" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px">
            ${mesesDisp.map(m=>{
              const nome=new Date(m.slice(0,4),m.slice(4,6)-1,1).toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).toUpperCase();
              return `<option value="${m}" ${m===mes?'selected':''}>${nome}</option>`;
            }).join('')}
          </select>
        </div>
        <div style="font-size:13px;color:#64748b">
          Total: <strong style="color:#0f172a">R$ ${totalGeral.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong>
          <span style="font-size:11px;color:#94a3b8;margin-left:8px">(Consumo SCP - Devoluções SD3 TM001)</span>
        </div>
      </div>
      <div style="overflow:auto;background:#fff;border-radius:12px;border:1px solid #e2e8f0">
        <table style="width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap">
          <thead>
            <tr style="background:#1e3a5f;color:#fff">
              <th style="padding:10px 14px;text-align:left;position:sticky;left:0;background:#1e3a5f;z-index:2">C.CUSTO</th>
              ${GRUPOS_COLS.map(g=>`<th style="padding:10px 8px;text-align:right">${g}</th>`).join('')}
              <th style="padding:10px 14px;text-align:right;background:#0f2a47">Total Geral</th>
            </tr>
          </thead>
          <tbody>
            ${ccs.map((cc,i)=>{
              const totalLinha = GRUPOS_COLS.reduce((a,g)=>a+(mapCC[cc][g]||0),0);
              return `<tr style="background:${i%2?'#f8fafc':'#fff'};border-bottom:1px solid #f1f5f9">
                <td style="padding:7px 14px;font-weight:600;position:sticky;left:0;background:${i%2?'#f8fafc':'#fff'};z-index:1">${cc}</td>
                ${GRUPOS_COLS.map(g=>{
                  const v=mapCC[cc][g]||0;
                  const cons=mapConsumo[cc]?.[g]||0;
                  const dev=mapDev[cc]?.[g]||0;
                  const tip = cons||dev ? `Consumo: ${fmt(cons)}&#10;Devolução: ${fmt(dev)}&#10;Líquido: ${fmt(v)}` : '';
                  const temDev = dev > 0;
                  return `<td style="padding:7px 8px;text-align:right;${v<0?'color:#ef4444':''}${temDev?';font-weight:700':''};cursor:${tip?'help':''}" title="${tip}">${v?fmt(v):'—'}</td>`;
                }).join('')}
                <td style="padding:7px 14px;text-align:right;font-weight:700">${fmt(totalLinha)}</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot>
            <tr style="background:#1e3a5f;color:#fff;font-weight:700">
              <td style="padding:10px 14px;position:sticky;left:0;background:#1e3a5f;z-index:2">Total Geral</td>
              ${GRUPOS_COLS.map(g=>`<td style="padding:10px 8px;text-align:right">${fmt(totaisGrupo[g])}</td>`).join('')}
              <td style="padding:10px 14px;text-align:right">${fmt(totalGeral)}</td>
            </tr>
          </tfoot>
        </table>
      </div>`;
  }

  content.innerHTML = buildTable(_mesComparativo);
}


async function exportarExcel(){
  const filial=document.getElementById('f-filial').value;
  const grupo=document.getElementById('f-grupo').value;
  const cc=document.getElementById('f-cc').value;
  const periodo=document.getElementById('f-periodo').value;
  const mes=document.getElementById('f-mes').value;

  // Overlay de progresso
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
  overlay.innerHTML=`<div style="background:#fff;border-radius:16px;padding:32px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <div class="spinner" style="margin:0 auto 16px"></div>
    <div id="excel-msg" style="font-size:14px;font-weight:600;color:#1e293b">Buscando dados completos...</div>
    <div id="excel-sub" style="font-size:12px;color:#64748b;margin-top:4px"></div>
  </div>`;
  document.body.appendChild(overlay);
  const setMsg=(m,s)=>{document.getElementById('excel-msg').textContent=m;document.getElementById('excel-sub').textContent=s||'';};

  try{
    // ── Buscar consumo_scp COMPLETO (bruto) ──────────────────────────
    setMsg('Buscando consumo...','consumo_scp');
    let consumo=[],off=0;
    for(;;){
      let q=db.from('consumo_scp')
        .select('filial,num,item,produto,descricao,grupo,cc,mes,emissao,quantidade,custo_unit,valor_total,custo_zero,motivo,custo_fonte')
        .order('chave').range(off,off+999);
      if(filial) q=q.eq('filial',filial);
      if(grupo)  q=q.eq('grupo',grupo);
      if(cc)     q=q.eq('cc',cc);
      if(mes)    q=q.eq('mes',mes);
      else if(periodo==='2026') q=q.like('mes','2026%');
      else if(periodo==='2025') q=q.like('mes','2025%');
      const{data,error}=await q;
      if(error||!data||!data.length)break;
      consumo=consumo.concat(data);
      setMsg(`Buscando consumo...`,`${consumo.length.toLocaleString('pt-BR')} registros`);
      if(data.length<1000)break;
      off+=data.length;
    }

    // ── Buscar mov_sd3_001 COMPLETO (bruto) ──────────────────────────
    setMsg('Buscando devoluções...','mov_sd3_001');
    let devolucoes=[],off2=0;
    for(;;){
      let q=db.from('mov_sd3_001')
        .select('filial,produto,descricao,grupo,cc,emissao,mes,matricula,documento,observacao,tipo_rede,quantidade,custo_unit,valor_total,custo_fonte')
        .order('id').range(off2,off2+999);
      if(filial) q=q.eq('filial',filial);
      if(grupo)  q=q.eq('grupo',grupo);
      if(cc)     q=q.eq('cc',cc);
      if(mes)    q=q.eq('mes',mes);
      else if(periodo==='2026') q=q.like('mes','2026%');
      else if(periodo==='2025') q=q.like('mes','2025%');
      const{data,error}=await q;
      if(error||!data||!data.length)break;
      devolucoes=devolucoes.concat(data);
      setMsg(`Buscando devoluções...`,`${devolucoes.length.toLocaleString('pt-BR')} registros`);
      if(data.length<1000)break;
      off2+=data.length;
    }

    if(!consumo.length && !devolucoes.length){
      overlay.remove();
      alert('Nenhum dado encontrado para os filtros selecionados.');
      return;
    }

    // ── Montar aba Consumo ────────────────────────────────────────────
    setMsg('Gerando planilha...','Aba Consumo');
    const fmtDt=d=>d?d.slice(6,8)+'/'+d.slice(4,6)+'/'+d.slice(0,4):'';
    const fmtMesExcel=m=>m?m.slice(4,6)+'/'+m.slice(0,4):'';

    const rowsConsumo=consumo.map(r=>({
      'Filial':r.filial,
      'Nome Filial':FNOMES[r.filial]||'',
      'Nº Requisição':r.num||'',
      'Item':r.item||'',
      'Produto':r.produto||'',
      'Descrição':r.descricao||'',
      'Grupo':r.grupo||'',
      'CC':r.cc||'',
      'Nome CC':_ccMap[r.cc]||'',
      'Mês':fmtMesExcel(r.mes),
      'Emissão':fmtDt(r.emissao),
      'Motivo':r.motivo||'',
      'Quantidade':r.quantidade||0,
      'Custo Unit.':r.custo_unit||0,
      'Valor Total':r.valor_total||0,
      'Fonte Custo':r.custo_fonte||'',
      'Custo Zero':r.custo_zero?'SIM':'NÃO',
    }));

    // ── Montar aba Devoluções ─────────────────────────────────────────
    setMsg('Gerando planilha...','Aba Devoluções');
    const rowsDev=devolucoes.map(r=>({
      'Filial':r.filial,
      'Nome Filial':FNOMES[r.filial]||'',
      'Produto':r.produto||'',
      'Descrição':r.descricao||'',
      'Grupo':r.grupo||'',
      'CC':r.cc||'',
      'Nome CC':_ccMap[r.cc]||'',
      'Mês':fmtMesExcel(r.mes),
      'Emissão':fmtDt(r.emissao),
      'Matrícula':r.matricula||'',
      'Documento':r.documento||'',
      'Tipo Rede':r.tipo_rede||'',
      'Quantidade':r.quantidade||0,
      'Custo Unit.':r.custo_unit||0,
      'Valor Total':r.valor_total||0,
      'Fonte Custo':r.custo_fonte||'',
      'Observação':r.observacao||'',
    }));

    // ── Gerar Excel com 2 abas ───────────────────────────────────────
    setMsg('Salvando arquivo...',`${rowsConsumo.length} + ${rowsDev.length} linhas`);
    const wb=XLSX.utils.book_new();

    const wsC=XLSX.utils.json_to_sheet(rowsConsumo);
    XLSX.utils.book_append_sheet(wb,wsC,'Consumo');

    const wsD=XLSX.utils.json_to_sheet(rowsDev);
    XLSX.utils.book_append_sheet(wb,wsD,'Devoluções');

    const dt=new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
    const filtroLabel=filial?`_filial${filial}`:'';
    XLSX.writeFile(wb,`fechamento_completo${filtroLabel}_${dt}.xlsx`);

    overlay.remove();
  }catch(e){
    overlay.remove();
    alert('Erro ao exportar: '+e.message);
    console.error(e);
  }
}
